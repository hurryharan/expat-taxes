      function usePersisted(key, defaultVal) {
        const [state, setState] = React.useState(() => {
          try {
            const saved = localStorage.getItem(key);
            if (saved) return { ...defaultVal, ...JSON.parse(saved) };
          } catch (e) {}
          return defaultVal;
        });
        const set = React.useCallback(
          (valOrFn) => {
            setState((prev) => {
              const next =
                typeof valOrFn === "function" ? valOrFn(prev) : valOrFn;
              try {
                localStorage.setItem(key, JSON.stringify(next));
              } catch (e) {}
              return next;
            });
          },
          [key],
        );
        return [state, set];
      }

      function App() {
        const [tab, setTab] = React.useState("income");
        const [settings, setSettings] = usePersisted(
          "expattax_settings",
          DEFAULT_SETTINGS,
        );
        const [income, setIncome] = usePersisted(
          "expattax_income",
          DEFAULT_INCOME,
        );

        const handleSaveSettings = (newSettings) => {
          setSettings(newSettings);
          setTab("income");
        };

        const handleToggleMode = (newMode) => {
          setSettings((prev) => ({ ...prev, splitIncomeMode: newMode }));
        };

        const {
          inrToUsd,
          myrToUsd,
          taxYear,
          filingStatus,
          useNewIndia,
          expatTaxRegime,
          useFEIE,
          expatCountry,
          currency,
          includeExpat,
          includeUS,
          splitIncomeMode,
        } = settings;
        const expatToUsd = expatCountry === "Malaysia" ? myrToUsd : inrToUsd;
        const isCombined = splitIncomeMode === "combined";

        function toUSD(v) {
          return currency !== "USD" ? v / expatToUsd : v;
        }
        function toINR(v) {
          return currency === "USD" ? v * expatToUsd : v;
        }

        const usRentalGrossUSD = toUSD(income.usRentalGross);
        const usPropertyPriceUSD = toUSD(settings.usPropertyPrice || 0);
        const usAutoDepreciation = (usPropertyPriceUSD * 0.8) / 27.5;
        const usRentalNet = Math.max(
          0,
          usRentalGrossUSD -
            toUSD(income.usRentalMortgageInterest) -
            toUSD(income.usRentalPropertyTax) -
            usAutoDepreciation -
            toUSD(income.usRentalOtherExpenses),
        );

        const indiaRentalDetailINR = calcIndiaRentalIncome({
          grossRent: toINR(income.indiaRentalGross),
          reTax: toINR(income.indiaRentalReTax),
          additionalExpenses: toINR(income.indiaRentalAddlExpenses),
          interest: toINR(income.indiaRentalInterest),
          isMalaysia: expatCountry === "Malaysia",
        });

        // US rental income is also taxable in India for Indian residents (global income).
        // Computed under India's house property rules (Sec 22-27):
        // - Property tax deductible, 30% standard deduction (Sec 24a), loan interest (Sec 24b)
        // - NO depreciation (India doesn't allow it), NO other expense offsets
        const usRentalUnderIndiaRulesINR = expatCountry === 'Malaysia'
          ? { grossRent: 0, reTax: 0, additionalExpenses: 0, interest: 0, revenueAfterExpenses: 0, profitAfterReTax: 0, stdDeduction30: 0, profitAfterSD: 0, netAfterInterest: 0 }
          : calcIndiaRentalIncome({
              grossRent: toINR(income.usRentalGross),
              reTax: toINR(income.usRentalPropertyTax),
              additionalExpenses: 0,
              interest: toINR(income.usRentalMortgageInterest),
            });

        // Combined rental income for India tax purposes (both properties)
        const totalIndiaRentalNetINR =
          indiaRentalDetailINR.netAfterInterest +
          usRentalUnderIndiaRulesINR.netAfterInterest;

        // Helper: get per-spouse value for a field (respects split toggle)
        function spouseVal(fieldKey, spouseNum) {
          const total = toINR(income[fieldKey] || 0);
          if (!income[fieldKey + "_split"]) return total / 2;
          const s1 = toINR(
            income[fieldKey + "_s1"] !== undefined
              ? income[fieldKey + "_s1"]
              : total / 2,
          );
          return spouseNum === 1 ? s1 : Math.max(0, total - s1);
        }

        // Separate special-rate income (STCG, LTCG) from ordinary income for India
        const indiaStcgINR = toINR(income.shortTermGains || 0);
        const indiaLtcgINR = toINR(income.longTermGains || 0);

        const indiaOrdinaryIncomeINR = isCombined
          ? toINR(income.wages) +
            toINR(income.businessIncome) +
            toINR(income.interest) +
            toINR(income.ordinaryDividends)
          : toINR(income.indiaSalary) + toINR(income.indiaOtherIncome);

        const indiaTotalIncomeINR =
          indiaOrdinaryIncomeINR +
          totalIndiaRentalNetINR +
          indiaStcgINR +
          indiaLtcgINR;

        // Per-spouse ordinary income (respects split toggles)
        const includeGlobalInvestment = expatCountry !== 'Malaysia';
        const indiaOrdS1 = isCombined
          ? spouseVal("wages", 1) +
            spouseVal("businessIncome", 1) +
            (includeGlobalInvestment ? toINR(income.interest || 0) / 2 + toINR(income.ordinaryDividends || 0) / 2 : 0)
          : spouseVal("indiaSalary", 1) + spouseVal("indiaOtherIncome", 1);
        const indiaOrdS2 = isCombined
          ? spouseVal("wages", 2) +
            spouseVal("businessIncome", 2) +
            (includeGlobalInvestment ? toINR(income.interest || 0) / 2 + toINR(income.ordinaryDividends || 0) / 2 : 0)
          : spouseVal("indiaSalary", 2) + spouseVal("indiaOtherIncome", 2);

        const indiaRentalPerSpouse = totalIndiaRentalNetINR / 2;
        const indiaSpecialS1 = {
          stcg: (isCombined && !includeGlobalInvestment) ? 0 : spouseVal("shortTermGains", 1),
          ltcgEquity: (isCombined && !includeGlobalInvestment) ? 0 : spouseVal("longTermGains", 1),
          ltcgOther: 0,
        };
        const indiaSpecialS2 = {
          stcg: (isCombined && !includeGlobalInvestment) ? 0 : spouseVal("shortTermGains", 2),
          ltcgEquity: (isCombined && !includeGlobalInvestment) ? 0 : spouseVal("longTermGains", 2),
          ltcgOther: 0,
        };

        const hasSalaryIndia = isCombined
          ? toINR(income.wages) > 0
          : toINR(income.indiaSalary) > 0;

        const indiaTd = INDIA_TAX_DATA[taxYear];
        let indiaResult = null;
        if (includeExpat) {
          if (expatCountry === "Malaysia") {
            const r1 = calcMalaysiaTax(
              indiaOrdS1 + indiaRentalPerSpouse,
              expatTaxRegime === "resident",
              indiaSpecialS1,
              taxYear,
            );
            const r2 = calcMalaysiaTax(
              indiaOrdS2 + indiaRentalPerSpouse,
              expatTaxRegime === "resident",
              indiaSpecialS2,
              taxYear,
            );
            indiaResult = {
              spouse1: {
                incomeINR: indiaOrdS1 + indiaRentalPerSpouse,
                result: r1,
              },
              spouse2: {
                incomeINR: indiaOrdS2 + indiaRentalPerSpouse,
                result: r2,
              },
              total: {
                totalINR: r1.total + r2.total,
                totalCess: r1.cess + r2.cess,
                totalSurcharge: r1.surcharge + r2.surcharge,
                effectiveRate:
                  indiaTotalIncomeINR > 0
                    ? ((r1.total + r2.total) / indiaTotalIncomeINR) * 100
                    : 0,
              },
              indiaPropertyDetail: {
                ...indiaRentalDetailINR,
                grossRent: toINR(income.indiaRentalGross),
                reTax: toINR(income.indiaRentalReTax),
                additionalExpenses: toINR(income.indiaRentalAddlExpenses),
                interest: toINR(income.indiaRentalInterest),
                label: "Malaysia Property",
              },
              usPropertyDetail: {
                ...usRentalUnderIndiaRulesINR,
                grossRent: toINR(income.usRentalGross),
                reTax: toINR(income.usRentalPropertyTax),
                additionalExpenses: 0,
                interest: toINR(income.usRentalMortgageInterest),
                label: "US Property (taxed under Malaysia rules)",
              },
              totalRentalNetINR: totalIndiaRentalNetINR,
            };
          } else if (indiaTd) {
            const r1 = calcIndiaTax(
              indiaOrdS1 + indiaRentalPerSpouse,
              indiaTd,
              useNewIndia,
              hasSalaryIndia,
              indiaSpecialS1,
              taxYear,
            );
            const r2 = calcIndiaTax(
              indiaOrdS2 + indiaRentalPerSpouse,
              indiaTd,
              useNewIndia,
              hasSalaryIndia,
              indiaSpecialS2,
              taxYear,
            );
            indiaResult = {
              spouse1: {
                incomeINR: indiaOrdS1 + indiaRentalPerSpouse,
                result: r1,
              },
              spouse2: {
                incomeINR: indiaOrdS2 + indiaRentalPerSpouse,
                result: r2,
              },
              total: {
                totalINR: r1.total + r2.total,
                totalCess: r1.cess + r2.cess,
                totalSurcharge: r1.surcharge + r2.surcharge,
                effectiveRate:
                  indiaTotalIncomeINR > 0
                    ? ((r1.total + r2.total) / indiaTotalIncomeINR) * 100
                    : 0,
              },
              indiaPropertyDetail: {
                ...indiaRentalDetailINR,
                grossRent: toINR(income.indiaRentalGross),
                reTax: toINR(income.indiaRentalReTax),
                additionalExpenses: toINR(income.indiaRentalAddlExpenses),
                interest: toINR(income.indiaRentalInterest),
                label: "India Property",
              },
              usPropertyDetail: {
                ...usRentalUnderIndiaRulesINR,
                grossRent: toINR(income.usRentalGross),
                reTax: toINR(income.usRentalPropertyTax),
                additionalExpenses: 0,
                interest: toINR(income.usRentalMortgageInterest),
                label: "US Property (taxed under India rules)",
              },
              totalRentalNetINR: totalIndiaRentalNetINR,
            };
          }
        }

        const indiaTaxUSD = indiaResult
          ? indiaResult.total.totalINR / expatToUsd
          : 0;

        const usIncome = {
          wages: toUSD(income.wages),
          businessIncome: toUSD(income.businessIncome),
          rentalNet: usRentalNet,
          rentalMortgageInterest: toUSD(income.usRentalMortgageInterest),
          rentalPropertyTax: toUSD(income.usRentalPropertyTax),
          rentalOtherExpenses: toUSD(income.usRentalOtherExpenses),
          interest: toUSD(income.interest),
          ordinaryDividends: toUSD(income.ordinaryDividends),
          qualifiedDividends: toUSD(income.qualifiedDividends),
          exemptIntDividends: toUSD(income.exemptIntDividends),
          sec199aDividends: toUSD(income.sec199aDividends),
          longTermGains: toUSD(income.longTermGains),
          shortTermGains: toUSD(income.shortTermGains),
          filingStatus,
          year: taxYear,
          indiaTaxPaid: indiaTaxUSD,
          useFEIE,
        };

        let usResult = null;
        if (includeUS && US_TAX_DATA[taxYear]) {
          usResult = calcUSTax(usIncome);
        }

        const totalUSTax = usResult ? usResult.netUSTax : 0;
        const totalIndiaTax = indiaResult ? indiaResult.total.totalINR : 0;
        const totalIndiaTaxUSD = totalIndiaTax / expatToUsd;
        const combinedTaxUSD = totalUSTax + totalIndiaTaxUSD;
        // In combined mode both countries share the same income — don't double-count
        const combinedIncomeUSD = isCombined
          ? usResult
            ? usResult.totalGrossIncome
            : indiaTotalIncomeINR / expatToUsd
          : (usResult ? usResult.totalGrossIncome : 0) +
            indiaTotalIncomeINR / expatToUsd;

        return (
          <div>

                {/* Banner */}

                    <div

                    <div

                        color: "var(--text3)",

                      After FTC
                    </div>
                  </div>
                  <div

                      background: "var(--border)",
                    }}
                  />
                  <div className="total-banner-item">
                    <div className="total-banner-label">
                      {settings.expatCountry} Tax (Combined)
                    </div>
                    <div
                      className="total-banner-val"
                      style={{ color: "var(--orange)" }}
                    >
                      {fmt(totalIndiaTax, expatCountry === "Malaysia" ? "MYR" : "INR")}
                    </div>
                    <div
                      style={{
                        fontSize: 11,
                        color: "var(--text3)",
                        marginTop: 2,

                    >
                      {fmt(totalIndiaTaxUSD, "USD")}
                    </div>
                  </div>
                  <div
                    style={{
                      width: 1,
                      height: 60,
                      background: "var(--border)",
                    }}
                  />
                  <div className="total-banner-item">
                    <div className="total-banner-label">Total Combined</div>
                    <div
                      className="total-banner-val"
                      style={{ color: "var(--gold)" }}
                    >
                      {fmt(combinedTaxUSD, "USD")}
                    </div>
                    <div
                      style={{
                        fontSize: 11,
                        color: "var(--text3)",
                        marginTop: 2,
                      }}
                    >
                      {combinedIncomeUSD > 0
                        ? pct((combinedTaxUSD / combinedIncomeUSD) * 100)
                        : ""}{" "}
                      combined eff. rate
                    </div>
                  </div>
                  <div
                    style={{
                      width: 1,
                      height: 60,
                      background: "var(--border)",
                    }}
                  />
                  <div className="total-banner-item">
                    <div className="total-banner-label">FTC Credit Used</div>
                    <div
                      className="total-banner-val"
                      style={{ color: "var(--green)" }}
                    >
                      {usResult ? fmt(usResult.ftcClaimed, "USD") : "—"}
                    </div>
                    <div
                      style={{
                        fontSize: 11,
                        color: "var(--text3)",
                        marginTop: 2,
                      }}
                    >
                      Reduces US tax
                    </div>
                  </div>
                </div>

                {indiaResult && (
                  <ExpatResultCard
                    result={indiaResult}
                    settings={settings}
                    inrToUsd={expatToUsd}
                    taxYear={taxYear}
                    incomeINR={{
                      salary: isCombined
                        ? toINR(income.wages)
                        : toINR(income.indiaSalary || 0),
                      business: isCombined ? toINR(income.businessIncome) : 0,
                      other: toINR(income.indiaOtherIncome || 0),
                      rental: totalIndiaRentalNetINR,
                      combined: isCombined,
                      interest: toINR(income.interest || 0),
                      dividends: toINR(income.ordinaryDividends || 0),
                      stcg: indiaStcgINR,
                      ltcgEquity: indiaLtcgINR,
                    }}
                  />
                )}
                {usResult && (
                  <USResultCard
                    result={usResult}
                    settings={settings}
                    indiaTaxUSD={indiaTaxUSD}
                    usIncome={usIncome}
                    usAutoDepreciation={usAutoDepreciation}
                    usRentalGrossUSD={usRentalGrossUSD}
                  />
                )}

                {!includeExpat && !includeUS && (
                  <div
                    className="info-box"
                    style={{ textAlign: "center", padding: 32 }}
                  >
                    Enable at least one country in Settings to see results.
                  </div>
                )}

                <div
                  style={{
                    fontSize: 11,
                    color: "var(--text3)",
                    marginTop: 24,
                    padding: "16px",
                    background: "var(--bg2)",
                    borderRadius: 8,
                    lineHeight: 1.7,
                  }}
                >
                  <strong style={{ color: "var(--text3)" }}>Disclaimer:</strong>{" "}
                  This tool provides estimates for informational purposes only.
                  Tax laws are complex and change frequently. Always consult a
                  qualified CPA or tax attorney for advice specific to your
                  situation. This calculator does not account for state taxes,
                  AMT, FEIE, foreign pension income, treaty provisions, or all
                  possible deductions.
                </div>
              </div>
            )}

            {tab === "planning" && (
              <PlanningTab
                usResult={usResult}
                indiaResult={indiaResult}
                usIncome={usIncome}
                income={income}
                settings={settings}
                inrToUsd={expatToUsd}
                taxYear={taxYear}
                indiaTotalIncomeINR={indiaTotalIncomeINR}
                isCombined={isCombined}
              />
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
