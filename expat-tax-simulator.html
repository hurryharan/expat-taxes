<!doctype html>
<html lang="en">

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "IBM Plex Sans", sans-serif;
        background: #0f1117;
        color: #e8e9eb;
        min-height: 100vh;
      }

      :root {
        --bg: #0f1117;
        --bg2: #161b26;
        --bg3: #1e2535;
        --bg4: #252d40;
        --border: #2a3348;
        --border2: #3a4560;
        --text: #e8e9eb;
        --text2: #9aa3b8;
        --text3: #606880;
        --blue: #4a9eff;
        --blue2: #1a4a8a;
        --blue3: #0d2545;
        --green: #3ecf8e;
        --green2: #1a6b4a;
        --green3: #0d3522;
        --orange: #f59e42;
        --orange2: #7a4a10;
        --red: #f06060;
        --red2: #7a1a1a;
        --purple: #a78bfa;
        --purple2: #4a2a8a;
        --gold: #e8c84a;
        --radius: 8px;
        --radius2: 12px;
      }

      input,
      select,
      textarea {
        background: var(--bg3);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: var(--radius);
        padding: 8px 12px;
        font-family: inherit;
        font-size: 14px;
        outline: none;
        transition: border 0.2s;
        width: 100%;
      }

      input:focus,
      select:focus {
        border-color: var(--blue);
      }

      input[type="number"] {
        font-family: "IBM Plex Mono", monospace;
      }

      button {
        cursor: pointer;
        font-family: inherit;
        border: none;
        border-radius: var(--radius);
        font-size: 13px;
        font-weight: 500;
        transition: all 0.15s;
      }

      .tab-btn {
        background: transparent;
        color: var(--text2);
        padding: 8px 16px;
        border-radius: var(--radius);
        border: 1px solid transparent;
      }

      .tab-btn.active {
        background: var(--bg3);
        color: var(--text);
        border-color: var(--border);
      }

      .tab-btn:hover:not(.active) {
        color: var(--text);
      }

      .section-card {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: var(--radius2);
        padding: 20px;
        margin-bottom: 16px;
      }

      .label {
        font-size: 12px;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 6px;
      }

      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 12px;
      }

      .field-row-3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
        margin-bottom: 12px;
      }

      .field-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 12px;
      }

      .mono {
        font-family: "IBM Plex Mono", monospace;
      }

      .positive {
        color: var(--green);
      }

      .negative {
        color: var(--red);
      }

      .dimmed {
        color: var(--text3);
      }

      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 500;
      }

      .badge-blue {
        background: var(--blue3);
        color: var(--blue);
      }

      .badge-green {
        background: var(--green3);
        color: var(--green);
      }

      .badge-orange {
        background: var(--orange2);
        color: var(--orange);
      }

      .badge-red {
        background: var(--red2);
        color: var(--red);
      }

      .toggle-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .toggle {
        position: relative;
        width: 40px;
        height: 22px;
        flex-shrink: 0;
      }

      .toggle input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .toggle-slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: var(--bg4);
        border-radius: 11px;
        transition: 0.2s;
      }

      .toggle-slider:before {
        position: absolute;
        content: "";
        height: 16px;
        width: 16px;
        left: 3px;
        bottom: 3px;
        background: var(--text3);
        border-radius: 50%;
        transition: 0.2s;
      }

      .toggle input:checked + .toggle-slider {
        background: var(--blue2);
      }

      .toggle input:checked + .toggle-slider:before {
        transform: translateX(18px);
        background: var(--blue);
      }

      .divider {
        border: none;
        border-top: 1px solid var(--border);
        margin: 16px 0;
      }

      .number-tag {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
      }

      .breakdown-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
      }

      .breakdown-row:last-child {
        border-bottom: none;
      }

      .breakdown-row.total {
        font-weight: 600;
        font-size: 15px;
        padding-top: 12px;
        border-top: 2px solid var(--border2);
        border-bottom: none;
        margin-top: 4px;
      }

      .breakdown-row.sub {
        padding-left: 16px;
        font-size: 13px;
        color: var(--text2);
      }

      .breakdown-row.sub .breakdown-val {
        font-size: 13px;
      }

      .breakdown-val {
        font-family: "IBM Plex Mono", monospace;
        font-size: 14px;
      }

      .country-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .flag {
        font-size: 24px;
      }

      .country-title {
        font-size: 18px;
        font-weight: 600;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 16px;
      }

      .metric-card {
        background: var(--bg3);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
      }

      .metric-label {
        font-size: 11px;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 6px;
      }

      .metric-val {
        font-size: 20px;
        font-weight: 600;
        font-family: "IBM Plex Mono", monospace;
      }

      .metric-sub {
        font-size: 11px;
        color: var(--text3);
        margin-top: 2px;
      }

      .nav {
        display: flex;
        gap: 6px;
        padding: 16px 24px;
        background: var(--bg2);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .nav-logo {
        font-weight: 600;
        font-size: 15px;
        color: var(--blue);
        margin-right: 16px;
        display: flex;
        align-items: center;
      }

      .main-wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }

      .side-by-side {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .save-btn {
        background: var(--blue);
        color: white;
        padding: 9px 20px;
        border-radius: var(--radius);
        font-size: 13px;
        font-weight: 600;
      }

      .save-btn:hover {
        background: #2a8ef0;
      }

      .section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text2);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        margin-bottom: 14px;
      }

      .info-box {
        background: var(--bg3);
        border: 1px solid var(--border);
        border-left: 3px solid var(--blue);
        border-radius: var(--radius);
        padding: 12px 14px;
        font-size: 13px;
        color: var(--text2);
        margin-top: 8px;
      }

      .warn-box {
        background: var(--bg3);
        border: 1px solid var(--border);
        border-left: 3px solid var(--orange);
        border-radius: var(--radius);
        padding: 12px 14px;
        font-size: 13px;
        color: var(--text2);
        margin-top: 8px;
      }

      .total-banner {
        background: linear-gradient(135deg, var(--bg3), var(--bg4));
        border: 1px solid var(--border2);
        border-radius: var(--radius2);
        padding: 24px;
        margin-bottom: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
      }

      .total-banner-item {
        text-align: center;
      }

      .total-banner-label {
        font-size: 12px;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 4px;
      }

      .total-banner-val {
        font-size: 26px;
        font-weight: 600;
        font-family: "IBM Plex Mono", monospace;
      }

      .ftc-banner {
        background: var(--green3);
        border: 1px solid var(--green2);
        border-radius: var(--radius);
        padding: 12px 16px;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      hr.section-sep {
        border: none;
        border-top: 1px solid var(--border);
        margin: 20px 0;
      }

      @media (max-width: 700px) {
        .side-by-side,
        .metric-grid,
        .field-row,
        .field-row-3 {
          grid-template-columns: 1fr;
        }

        .total-banner {
          flex-direction: column;
          text-align: center;
        }
      }

      select option {
        background: var(--bg3);
      }
    </style>
  </head>

      // India tax data (new regime slabs) - FY years (e.g. 2024 = FY2024-25)

      // Malaysia tax data
      const MALAYSIA_TAX_DATA = {};
      [
        2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025,
      ].forEach((y) => {
        MALAYSIA_TAX_DATA[y] = {
          slabs: [
            { max: 5000, rate: 0 },
            { max: 20000, rate: 0.01 },
            { max: 35000, rate: 0.03 },
            { max: 50000, rate: 0.06 },
            { max: 70000, rate: 0.11 },
            { max: 100000, rate: 0.19 },
            { max: 400000, rate: 0.25 },
            { max: 600000, rate: 0.26 },
            { max: 2000000, rate: 0.28 },
            { max: Infinity, rate: 0.3 },
          ],
          nonResidentRate: 0.3,
          personalRelief: 9000,
        };
      });

      function calcMalaysiaTax(
        ordinaryIncomeMYR,
        useResident,
        specialIncome,
        year,
      ) {
        const stcg = specialIncome?.stcg || 0;
        const ltcg =
          (specialIncome?.ltcgEquity || 0) + (specialIncome?.ltcgOther || 0);
        const data = MALAYSIA_TAX_DATA[year] || MALAYSIA_TAX_DATA[2024];

        const sd = useResident ? data.personalRelief : 0;
        const taxableOrdinary = Math.max(0, ordinaryIncomeMYR - sd);

        let baseTax = 0;
        if (useResident) {
          let prev = 0;
          for (const s of data.slabs) {
            if (taxableOrdinary <= prev) break;
            baseTax += (Math.min(taxableOrdinary, s.max) - prev) * s.rate;
            prev = s.max;
          }
        } else {

      function calcIndiaSurcharge(taxableIncome, baseTax, year, newRegime) {
        // New regime caps surcharge at 25%; old regime goes up to 37%
        // Thresholds: 50L, 1Cr, 2Cr, 5Cr
        const INR_50L = 5000000;
        const INR_1CR = 10000000;
        const INR_2CR = 20000000;
        const INR_5CR = 50000000;
        let surchargeRate = 0;
        if (taxableIncome > INR_5CR) surchargeRate = newRegime ? 0.25 : 0.37;
        else if (taxableIncome > INR_2CR) surchargeRate = 0.25;
        else if (taxableIncome > INR_1CR) surchargeRate = 0.15;
        else if (taxableIncome > INR_50L) surchargeRate = 0.1;
        return baseTax * surchargeRate;
      }

      function calcIndiaSlabTax(income, slabs) {
        let tax = 0;
        let prev = 0;
        for (const s of slabs) {
          if (income <= prev) break;
          const taxable = Math.min(income, s.max) - prev;
          tax += taxable * s.rate;
          prev = s.max;
        }
        return tax;
      }

      // India rental calc per the sample math provided
      // Revenue - RE Tax - 30% std deduction on (Revenue - RE Tax) - Interest = taxable
      function calcIndiaRentalIncome({
        grossRent,
        reTax,
        additionalExpenses,
        interest,
        isMalaysia,
      }) {
        const revenueAfterExpenses = grossRent - (additionalExpenses || 0);
        const profitAfterReTax = revenueAfterExpenses - reTax;
        const stdDeduction30 = isMalaysia ? 0 : (profitAfterReTax * 0.3);
        const profitAfterSD = profitAfterReTax - stdDeduction30;
        const netAfterInterest = profitAfterSD - interest;
        return {
          revenueAfterExpenses,
          profitAfterReTax,
          stdDeduction30,
          profitAfterSD,
          netAfterInterest: Math.max(0, netAfterInterest),
        };
      }

      // India special flat rates by FY year
      // STCG on equity (111A): 15% until FY2024, 20% from FY2024 onwards
      // LTCG on equity (112A): 10% above 1L until FY2024, 12.5% from FY2024 (exemption removed)
      // LTCG other (112): 20% with indexation (old regime) / 12.5% without (new regime from FY2024)
      function getIndiaSpecialRates(year, useNewRegime) {
        if (year >= 2024) {
          return {
            stcgEquityRate: 0.2, // Sec 111A, raised in Budget 2024
            ltcgEquityRate: 0.125, // Sec 112A, raised in Budget 2024
            ltcgEquityExemption: 0, // ₹1L exemption removed from FY2024-25 (Budget 2024)
            ltcgOtherRate: useNewRegime ? 0.125 : 0.2, // new regime: 12.5% no indexation
          };
        }
        return {
          stcgEquityRate: 0.15, // Sec 111A
          ltcgEquityRate: 0.1, // Sec 112A
          ltcgEquityExemption: 100000, // ₹1L exempt
          ltcgOtherRate: 0.2, // Sec 112 with indexation
        };
      }

      function calcIndiaTax(
        ordinaryIncomeINR,
        data,
        useNewRegime,
        includeStdDeduction,
        specialIncome,
        year,
      ) {
        // specialIncome: {stcg, ltcgEquity, ltcgOther} — all in INR per spouse, default 0
        const si = specialIncome || {};
        const stcg = si.stcg || 0;
        const ltcgEquity = si.ltcgEquity || 0;
        const ltcgOther = si.ltcgOther || 0;
        const rates = getIndiaSpecialRates(year || 2024, useNewRegime);

        const sd = useNewRegime
          ? data.newStdDeduction || 0
          : data.stdDeduction || 0;
        const effectiveSD = includeStdDeduction ? sd : 0;

        // Slab tax applies only to ordinary income
        const taxableOrdinary = Math.max(0, ordinaryIncomeINR - effectiveSD);
        const slabs =
          useNewRegime && data.newSlabs ? data.newSlabs : data.oldSlabs;
        let slabTax = calcIndiaSlabTax(taxableOrdinary, slabs);

        // 87A rebate applies only on ordinary income (not special rate income)
        const totalForRebate = taxableOrdinary; // special income excluded from rebate eligibility check
        if (totalForRebate <= data.rebateLimit) {
          slabTax = Math.max(0, slabTax - Math.min(slabTax, data.rebate87A));
        }

        // Special rate taxes (no surcharge cap for 111A/112A — max surcharge 15%)
        const stcgTax = stcg * rates.stcgEquityRate;
        const ltcgEquityAboveExemption = Math.max(
          0,
          ltcgEquity - rates.ltcgEquityExemption,
        );
        const ltcgEquityTax = ltcgEquityAboveExemption * rates.ltcgEquityRate;
        const ltcgOtherTax = ltcgOther * rates.ltcgOtherRate;
        const specialBaseTax = stcgTax + ltcgEquityTax + ltcgOtherTax;

        const baseTax = slabTax + specialBaseTax;
        const totalIncomeForSurcharge =
          taxableOrdinary + stcg + ltcgEquity + ltcgOther;

        // Surcharge: capped at 15% for special-rate income under 111A/112A
        const ordSurcharge = calcIndiaSurcharge(
          totalIncomeForSurcharge,
          slabTax,
          null,
          useNewRegime,
        );
        // For special rate income, surcharge capped at 15%
        const specialSurchargeRate = Math.min(
          0.15,
          totalIncomeForSurcharge > 50000000
            ? 0.25
            : totalIncomeForSurcharge > 20000000
              ? 0.15
              : totalIncomeForSurcharge > 10000000
                ? 0.15
                : totalIncomeForSurcharge > 5000000
                  ? 0.1
                  : 0,
        );
        const specialSurcharge = specialBaseTax * specialSurchargeRate;
        const surcharge = ordSurcharge + specialSurcharge;

        const cess = (baseTax + surcharge) * 0.04;
        const total = baseTax + surcharge + cess;

        return {
          taxableOrdinary,
          baseTax: slabTax,
          specialBaseTax,
          stcgTax,
          ltcgEquityTax,
          ltcgOtherTax,
          surcharge,
          cess,
          total,
          sd: effectiveSD,
          rates,
          totalIncome: totalIncomeForSurcharge,
          // For display
          stcg,
          ltcgEquity,
          ltcgOther,
          ltcgEquityExemption: rates.ltcgEquityExemption,
        };
      }

      function calcUSBracketTax(income, brackets) {
        let tax = 0,
          prev = 0;
        for (const b of brackets) {
          if (income <= prev) break;
          tax += (Math.min(income, b.max) - prev) * b.rate;
          prev = b.max;
        }
        return tax;
      }

      function getLTCGRate(income, year, mfj) {
        // 2024 thresholds
        const thresh0 = mfj ? 94050 : 47025;
        const thresh15 = mfj ? 583750 : 518900;
        if (income <= thresh0) return 0;
        if (income <= thresh15) return 0.15;
        return 0.2;
      }

      function calcUSTax({
        wages,
        businessIncome,
        rentalNet,
        interest,
        ordinaryDividends,
        qualifiedDividends,
        exemptIntDividends,
        sec199aDividends,
        longTermGains,
        shortTermGains,
        filingStatus,
        year,
        indiaTaxPaid,
        useFEIE,
      }) {
        const td = US_TAX_DATA[year];
        if (!td) return null;
        const isMFJ = filingStatus === "mfj";
        const brackets = isMFJ ? td.mfj : td.brackets;
        const stdDed = isMFJ ? td.stdDeduction.mfj : td.stdDeduction.single;
        const personalEx = (td.personalExemption || 0) * (isMFJ ? 2 : 1);

        // Ordinary income items
        let feieExclusion = 0;
        if (useFEIE) {
          const feieLimit =
            year >= 2024 ? 126500 : year === 2023 ? 120000 : 112000;
          feieExclusion = Math.min(wages, isMFJ ? feieLimit * 2 : feieLimit);
        }
        const ordinaryIncome =
          Math.max(0, wages - feieExclusion) +
          businessIncome +
          rentalNet +
          interest +
          (ordinaryDividends - qualifiedDividends) +
          shortTermGains;
        // Qualified/LTCG income
        const prefIncome = qualifiedDividends + longTermGains;
        const totalGrossIncome = ordinaryIncome + prefIncome;

        const deductions = stdDed + personalEx;
        const agi = totalGrossIncome; // simplified (no above-line deductions)
        const taxableOrdinary = Math.max(0, ordinaryIncome - deductions);
        const totalTaxable = taxableOrdinary + prefIncome;

        // Ordinary bracket tax
        let ordTax = calcUSBracketTax(taxableOrdinary, brackets);

        // QDI / LTCG preferential tax
        const ltcgRate = getLTCGRate(totalTaxable, year, isMFJ);
        const ltcgTax = prefIncome * ltcgRate;

        // NIIT
        const niitThresh = isMFJ
          ? td.niitThreshold.mfj
          : td.niitThreshold.single;
        const niitIncome = Math.max(
          0,
          Math.min(prefIncome + rentalNet, agi - niitThresh),
        );
        const niitTax = niitIncome * td.niit;

        // QBI deduction (199A) - simplified: 20% of qualified business income
        const qbiDeduction =
          (td.qbiRate || 0) * Math.max(0, businessIncome + sec199aDividends);
        // Apply QBI deduction to ordinary income (rough)
        const adjOrdTax = calcUSBracketTax(
          Math.max(0, taxableOrdinary - qbiDeduction),
          brackets,
        );
        ordTax = adjOrdTax;

        const grossTax = ordTax + ltcgTax + niitTax;

        // FTC - limited to US tax attributable to foreign income
        // For expats: assume all India income is foreign source
        // FTC cannot exceed US tax * (foreign income / total income)
        const foreignIncome = totalGrossIncome; // assume all income is India-sourced
        const ftcLimit =
          totalGrossIncome > 0
            ? grossTax * (foreignIncome / totalGrossIncome)
            : 0;
        const ftcClaimed = Math.min(indiaTaxPaid, ftcLimit);
        const netUSTax = Math.max(0, grossTax - ftcClaimed);

        // Marginal rate: top bracket hit by taxable ordinary income
        let marginalOrdRate = 0;
        let prev2 = 0;
        for (const b of brackets) {
          if (taxableOrdinary > prev2) marginalOrdRate = b.rate;
          if (taxableOrdinary <= b.max) break;
          prev2 = b.max;
        }

        return {
          feieExclusion,
          agi,
          totalGrossIncome,
          deductions,
          taxableOrdinary,
          totalTaxable,
          ordTax,
          ltcgTax,
          niitTax,
          qbiDeduction,
          grossTax,
          ftcLimit,
          ftcClaimed,
          netUSTax,
          stdDed,
          personalEx,
          ltcgRate,
          marginalOrdRate,
          niitIncome,
          ordinaryIncome,
          prefIncome,
          nonQualDiv: ordinaryDividends - qualifiedDividends,
          effectiveRate:
            totalGrossIncome > 0 ? (netUSTax / totalGrossIncome) * 100 : 0,
        };
      }

      function fmt(n, currency = "USD", compact = false) {
        if (isNaN(n) || !isFinite(n)) return "—";
        const absN = Math.abs(Math.round(n));
        const sign = n < 0 ? "-" : "";
        if (currency === "INR") {
          if (compact) {
            if (absN >= 10000000)
              return sign + "₹" + (absN / 10000000).toFixed(2) + " Cr";
            if (absN >= 100000)
              return sign + "₹" + (absN / 100000).toFixed(2) + " L";
          }
          return (
            sign +
            "₹" +
            new Intl.NumberFormat("en-IN", { maximumFractionDigits: 0 }).format(
              absN,
            )
          );
        }
        if (currency === "MYR") {
          if (compact) {
            if (absN >= 1000000)
              return sign + "RM" + (absN / 1000000).toFixed(2) + "M";
            if (absN >= 100000)
              return sign + "RM" + (absN / 1000).toFixed(1) + "K";
          }
          return (
            sign +
            "RM" +
            new Intl.NumberFormat("en-MY", { maximumFractionDigits: 0 }).format(
              absN,
            )
          );
        }
        if (compact && absN >= 100000)
          return sign + "$" + (absN / 1000).toFixed(1) + "K";
        return new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: "USD",
          maximumFractionDigits: 0,
        }).format(Math.round(n));
      }

      function fmtN(n, currency) {
        if (isNaN(n) || !isFinite(n)) return "—";
        const locale = currency === "INR" ? "en-IN" : "en-US";
        return Math.round(n).toLocaleString(locale);
      }

      function pct(n) {
        if (isNaN(n)) return "—";
        return n.toFixed(2) + "%";
      }

      function Toggle({ checked, onChange, label }) {
        return (
          <div className="toggle-wrap">

              <input
                type="checkbox"
                checked={checked}
                onChange={(e) => onChange(e.target.checked)}

          </div>
        );

      function parseAmount(raw) {
        // Strip currency symbols, commas (works for both US 1,000 and Indian 1,00,000), spaces
        const cleaned = String(raw)
          .replace(/[\$\u20b9\u20ac\u00a3,\s]/g, "")
          .trim();
        const n = parseFloat(cleaned);
        return isNaN(n) ? 0 : n;
      }

      function NumberInput({ label, value, onChange, prefix, suffix, note }) {
        const [display, setDisplay] = React.useState(
          value === 0 ? "" : String(value),
        );
        React.useEffect(() => {
          setDisplay(value === 0 ? "" : String(value));
        }, [value]);
        return (
          <div className="field-group">
            {label && <div className="label">{label}</div>}
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              {prefix && (
                <span
                  style={{ fontSize: 14, color: "var(--text3)", minWidth: 14 }}
                >
                  {prefix}
                </span>
              )}
              <input
                type="text"
                inputMode="decimal"
                value={display}
                placeholder="0"
                onChange={(e) => setDisplay(e.target.value)}
                onBlur={(e) => {
                  const n = parseAmount(e.target.value);
                  onChange(n);
                  setDisplay(n === 0 ? "" : String(n));
                }}
                onPaste={(e) => {
                  e.preventDefault();
                  const pasted = e.clipboardData.getData("text");
                  const n = parseAmount(pasted);
                  onChange(n);
                  setDisplay(n === 0 ? "" : String(n));
                }}
                style={{
                  textAlign: "right",
                  fontFamily: "'IBM Plex Mono',monospace",
                }}
              />
              {suffix && (
                <span style={{ fontSize: 12, color: "var(--text3)" }}>
                  {suffix}
                </span>
              )}
            </div>
            {note && (
              <div
                style={{ fontSize: 11, color: "var(--text3)", marginTop: 3 }}
              >
                {note}
              </div>
            )}
          </div>
        );
      }

      // SpouseField: combined input with optional per-spouse split toggle
      function SpouseField({ label, fieldKey, income, onChange, pfx, note }) {
        const combined = income[fieldKey] || 0;
        const isSplit = !!income[fieldKey + "_split"];
        const s1val =
          income[fieldKey + "_s1"] !== undefined
            ? income[fieldKey + "_s1"]
            : combined / 2;
        const s2val = Math.max(0, combined - s1val);

        function setField(updates) {
          onChange({ ...income, ...updates });
        }
        function toggleSplit(on) {
          setField({
            [fieldKey + "_split"]: on,
            [fieldKey + "_s1"]: combined / 2,
          });
        }
        function setCombined(v) {
          // When combined changes, keep s1 fraction proportional if split active
          const frac = combined > 0 ? s1val / combined : 0.5;
          setField({
            [fieldKey]: v,
            [fieldKey + "_s1"]: isSplit ? Math.round(v * frac) : v / 2,
          });
        }
        function setS1(v) {
          const clamped = Math.min(v, combined);
          setField({ [fieldKey + "_s1"]: clamped });
        }

        return (
          <div
            className="field-group"
            style={{ marginBottom: isSplit ? 16 : 12 }}
          >
            <div
              style={{
                display: "flex",

      function ExpatResultCard({ result, settings, inrToUsd, incomeINR }) {
        if (!result) return null;
        const { spouse1, spouse2, total } = result;
        const foreignCur = settings.expatCountry === "Malaysia" ? "MYR" : "INR";
        const fmtI = (n) => fmt(n, foreignCur);
        const fmtU = (n) => fmt(n / inrToUsd, "USD");

        // Build per-income-type rows with actual India tax rates
        const sp1rates = result.spouse1.result.rates || {};
        const incomeRows = [];
        if (incomeINR) {
          const salary = incomeINR.salary || 0;
          const biz = incomeINR.business || 0;
          if (salary > 0)
            incomeRows.push({
              label: "Salary / Wages",
              amount: salary,
              cat: "Slab rates",
              type: "slab",
              badge: "ord",
            });
          if (biz > 0)
            incomeRows.push({
              label: "Business Income",
              amount: biz,
              cat: "Slab rates",
              type: "slab",
              badge: "ord",
            });
          if ((incomeINR.other || 0) > 0)
            incomeRows.push({
              label: "Other Income",
              amount: incomeINR.other,
              cat: "Slab rates",
              type: "slab",
              badge: "ord",
            });
          if ((incomeINR.interest || 0) > 0)
            incomeRows.push({
              label: "Interest Income",
              amount: incomeINR.interest,
              cat: "Slab rates",
              type: "slab",
              badge: "ord",
            });
          if ((incomeINR.dividends || 0) > 0)
            incomeRows.push({
              label: "Dividends",
              amount: incomeINR.dividends,
              cat: "Slab rates (no preferential treatment)",
              type: "slab",
              badge: "ord",
            });
          if ((incomeINR.rental || 0) > 0)
            incomeRows.push({
              label: "Net Rental Income",
              amount: incomeINR.rental,
              cat: `Slab rates (after ${settings.expatCountry} deductions)`,
              type: "slab",
              badge: "ord",
            });
          if ((incomeINR.stcg || 0) > 0)
            incomeRows.push({
              label: "Short-Term Cap Gains (equity)",
              amount: incomeINR.stcg,
              cat: "Sec 111A — flat rate",
              type: "stcg",
              badge: "stcg",
              rate: sp1rates.stcgEquityRate,
            });
          if ((incomeINR.ltcgEquity || 0) > 0)
            incomeRows.push({
              label: "Long-Term Cap Gains (equity)",
              amount: incomeINR.ltcgEquity,
              cat: "Sec 112A — flat rate",
              type: "ltcg",
              badge: "ltcg",
              rate: sp1rates.ltcgEquityRate,
              exemption: sp1rates.ltcgEquityExemption,
            });
        }
        const totalIncomeINR = incomeRows.reduce((s, r) => s + r.amount, 0);
        const badgeStyleIN = {
          ord: { bg: "var(--bg4)", color: "var(--text3)" },
          stcg: { bg: "var(--orange2)", color: "var(--orange)" },
          ltcg: { bg: "var(--green3)", color: "var(--green)" },

          return (
            <div style={{ flex: 1, minWidth: 200 }}>
              <div
                style={{
                  fontSize: 13,
                  fontWeight: 600,
                  color: "var(--text2)",
                  marginBottom: 12,

                {label}

              <BRow label="Ordinary Income" value={fmtI(sp.incomeINR)} />

                <BRow
                  label="Standard Deduction"
                  value={`(${fmtI(res.sd)})`}
                  sub
                  color="var(--green)"
                />
              )}
              <BRow
                label="Taxable Ordinary Income"
                value={fmtI(res.taxableOrdinary)}
                sub
              />
              {res.stcg > 0 && (
                <BRow
                  label={`STCG (${pct((res.rates?.stcgEquityRate || 0.15) * 100)} flat)`}

                  sub
                  color="var(--orange)"
                />
              )}
              {res.ltcgEquity > 0 && (
                <BRow
                  label={`LTCG equity (${pct((res.rates?.ltcgEquityRate || 0.1) * 100)} flat)`}
                  value={fmtI(res.ltcgEquity)}
                  sub
                  color="var(--green)"
                />
              )}
              <hr className="section-sep" style={{ margin: "8px 0" }} />
              <BRow label="Slab Tax" value={fmtI(res.baseTax)} sub />
              {res.stcgTax > 0 && (
                <BRow
                  label="STCG Tax"
                  value={fmtI(res.stcgTax)}
                  sub
                  color="var(--orange)"
                />
              )}
              {res.ltcgEquityTax > 0 && (
                <BRow
                  label="LTCG Tax"
                  value={fmtI(res.ltcgEquityTax)}
                  sub
                  color="var(--green)"

              {res.surcharge > 0 && (
                <BRow
                  label="Surcharge"

            {/* Summary metrics — matching US card pattern */}
            <div className="metric-grid">
              <div className="metric-card">
                <div className="metric-label">Gross Income</div>
                <div className="metric-val">{fmtI(totalIncomeINR)}</div>
                <div className="metric-sub">{fmtU(totalIncomeINR)}</div>
              </div>
              <div className="metric-card">

        if (usIncome) {
          const ui = usIncome;

            incomeRows.push({
              label: "Wages / Salary",
              amount: ui.wages,
              cat: "Ordinary income",
              type: "ord",
            });
          if (ui.businessIncome > 0)
            incomeRows.push({
              label: "Business / Self-Employment",
              amount: ui.businessIncome,
              cat:
                td && td.qbiRate
                  ? "Ordinary + 20% QBI deduction"
                  : "Ordinary income",
              type: td && td.qbiRate ? "qbi" : "ord",
            });
          if (ui.rentalNet > 0)
            incomeRows.push({
              label: "Net Rental Income (passive)",
              amount: ui.rentalNet,
              cat: "Ordinary income",
              type: "ord",
            });
          if (ui.interest > 0)
            incomeRows.push({
              label: "Interest Income",
              amount: ui.interest,
              cat: "Ordinary income",
              type: "ord",
            });
          const nonQualDiv = Math.max(
            0,
            ui.ordinaryDividends - ui.qualifiedDividends,
          );
          if (nonQualDiv > 0)
            incomeRows.push({
              label: "Non-Qualified Dividends",
              amount: nonQualDiv,
              cat: "Ordinary income",
              type: "ord",
            });
          if (ui.qualifiedDividends > 0)
            incomeRows.push({
              label: "Qualified Dividends (QDI)",
              amount: ui.qualifiedDividends,
              cat: "Preferential (0/15/20%)",
              type: "ltcg",
            });
          if (ui.exemptIntDividends > 0)
            incomeRows.push({
              label: "Exempt-Interest Dividends",
              amount: ui.exemptIntDividends,
              cat: "Federal tax-exempt",
              type: "exempt",
            });
          if (ui.sec199aDividends > 0)

      // ============================================================
      // PLANNING TAB
      // ============================================================
      function PlanningTab({
        usResult,
        indiaResult,
        usIncome,
        income,
        settings,
        inrToUsd,
        taxYear,
        indiaTotalIncomeINR,
        isCombined,
      }) {
        const td = US_TAX_DATA[taxYear];
        const indiaTd = INDIA_TAX_DATA[taxYear];
        const foreignCur = settings.expatCountry === "Malaysia" ? "MYR" : "INR";
        const fmtI = (n) => fmt(Math.round(n), foreignCur);
        const fmtU = (n) => fmt(Math.round(n), "USD");
        const cur = settings.currency;
        const isForeignCur = cur === "INR" || cur === "MYR";
        const toUSD = (v) => (isForeignCur ? v / inrToUsd : v);
        const toINR = (v) => (cur === "USD" ? v * inrToUsd : v);

        const r = usResult;
        const sp1res = indiaResult?.spouse1?.result;
        const totalIndiaTaxINR = indiaResult?.total?.totalINR || 0;
        const isMFJ = settings.filingStatus === "mfj";

        // ── core numbers ──────────────────────────────────────────
        const usGross = r?.totalGrossIncome || 0;
        const usMarginal = r?.marginalOrdRate || 0;
        const usLtcgRate = r?.ltcgRate || 0;
        const usNetTax = r?.netUSTax || 0;
        const ftcClaimed = r?.ftcClaimed || 0;
        const ftcLimit = r?.ftcLimit || 0;
        const ftcUnused = Math.max(0, totalIndiaTaxINR / inrToUsd - ftcClaimed);
        const niitThresh = isMFJ ? 250000 : 200000;
        const niitIncome = r?.niitIncome || 0;
        const prefIncome = r?.prefIncome || 0;
        const taxableOrd = r?.taxableOrdinary || 0;
        const qbiDeduction = r?.qbiDeduction || 0;
        const stdDed = r?.stdDed || 0;

        // income items (USD)
        const wagesUSD = usIncome?.wages || 0;
        const bizUSD = usIncome?.businessIncome || 0;
        const stcgUSD = usIncome?.shortTermGains || 0;
        const ltcgUSD = usIncome?.longTermGains || 0;
        const qdiUSD = usIncome?.qualifiedDividends || 0;
        const ordDivUSD = usIncome?.ordinaryDividends || 0;
        const nonQualDivUSD = Math.max(0, ordDivUSD - qdiUSD);
        const rentalNetUSD = usIncome?.rentalNet || 0;
        const rentalGrossUSD = toUSD(income.usRentalGross || 0);
        const sec199aUSD = usIncome?.sec199aDividends || 0;

        // India income (INR)
        const indiaSalaryINR = isCombined
          ? toINR(income.wages || 0)
          : toINR(income.indiaSalary || 0);
        const indiaStcgINR = toINR(income.shortTermGains || 0);
        const indiaLtcgINR = toINR(income.longTermGains || 0);
        const indiaRentalGrossINR = toINR(income.indiaRentalGross || 0);
        const indiaInterestINR = toINR(income.interest || 0);

        // India tax rate info
        const indiaSurchargeRate =
          sp1res && sp1res.baseTax + sp1res.specialBaseTax > 0
            ? sp1res.surcharge / (sp1res.baseTax + sp1res.specialBaseTax)
            : 0;
        const indiaEffMultiplier = (1 + indiaSurchargeRate) * 1.04;
        const indiaSlabTopRate = 0.3 * indiaEffMultiplier; // 30% slab + cess + surcharge
        const indiaSTCGEffRate =
          (sp1res?.rates?.stcgEquityRate || 0.2) * indiaEffMultiplier;
        const indiaLTCGEffRate =
          (sp1res?.rates?.ltcgEquityRate || 0.125) * indiaEffMultiplier;

        // India marginal slab rate (for savings calcs)
        const indiaMarginalSlab =
          sp1res && sp1res.taxableOrdinary > 0
            ? (() => {
                const slabs =
                  settings.useNewIndia && indiaTd?.newSlabs
                    ? indiaTd.newSlabs
                    : indiaTd?.oldSlabs || [];
                let rate = 0,
                  prev = 0;
                for (const s of slabs) {
                  if (sp1res.taxableOrdinary > prev) rate = s.rate;
                  if (sp1res.taxableOrdinary <= s.max) break;
                  prev = s.max;
                }
                return rate;
              })()
            : 0;

        // ── flags ─────────────────────────────────────────────────
        const hasWages = wagesUSD > 0;
        const hasBiz = bizUSD > 0;
        const hasLTCG = ltcgUSD > 0;
        const hasSTCG = stcgUSD > 0;
        const hasQDI = qdiUSD > 0;
        const hasNonQualDiv = nonQualDivUSD > 500;
        const hasUSRental = (income.usRentalGross || 0) > 0;
        const hasIndiaRental = (income.indiaRentalGross || 0) > 0;
        const hasIndiaIncome = indiaTotalIncomeINR > 0;
        const subjectToNIIT = usGross > niitThresh && niitIncome > 0;
        const indiaNewRegime = settings.useNewIndia;
        const hasOldRegime = !!indiaTd?.oldSlabs;
        const indiaHasSTCG = indiaStcgINR > 0;
        const indiaHasLTCG = indiaLtcgINR > 0;
        const indiaHasInterest = indiaInterestINR > 100;

        // ── potential savings computations ───────────────────────
        // 401k: $23,000 employee contribution saves at marginal rate
        const k401kContrib = Math.min(23000, wagesUSD);
        const k401kSaving = k401kContrib * usMarginal;
        // SEP-IRA: 25% of net biz income, max $69,000
        const sepContrib = Math.min(69000, bizUSD * 0.25);
        const sepSaving = sepContrib * usMarginal;
        // HSA
        const hsaContrib = isMFJ ? 8300 : 4150;
        const hsaSaving = hsaContrib * usMarginal;
        // STCG→LTCG conversion saving
        const stcgToLtcgSaving = stcgUSD * (usMarginal - usLtcgRate);
        // Non-qual div → qual div saving
        const nqDivSaving = nonQualDivUSD * (usMarginal - usLtcgRate);
        // NIIT saving if eliminated (rough)
        const niitSaving = niitIncome * 0.038;
        // QBI max room
        const qbiMaxRoom = (bizUSD + sec199aUSD) * 0.2 - qbiDeduction;
        const qbiRoomSaving = Math.max(0, qbiMaxRoom) * usMarginal;
        // India 80C (old regime): full 1.5L at top marginal
        const india80CSaving =
          150000 * indiaMarginalSlab * indiaEffMultiplier * 2; // both spouses
        // India 80CCD extra NPS saving
        const indiaNPSSaving =
          50000 * indiaMarginalSlab * indiaEffMultiplier * 2;
        // India 80D saving
        const india80DSaving =
          (isMFJ ? 100000 : 50000) * indiaMarginalSlab * indiaEffMultiplier * 2;
        // India employer NPS (new regime): 14% of salary
        const indiaEmployerNPS = Math.min(indiaSalaryINR * 0.14, 0); // only if structured as employer contrib
        // STCG→LTCG in India: saves difference between STCG and LTCG eff rates
        const indiaStcgToLtcgSaving =
          indiaStcgINR * (indiaSTCGEffRate - indiaLTCGEffRate);
        // India interest in NRE: currently taxable in India at top slab; NRE would be exempt
        const indiaNRESaving =
          indiaInterestINR * indiaMarginalSlab * indiaEffMultiplier * 2;
        // FEIE saving: wages up to $126,500 excluded if applicable
        const feieExclusion = Math.min(126500, wagesUSD);
        const feieSaving = feieExclusion * usMarginal; // rough – ignores FTC tradeoff
        // Regime switch saving (India): rough — compare new vs old on per-spouse basis
        let regimeSwitchSavingINR = 0;
        if (indiaTd && sp1res) {
          const altRegime = !indiaNewRegime;
          const altR = calcIndiaTax(
            sp1res.taxableOrdinary + (sp1res.sd || 0),
            indiaTd,
            altRegime,
            hasWages,
            {
              stcg: indiaStcgINR / 2,
              ltcgEquity: indiaLtcgINR / 2,
              ltcgOther: 0,
            },
            taxYear,
          );
          regimeSwitchSavingINR = (sp1res.total - altR.total) * 2; // positive = current is better
        }

        if (!r && !indiaResult) {
          return (
            <div
              className="main-wrap"
              style={{ textAlign: "center", paddingTop: 60 }}
            >
              <div style={{ fontSize: 32, marginBottom: 12 }}>💡</div>
              <div style={{ fontSize: 16, fontWeight: 600, marginBottom: 8 }}>
                Enter income data first
              </div>
              <div style={{ fontSize: 13, color: "var(--text3)" }}>
                Go to the Income tab and enter your numbers to get personalised
                planning ideas.
              </div>
            </div>
          );
        }

        // ── UI helpers ────────────────────────────────────────────
        function OpCard({
          emoji,
          title,
          country,
          saving,
          savingLabel,
          priority,
          children,
        }) {
          const pc = {
            high: { bg: "var(--red2)", c: "var(--red)" },
            medium: { bg: "var(--orange2)", c: "var(--orange)" },
            low: { bg: "var(--bg4)", c: "var(--text3)" },
          }[priority] || { bg: "var(--bg4)", c: "var(--text3)" };
          const hasSaving = saving && saving > 50;
          return (
            <div
              style={{
                background: "var(--bg2)",
                border: "1px solid var(--border)",
                borderRadius: "var(--radius2)",
                padding: 18,
                marginBottom: 12,
              }}
            >
              <div
                style={{
                  display: "flex",
                  alignItems: "flex-start",
                  justifyContent: "space-between",
                  gap: 12,
                  marginBottom: 10,
                  flexWrap: "wrap",

              >
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ fontSize: 20 }}>{emoji}</span>
                  <div>
                    <div style={{ fontWeight: 600, fontSize: 14 }}>{title}</div>
                    <div
                      style={{
                        fontSize: 11,
                        color: "var(--text3)",
                        marginTop: 2,
                      }}
                    >
                      {country}
                    </div>
                  </div>
                </div>
                <div
                  style={{
                    display: "flex",
                    gap: 6,
                    alignItems: "center",
                    flexWrap: "wrap",
                  }}
                >
                  {hasSaving && (
                    <span
                      style={{
                        fontSize: 12,
                        padding: "3px 10px",
                        borderRadius: 4,
                        background: "var(--green3)",
                        color: "var(--green)",
                        fontWeight: 600,
                        whiteSpace: "nowrap",
                      }}
                    >
                      save ~{savingLabel || fmtU(saving)}
                    </span>
                  )}
                  <span
                    style={{
                      fontSize: 11,
                      padding: "2px 8px",
                      borderRadius: 4,
                      background: pc.bg,
                      color: pc.c,
                      fontWeight: 500,
                    }}
                  >
                    {priority}
                  </span>
                </div>
              </div>
              <div
                style={{ fontSize: 13, color: "var(--text2)", lineHeight: 1.7 }}
              >
                {children}
              </div>
            </div>
          );
        }

        function Num({ v, currency }) {
          return (
            <strong
              style={{
                color: "var(--text)",
                fontFamily: "'IBM Plex Mono',monospace",
              }}
            >
              {(currency === "INR" || currency === "MYR") ? fmtI(v) : fmtU(v)}
            </strong>
          );
        }

        function Section({ title, children }) {
          return (
            <div style={{ marginBottom: 28 }}>
              <div
                style={{
                  fontSize: 12,
                  fontWeight: 600,
                  color: "var(--text3)",
                  textTransform: "uppercase",
                  letterSpacing: "0.07em",
                  marginBottom: 14,
                  display: "flex",
                  alignItems: "center",
                  gap: 8,
                }}
              >
                <div
                  style={{ flex: 1, height: 1, background: "var(--border)" }}
                />
                <span>{title}</span>
                <div
                  style={{ flex: 1, height: 1, background: "var(--border)" }}
                />
              </div>
              {children}
            </div>
          );
        }

        const indiaExemptionINR =
          taxYear >= 2025 ? 400000 : taxYear >= 2023 ? 300000 : 250000;

        return (
          <div className="main-wrap">
            <div style={{ marginBottom: 20 }}>
              <div style={{ fontSize: 20, fontWeight: 600 }}>
                Tax Planning Opportunities
              </div>
              <div
                style={{ fontSize: 13, color: "var(--text3)", marginTop: 2 }}
              >
                Based on your {taxYear} numbers · Not tax advice — consult a
                CPA/CA
              </div>
            </div>

            {/* Summary bar */}
            <div
              style={{
                background: "var(--bg3)",
                border: "1px solid var(--border)",
                borderRadius: 10,
                padding: "14px 20px",
                marginBottom: 24,
                display: "flex",
                gap: 24,
                flexWrap: "wrap",
              }}
            >
              {[
                {
                  label: "US Tax After FTC",
                  val: fmtU(usNetTax),
                  color: "var(--blue)",
                },
                {
                  label: settings.expatCountry + " Tax Combined",
                  val: fmtI(totalIndiaTaxINR),
                  color: "var(--orange)",
                },
                {
                  label: "US Marginal Rate",
                  val: pct(usMarginal * 100),
                  color: "var(--text)",
                },
                {
                  label: settings.expatCountry + " Marginal (slab)",
                  val: pct(indiaMarginalSlab * 100),
                  color: "var(--text)",
                },
                {
                  label: "FTC Unused",
                  val: fmtU(ftcUnused),
                  color: ftcUnused > 1000 ? "var(--red)" : "var(--green)",
                },
              ].map((item) => (
                <div key={item.label} style={{ minWidth: 110 }}>
                  <div
                    style={{
                      fontSize: 10,
                      color: "var(--text3)",
                      textTransform: "uppercase",
                      letterSpacing: "0.05em",
                      marginBottom: 3,
                    }}
                  >
                    {item.label}
                  </div>
                  <div
                    style={{
                      fontSize: 16,
                      fontWeight: 600,
                      fontFamily: "'IBM Plex Mono',monospace",
                      color: item.color,
                    }}
                  >
                    {item.val}
                  </div>
                </div>
              ))}
            </div>

            {/* === US STRATEGIES === */}
            <Section title="🇺🇸 US Federal Strategies">
              {/* FTC unused */}
              {ftcUnused > 500 && (
                <OpCard
                  emoji="🏦"
                  title="Unused Foreign Tax Credits"
                  country="US — Form 1116"
                  saving={ftcUnused}
                  priority="high"
                >
                  You have <Num v={ftcUnused} /> of India tax that exceeds your
                  FTC limit of <Num v={ftcLimit} />. This excess carries back 1
                  year or forward 10 years. To absorb it faster: accelerate
                  US-source income in high-FTC years, or consider whether income
                  can be re-sourced under the DTAA. Also ensure you're filing
                  per-basket correctly — passive income (dividends, interest,
                  rental) sits in a separate basket from general income.
                  Misbasket-ing is a common reason credits go unused.
                </OpCard>
              )}

              {/* FEIE */}
              {hasWages && (
                <OpCard
                  emoji="✈️"
                  title="FEIE vs FTC — Run Both Scenarios"
                  country="US — Form 2555"
                  saving={null}
                  priority="high"
                >
                  FEIE excludes up to <strong>$126,500 (2024)</strong> of
                  foreign earned wages. On your wages of <Num v={wagesUSD} />,
                  that's a potential exclusion worth ~<Num v={feieSaving} /> in
                  federal tax. <strong>But:</strong> FEIE and FTC can't cover
                  the same income. If your India effective rate exceeds the US
                  rate on wages (currently {pct(usMarginal * 100)} marginal),
                  FTC is better — you already have the credit. FEIE becomes
                  compelling if your India wage tax is low or if you have excess
                  FTC in passive baskets that can't be used anyway. Model both
                  annually.
                </OpCard>
              )}

              {/* 401k / retirement */}
              {hasWages && (
                <OpCard
                  emoji="🏛️"
                  title="Retirement Account Contributions"
                  country="US — 401(k), IRA, SEP-IRA, HSA"
                  saving={k401kSaving + (hasBiz ? sepSaving : 0) + hsaSaving}
                  priority="high"
                >
                  At your {pct(usMarginal * 100)} marginal rate:
                  <br />• <strong>401(k):</strong> Contributing{" "}
                  <Num v={k401kContrib} /> saves ~<Num v={k401kSaving} /> in
                  federal tax this year.
                  <br />
                  {hasBiz && (
                    <>
                      <strong>• SEP-IRA:</strong> 25% of net business income ={" "}
                      <Num v={sepContrib} /> contribution → ~
                      <Num v={sepSaving} /> saved.
                      <br />
                    </>
                  )}
                  • <strong>HSA:</strong> <Num v={hsaContrib} /> contribution
                  (if on HDHP) → ~<Num v={hsaSaving} /> saved, plus tax-free
                  growth and withdrawals for medical.
                  <br />• <strong>Traditional IRA:</strong>{" "}
                  {isMFJ ? "$7,000 each" : "$7,000"} if income-eligible. Note:
                  FEIE income doesn't count as earned income for IRA
                  contribution room.
                </OpCard>
              )}

              {/* QBI optimisation */}
              {hasBiz && td?.qbiRate && (
                <OpCard
                  emoji="📋"
                  title="§199A QBI Deduction"
                  country="US — Schedule C / S-Corp"
                  saving={bizUSD * 0.2 * usMarginal}
                  priority="medium"
                >
                  Your <Num v={bizUSD} /> business income qualifies for a 20%
                  QBI deduction (~
                  <Num v={bizUSD * 0.2} />
                  ), saving ~<Num v={bizUSD * 0.2 * usMarginal} /> vs ordinary
                  rates. To maximise:
                  <br />• <strong>S-Corp election:</strong> Pay yourself a
                  reasonable salary (~{pct(0.6)}+ of profit), take the rest as
                  distributions — distributions avoid the 15.3% SE tax, saving ~
                  <Num v={bizUSD * 0.4 * 0.153} /> on the distribution portion.
                  <br />• Keep taxable income below $
                  {isMFJ ? "383,900" : "191,950"} (2024) to avoid QBI phase-out
                  for specified service businesses.
                  <br />• Sole proprietors with a spouse can hire the spouse and
                  run spousal IRA contributions.
                </OpCard>
              )}

              {/* STCG → LTCG */}
              {hasSTCG && stcgToLtcgSaving > 200 && (
                <OpCard
                  emoji="⏱️"
                  title="Convert Short-Term Gains to Long-Term"
                  country="US — Schedule D"
                  saving={stcgToLtcgSaving}
                  priority="medium"
                >
                  Your <Num v={stcgUSD} /> of short-term gains are taxed at{" "}
                  {pct(usMarginal * 100)} (ordinary). Held &gt;12 months they'd
                  be taxed at {pct(usLtcgRate * 100)} (LTCG) — a rate difference
                  of {pct((usMarginal - usLtcgRate) * 100)}, saving ~
                  <Num v={stcgToLtcgSaving} /> on this year's gains alone. For
                  positions not yet sold, the holding period clock matters.
                </OpCard>
              )}

              {/* NIIT */}
              {subjectToNIIT && (
                <OpCard
                  emoji="📈"
                  title="Net Investment Income Tax (3.8%)"
                  country="US — Sec 1411"
                  saving={niitSaving}
                  priority="medium"
                >
                  You have <Num v={niitIncome} /> subject to NIIT at 3.8% = ~
                  <Num v={niitSaving} /> of additional tax. Income over $

                  triggers NIIT on investment income. To reduce:
                  <br />• <strong>Real estate professional status</strong> (750+
                  hrs/year): rental income becomes active, escaping NIIT.
                  <br />• <strong>Opportunity Zone investments</strong>: defer
                  and potentially exclude gains.
                  <br />• <strong>Installment sales</strong>: spread gain across
                  years to stay below the NIIT threshold annually.
                </OpCard>

              {/* LTCG rate management */}
              {hasLTCG && (
                <OpCard
                  emoji="📉"
                  title="Long-Term Capital Gains Management"
                  country="US — Schedule D"
                  saving={null}
                  priority="medium"
                >
                  Your <Num v={ltcgUSD} /> of LTCG is taxed at{" "}
                  {pct(usLtcgRate * 100)}
                  {subjectToNIIT
                    ? " + 3.8% NIIT = " +
                      pct((usLtcgRate + 0.038) * 100) +
                      " all-in"
                    : ""}
                  . Strategies:
                  <br />
                  {usLtcgRate === 0 ? (
                    <>
                      <strong>You're in the 0% bracket</strong> — consider
                      realising additional gains this year tax-free up to the
                      bracket ceiling (${isMFJ ? "94,050" : "47,025"} taxable
                      income).
                      <br />
                    </>
                  ) : (
                    <>
                      <strong>Tax-loss harvesting</strong>: realise losses to
                      offset gains — watch 30-day wash-sale rule.
                      <br />
                    </>
                  )}
                  • <strong>Gifting appreciated shares</strong> to charity:
                  deduct FMV, pay no capital gains. On <Num v={ltcgUSD} /> of
                  gains donated, saves ~
                  <Num
                    v={ltcgUSD * (usLtcgRate + (subjectToNIIT ? 0.038 : 0))}
                  />{" "}
                  in tax.
                  <br />• <strong>Opportunity Zones</strong>: invest gains
                  within 180 days to defer and partially exclude.
                </OpCard>
              )}

              {/* Non-qualified dividends */}
              {hasNonQualDiv && nqDivSaving > 200 && (
                <OpCard
                  emoji="💰"
                  title="Shift Non-Qualified to Qualified Dividends"
                  country="US — Schedule B"
                  saving={nqDivSaving}
                  priority="low"
                >
                  You have <Num v={nonQualDivUSD} /> of non-qualified dividends
                  taxed at {pct(usMarginal * 100)} vs {pct(usLtcgRate * 100)}{" "}
                  for qualified. Potential saving: ~<Num v={nqDivSaving} />.
                  Check holding periods — US equities held &gt;60 days in the
                  121-day window around ex-dividend date qualify. ETFs and index
                  funds typically produce mostly qualified dividends; actively
                  traded funds often don't.
                </OpCard>
              )}

              {/* US Rental cost segregation */}
              {hasUSRental && (
                <OpCard
                  emoji="🏠"
                  title="US Rental — Cost Segregation & Bonus Depreciation"
                  country="US — Schedule E"
                  saving={null}
                  priority="medium"
                >
                  Current auto-depreciation:{" "}
                  <Num v={(rentalGrossUSD * 0.8) / 27.5} />
                  /year (27.5yr straight-line on 80% building value). Strategies
                  to accelerate:
                  <br />• <strong>Cost segregation study</strong>: reclassify
                  components (appliances, carpets, land improvements) as
                  5/7/15-year property — dramatically front-loads deductions.
                  Typical study costs $3–8K but can generate $50–150K+ of
                  accelerated deductions on a $500K property.
                  <br />• <strong>Bonus depreciation (60% in 2024)</strong>: on
                  qualifying personal property identified in a cost seg study.
                  <br />• <strong>Real estate professional status</strong>: if
                  you or spouse qualifies (750+ hrs), passive losses offset
                  ordinary income without limit.
                </OpCard>
              )}

              {/* FBAR / PFIC */}
              <OpCard
                emoji="⚠️"
                title="FBAR, PFIC & FATCA Compliance"
                country="US — FinCEN 114, Form 8621, Form 8938"
                saving={null}
                priority="high"
              >
                Critical compliance items — penalties are severe:
                <br />• <strong>FBAR</strong>: required if foreign accounts
                exceeded $10,000 aggregate at any point. Up to $10,000+ per
                violation (or 50% of balance for wilful failures).
                <br />• <strong>FATCA Form 8938</strong>: foreign financial
                assets over $200,000 (MFJ abroad) at year-end or $300,000 at any
                point.
                <br />• <strong>PFIC (Form 8621)</strong>: Indian mutual funds —
                including index funds and ETFs — are PFICs. Without a QEF or MTM
                election, gains are taxed at the highest ordinary rate +
                interest.{" "}
                <strong>
                  Avoid accumulating Indian mutual funds as a US person
                </strong>
                ; use US-domiciled international ETFs instead.
                <br />
                {hasIndiaRental && (
                  <>
                    • <strong>Foreign rental property</strong>: depreciation
                    must be computed separately for US purposes (40-year ADS
                    life for foreign property, not 27.5 years).
                    <br />
                  </>
                )}
              </OpCard>
            </Section>

            {/* === INDIA STRATEGIES === */}
            {hasIndiaIncome && settings.expatCountry === "Malaysia" && (
              <Section title="🇲🇾 Malaysia Tax Strategies">
                <OpCard
                  emoji="🌴"
                  title="DE Rantau / MM2H Digital Nomad Pass"
                  country="Malaysia"
                  saving={null}
                  priority="high"
                >
                  Malaysia taxes income accruing in or derived from Malaysia.
                  For expats on DE Rantau or MM2H, foreign-sourced income
                  brought into Malaysia is generally tax-exempt (certain
                  conditions apply from 2022 onwards, but personal
                  foreign-sourced income is mostly exempt). However, if you
                  perform work in Malaysia (even for a foreign employer), the
                  LHDN (tax authority) may deem it as Malaysian-sourced income.
                  Consult a tax advisor to determine if your income is foreign
                  or Malaysian-sourced.
                </OpCard>
                <OpCard
                  emoji="🗓️"
                  title="Tax Residency Rules (182 Days)"
                  country="Malaysia"
                  saving={null}
                  priority="high"
                >
                  If you stay in Malaysia for at least 182 days in a calendar
                  year, you become a tax resident.
                  <strong>Tax Resident:</strong> Taxed at progressive rates
                  (0-30%) and eligible for personal tax reliefs (e.g., RM9,000
                  basic, spouse, lifestyle reliefs).
                  <strong>Non-Resident:</strong> Taxed at a flat 30% with no
                  personal reliefs. Managing your days to qualify as a resident
                  usually lowers your overall tax burden unless your income is
                  extremely high.
                </OpCard>
                <OpCard
                  emoji="🤝"
                  title="US-Malaysia Double Taxation Agreement?"
                  country="Both countries"
                  saving={null}
                  priority="medium"
                >
                  Unlike India, the US and Malaysia <strong>do not</strong> have
                  a comprehensive Double Taxation Agreement (DTAA). However, you
                  can still claim the Foreign Tax Credit (FTC) on your US return
                  for Malaysian income taxes paid, preventing double taxation on
                  the same income.
                </OpCard>
              </Section>
            )}

            {hasIndiaIncome && settings.expatCountry === "India" && (
              <Section title="🇮🇳 India Tax Strategies">
                {/* Regime comparison */}
                {hasOldRegime && taxYear >= 2020 && (
                  <OpCard
                    emoji="⚖️"
                    title={`Tax Regime — You're on ${indiaNewRegime ? "New" : "Old"} Regime`}
                    country="India — Sec 115BAC"
                    saving={
                      Math.abs(regimeSwitchSavingINR) > 1000
                        ? Math.abs(regimeSwitchSavingINR) / inrToUsd
                        : null
                    }
                    savingLabel={
                      Math.abs(regimeSwitchSavingINR) > 1000
                        ? (regimeSwitchSavingINR < 0
                            ? "switch saves "
                            : "stay saves ") +
                          fmtI(Math.abs(regimeSwitchSavingINR))
                        : null
                    }
                    priority="high"
                  >
                    {regimeSwitchSavingINR > 1000 ? (
                      <>
                        Your current regime is already better — staying saves ~
                        <Num v={regimeSwitchSavingINR} currency="INR" /> vs
                        switching. Re-evaluate each year as your deductions or
                        income change.
                      </>
                    ) : regimeSwitchSavingINR < -1000 ? (
                      <>
                        Switching to the {indiaNewRegime ? "Old" : "New"} regime
                        would save ~
                        <Num
                          v={Math.abs(regimeSwitchSavingINR)}
                          currency="INR"
                        />{" "}
                        based on your current income.{" "}
                        {indiaNewRegime
                          ? "The old regime is better if your total deductions (80C, 80D, HRA, NPS, etc.) are substantial."
                          : "The new regime has simpler slabs and a higher standard deduction — beneficial when deductions are limited."}
                        )
                      </>
                    ) : (
                      <>
                        Both regimes are roughly equivalent on your current
                        numbers — within{" "}
                        <Num
                          v={Math.abs(regimeSwitchSavingINR)}
                          currency="INR"
                        />
                        . Small changes in deductions or income could tip the
                        balance either way. Reassess annually.
                      </>
                    )}
                  </OpCard>
                )}

                {/* 80C */}
                {!indiaNewRegime && (
                  <OpCard
                    emoji="📊"
                    title="Section 80C — ₹1.5L Deduction Per Spouse"
                    country="India — Old Regime"
                    saving={india80CSaving / inrToUsd}
                    savingLabel={`~${fmtI(india80CSaving)} (both spouses)`}
                    priority="high"
                  >
                    Both spouses can each claim ₹1,50,000 under 80C ={" "}
                    <Num v={300000} currency="INR" /> combined. At your{" "}
                    {pct(indiaMarginalSlab * 100)} slab + cess/surcharge, that's
                    ~<Num v={india80CSaving} currency="INR" /> saved. Best
                    options for expats: <strong>PPF</strong> (if account already
                    opened while resident — 15-year lock-in, returns fully
                    tax-free), <strong>ELSS</strong> (3-year lock-in, equity
                    mutual fund — note PFIC risk from US side),{" "}
                    <strong>life insurance premiums</strong>. Principal
                    repayment on India home loan also counts.
                  </OpCard>
                )}

                {/* NPS */}
                {!indiaNewRegime && indiaSalaryINR > 0 && (
                  <OpCard
                    emoji="🏦"
                    title="NPS — Extra ₹50K Under 80CCD(1B)"
                    country="India — Old Regime"
                    saving={indiaNPSSaving / inrToUsd}
                    savingLabel={`~${fmtI(indiaNPSSaving)} (both)`}
                    priority="medium"
                  >
                    Beyond 80C, each spouse can claim ₹50,000 additional
                    deduction under 80CCD(1B) for NPS Tier-I contributions.
                    Combined saving: ~<Num v={indiaNPSSaving} currency="INR" />.
                    At maturity: 60% withdrawal is tax-free, 40% must buy an
                    annuity (annuity income is taxable). Lock-in until age 60.
                  </OpCard>
                )}

                {/* Employer NPS (new regime) */}
                {indiaNewRegime && indiaSalaryINR > 0 && (
                  <OpCard
                    emoji="🏦"
                    title="Employer NPS Contribution — Deductible in New Regime"
                    country="India — Sec 80CCD(2)"
                    saving={
                      (indiaSalaryINR *
                        0.14 *
                        indiaMarginalSlab *
                        indiaEffMultiplier *
                        2) /
                      inrToUsd
                    }
                    savingLabel={`~${fmtI(indiaSalaryINR * 0.14 * indiaMarginalSlab * indiaEffMultiplier * 2)}`}
                    priority="high"
                  >
                    The new regime disallows most deductions — but employer NPS
                    contributions up to <strong>14% of salary</strong> (Sec
                    80CCD(2)) remain deductible. On your combined salary of{" "}
                    <Num v={indiaSalaryINR} currency="INR" />, that's up to{" "}
                    <Num v={indiaSalaryINR * 0.14} currency="INR" /> deductible,
                    saving ~
                    <Num
                      v={
                        indiaSalaryINR *
                        0.14 *
                        indiaMarginalSlab *
                        indiaEffMultiplier *
                        2
                      }
                      currency="INR"
                    />
                    . Restructure your CTC to maximise this — requires employer
                    cooperation.
                  </OpCard>
                )}

                {/* 80D */}
                {!indiaNewRegime && (
                  <OpCard
                    emoji="🏥"
                    title="Section 80D — Health Insurance"
                    country="India — Old Regime"
                    saving={india80DSaving / inrToUsd}
                    savingLabel={`~${fmtI(india80DSaving)}`}
                    priority="medium"
                  >
                    ₹25,000 per spouse for self/family health insurance +
                    ₹25,000 each for parents (₹50,000 if parents are senior
                    citizens). Total possible deduction: ₹
                    {isMFJ ? "2,00,000" : "1,00,000"} combined. Saving at{" "}
                    {pct(indiaMarginalSlab * 100)} slab: ~
                    <Num v={india80DSaving} currency="INR" />.
                  </OpCard>
                )}

                {/* Income splitting */}
                <OpCard
                  emoji="👫"
                  title="Per-Spouse Income Splitting"
                  country="India — Sec 64 clubbing rules"
                  saving={null}
                  priority="high"
                >
                  Each spouse has their own ₹
                  <Num v={indiaExemptionINR} currency="INR" /> basic exemption
                  and slab slabs. You're already splitting — but the split must
                  reflect genuine economic contribution.{" "}
                  <strong>Clubbing (Sec 64)</strong> applies if income-producing
                  assets are transferred to spouse without adequate
                  consideration — the income gets clubbed back into the
                  transferor's hands. Safe structures: spouse has own
                  employment/business income, separate investments made from own
                  funds, rental income from separately owned property.
                  {indiaMarginalSlab > 0 && (
                    <>
                      {" "}
                      At {pct(indiaMarginalSlab * 100)} marginal slab, shifting
                      ₹10L from the higher-earning to lower-earning spouse saves
                      ~
                      <Num
                        v={1000000 * indiaMarginalSlab * indiaEffMultiplier}
                        currency="INR"
                      />
                      .
                    </>
                  )}
                </OpCard>

                {/* STCG→LTCG India */}
                {(indiaHasSTCG || indiaHasLTCG) && (
