            "LTCG / QDI Tax",
            `${fmt(usResult.ltcgTax, "USD")} | effective ${pct((usResult.ltcgEffectiveRate || 0) * 100)} | marginal up to ${pct(usResult.ltcgRate * 100)}`,
          );
          addLine("NIIT Income", fmt(usResult.niitIncome, "USD"));
          addLine("NIIT Tax", fmt(usResult.niitTax, "USD"));
          addLine("QBI Deduction", fmt(usResult.qbiDeduction, "USD"));
          addLine("Tax Before FTC", fmt(usResult.grossTax, "USD"));
          addLine("FTC Limit", fmt(usResult.ftcLimit, "USD"));
          addLine("FTC Claimed", fmt(usResult.ftcClaimed, "USD"));
          addLine("Net US Tax", fmt(usResult.netUSTax, "USD"));
          addLine("Effective Rate", pct(usResult.effectiveRate));
          addLine(
            "Marginal Ordinary Rate",
            pct((usResult.marginalOrdRate || 0) * 100),
          );
        }

        if (indiaResult) {
          addSection(`${settings.expatCountry.toUpperCase()} CALCULATION DETAIL`);
          addLine(
            `${settings.expatCountry} Total Tax`,
            fmt(indiaResult.total.totalINR, localCur),
          );
          addLine(
            `${settings.expatCountry} Total Cess`,
            fmt(indiaResult.total.totalCess, localCur),
          );
          addLine(
            `${settings.expatCountry} Total Surcharge`,
            fmt(indiaResult.total.totalSurcharge, localCur),
          );
          addLine(
            `${settings.expatCountry} Effective Rate`,
            pct(indiaResult.total.effectiveRate),
          );
          addLine(
            `${settings.expatCountry} Rental Net`,
            fmt(totalIndiaRentalNetINR, localCur),
          );
          if (settings.expatCountry === "Malaysia") {
            addLine(
              "Territorial treatment note",
              "Foreign-source US investment and rental income excluded from Malaysia tax output",
            );
            const excludedMalaysiaRows = [
              ["US Salary / Wages", effectiveIncome.wages],
              ["US Business Income", effectiveIncome.businessIncome],
              ["US Interest Income", effectiveIncome.interest],
              ["US Dividends", effectiveIncome.ordinaryDividends],
              ["US Short-Term Cap Gains", effectiveIncome.shortTermGains],
              ["US Long-Term Cap Gains", effectiveIncome.longTermGains],
              ["US Rental Gross", effectiveIncome.usRentalGross],
            ].filter(([, amount]) => (amount || 0) > 0);
            if (excludedMalaysiaRows.length) {
              addSection("MALAYSIA EXCLUDED FOREIGN-SOURCE ITEMS");
              excludedMalaysiaRows.forEach(([label, amount]) => {
                addLine(
                  label,
                  `${fmt(amount, settings.currency)} -> Malaysia tax ${fmt(0, "MYR")}`,
                );
              });
            }
          }

          [
            ["Spouse 1", indiaResult.spouse1],
            ["Spouse 2", indiaResult.spouse2],
          ].forEach(([label, sp]) => {
            addSection(`${label.toUpperCase()} ${settings.expatCountry.toUpperCase()} DETAIL`);
            addLine("Ordinary Income", fmt(sp.incomeINR, localCur));
            addLine("Taxable Ordinary Income", fmt(sp.result.taxableOrdinary, localCur));
            addLine("Standard Deduction", fmt(sp.result.sd, localCur));
            addLine("STCG", fmt(sp.result.stcg, localCur));
            addLine("LTCG Equity", fmt(sp.result.ltcgEquity, localCur));
            addLine("LTCG Other", fmt(sp.result.ltcgOther, localCur));
            addLine("Slab Tax", fmt(sp.result.baseTax, localCur));
            addLine("STCG Tax", fmt(sp.result.stcgTax, localCur));
            addLine("LTCG Equity Tax", fmt(sp.result.ltcgEquityTax, localCur));
            addLine("LTCG Other Tax", fmt(sp.result.ltcgOtherTax, localCur));
            addLine("Surcharge", fmt(sp.result.surcharge, localCur));
            addLine("Cess", fmt(sp.result.cess, localCur));
            addLine("Total Tax", fmt(sp.result.total, localCur));
            if (sp.result.rates?.stcgEquityRate !== undefined)
              addLine("STCG Rate", pct(sp.result.rates.stcgEquityRate * 100));
            if (sp.result.rates?.ltcgEquityRate !== undefined)
              addLine("LTCG Equity Rate", pct(sp.result.rates.ltcgEquityRate * 100));
            if (sp.result.rates?.ltcgOtherRate !== undefined)
              addLine("LTCG Other Rate", pct(sp.result.rates.ltcgOtherRate * 100));
            if (sp.result.ltcgEquityExemption !== undefined)
              addLine(
                "LTCG Equity Exemption",
                fmt(sp.result.ltcgEquityExemption, localCur),
              );
          });

          ["indiaPropertyDetail", "usPropertyDetail"].forEach((key) => {
            const detail = indiaResult[key];
            if (!detail) return;
            if (key === "usPropertyDetail" && !taxesWorldwideProperty) return;
            addSection(`${detail.label.toUpperCase()} DETAIL`);
            addLine("Gross Rent", fmt(detail.grossRent, localCur));
            addLine("Real-Estate Tax", fmt(detail.reTax, localCur));
            addLine("Additional Expenses", fmt(detail.additionalExpenses, localCur));
            addLine("Interest", fmt(detail.interest, localCur));
            if (detail.revenueAfterExpenses !== undefined)
              addLine("Revenue After Expenses", fmt(detail.revenueAfterExpenses, localCur));
            if (detail.profitAfterReTax !== undefined)
              addLine("Profit After RE Tax", fmt(detail.profitAfterReTax, localCur));
            if (detail.stdDeduction30 !== undefined)
              addLine("30% Standard Deduction", fmt(detail.stdDeduction30, localCur));
            if (detail.profitAfterSD !== undefined)
              addLine("Profit After Standard Deduction", fmt(detail.profitAfterSD, localCur));
            if (detail.netAfterInterest !== undefined)
              addLine("Net After Interest", fmt(detail.netAfterInterest, localCur));
          });
        }

        if (projectionRows && projectionRows.length) {
          addSection("MULTI-YEAR PROJECTION");
          projectionRows.forEach((row) => {
            addLine(
              `Year ${row.year}`,
              `income ${fmt(row.incomeUSD, "USD")} | US tax ${fmt(row.usTaxUSD, "USD")} | ${settings.expatCountry} tax ${fmt(row.expatTaxUSD, "USD")} | combined ${fmt(row.combinedTaxUSD, "USD")} | eff. ${pct(row.effectiveRatePct)}` +
                (row.portfolioEnd > 0
                  ? ` | portfolio ${fmt(row.portfolioStart, "USD")} -> ${fmt(row.portfolioEnd, "USD")} | real ${fmt(row.realPortfolioEnd, "USD")}`
                  : ""),
            );
          });
        }

        addSection("VISIBLE UI SNAPSHOT");
        lines.push(uiSnapshot || "No UI snapshot captured.");

        return lines.join("\n");
      }

      function downloadTextReport(filename, text) {
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      function ExpatResultCard({ result, settings, inrToUsd, incomeINR }) {
        if (!result) return null;
        const { spouse1, spouse2, total } = result;
        const foreignCur = settings.expatCountry === "Malaysia" ? "MYR" : "INR";
        const fmtI = (n) => fmt(n, foreignCur);
        const fmtU = (n) => fmt(n / inrToUsd, "USD");
        const taxesGlobalInvestment = settings.expatCountry === "India";
        const taxesWorldwideProperty = settings.expatCountry === "India";

        // Build per-income-type rows with actual India tax rates
        const sp1rates = result.spouse1.result.rates || {};
        const incomeRows = [];
        if (incomeINR) {
          const salary = incomeINR.salary || 0;
          const biz = incomeINR.business || 0;
          if (salary > 0)
            incomeRows.push({
              label: "Salary / Wages",
              amount: salary,
              cat: "Slab rates",
              type: "slab",
              badge: "ord",
            });
          if (biz > 0)
            incomeRows.push({
              label: "Business Income",
              amount: biz,
              cat: "Slab rates",
              type: "slab",
              badge: "ord",
            });
          if ((incomeINR.other || 0) > 0)
            incomeRows.push({
              label: "Other Income",
              amount: incomeINR.other,
              cat: "Slab rates",
              type: "slab",
              badge: "ord",
            });
          if (taxesGlobalInvestment && (incomeINR.interest || 0) > 0)
            incomeRows.push({
              label: "Interest Income",

                        : ` (${settings.expatCountry} Rental section)`}{" "}
                      to see the breakdown.
                    </div>
                    <div
                      style={{
                        marginTop: 12,
                        padding: "10px 14px",
                        background: "var(--bg2)",
                        border: "1px solid var(--border)",
                        borderLeft: "3px solid var(--blue)",
                        borderRadius: 6,
                        fontSize: 12,
                        color: "var(--text2)",
                        lineHeight: 1.7,
                      }}
                    >
                      {settings.expatCountry === "India" && <strong style={{ color: "var(--text2)" }}>
                        India Rental Tax Rules (applies to ALL properties
                        worldwide):
                      </strong>}
                      {settings.expatCountry === "Malaysia" && (
                        <strong style={{ color: "var(--text2)" }}>
                          Malaysia Territorial Rental Treatment:
                        </strong>
                      )}
                      <br />• <strong>No depreciation</strong> — unlike US,
                      {settings.expatCountry === "India"
                        ? " India doesn't allow depreciation on residential rental property"
                        : " this calculator only includes Malaysia-sourced rental property in the Malaysia tax view"}
                      <br />•{" "}
                      <strong>
                        {settings.expatCountry === "India"
                          ? "30% flat standard deduction (Sec 24a)"
                          : "Foreign-source US rental income"}
                      </strong>{" "}
                      {settings.expatCountry === "India"
                        ? " covers maintenance, repairs, insurance — no receipts needed"
                        : " is excluded from the Malaysia tax calculation in this territorial model"}
                      <br />• <strong>Loan interest</strong> —
                      {settings.expatCountry === "India"
                        ? " unlimited for let-out property; capped at ₹2L for self-occupied"
                        : " included only for Malaysia property entered in the local rental section"}
                      <br />• <strong>Municipal taxes</strong> —
                      {settings.expatCountry === "India"
                        ? " only deductible in the year actually paid"
                        : " applied only to Malaysia property in the local-country calculation"}
                      {settings.expatCountry === "India" && (
                        <>
                          <br />• <strong>US property</strong> — same India rules
                          apply; US depreciation/expenses are ignored for India tax
                          purposes
                        </>
                      )}
                    </div>
                  </div>
                );
              }

              // Has rental data — show full breakdown
              const perSpouse = totalRentalNet / 2;
              const sp1res = result.spouse1.result;
              const marginalSlab = (() => {
                const slabs =
                  settings.useNewIndia &&
                  INDIA_TAX_DATA[settings.taxYear]?.newSlabs
                    ? INDIA_TAX_DATA[settings.taxYear].newSlabs
                    : INDIA_TAX_DATA[settings.taxYear]?.oldSlabs || [];
                let rate = 0,
                  prev = 0;
                for (const s of slabs) {
                  if (sp1res.taxableOrdinary > prev) rate = s.rate;
                  if (sp1res.taxableOrdinary <= s.max) break;
                  prev = s.max;
                }
                return rate;
              })();
              const surchargeRate =
                sp1res.baseTax + sp1res.specialBaseTax > 0
                  ? sp1res.surcharge / (sp1res.baseTax + sp1res.specialBaseTax)
                  : 0;
              const effMultiplier = (1 + surchargeRate) * 1.04;
              const rentalTaxPerSpouse =
                perSpouse * marginalSlab * effMultiplier;
              const rentalTaxTotal = rentalTaxPerSpouse * 2;
              const rentalEffRate =
                totalRentalNet > 0 && totalGrossRent > 0
                  ? (rentalTaxTotal / totalGrossRent) * 100
                  : 0;
              const grossToNetPct =
                totalGrossRent > 0
                  ? ((totalGrossRent - totalRentalNet) / totalGrossRent) * 100
                  : 0;

              return (
                <div
                  style={{
                    background: "var(--bg3)",
                    border: "1px solid var(--border)",
                    borderRadius: 10,
                    padding: 18,
                    marginBottom: 16,
                  }}
                >
                  <div
                    style={{
                      display: "flex",
                      justifyContent: "space-between",
                      alignItems: "center",
                      marginBottom: 14,
                    }}
                  >
                    <div>
                      <div
                        style={{
                          fontSize: 13,
                          fontWeight: 600,
                          color: "var(--text)",
                        }}
                      >
                        🏠 Income from House Property
                      </div>
                      <div
                        style={{
                          fontSize: 11,
                          color: "var(--text3)",
                          marginTop: 2,
                        }}
                      >
                        {settings.expatCountry === "India"
                          ? "Sections 22–27 • All properties computed under India rules"
                          : "Computed under Malaysia territorial rules"}
                        {hasIndiaProperty && hasUSProperty
                          ? " • 2 properties"
                          : ""}
                      </div>
                    </div>
                    <span className="badge badge-orange">Slab Rates</span>
                  </div>

                  {hasUSProperty && (
                    <div
                      style={{
                        padding: "8px 12px",
                        background: "var(--blue3)",
                        border: "1px solid var(--blue2)",
                        borderRadius: 6,
                        fontSize: 12,
                        color: "var(--blue)",
                        marginBottom: 14,
                        lineHeight: 1.6,
                      }}
                    >
                      <strong>Global income:</strong> US rental property is
                      taxable in {settings.expatCountry} for residents. Computed under local rules (30% SD, no depreciation) — different from US
                      Schedule E treatment.
                    </div>
                  )}

                  {/* Per-property breakdowns */}
                  {hasUSProperty && (
                    <PropertyBreakdown rd={usP} flag="🇺🇸" label="US Property" />
                  )}
                  {hasIndiaProperty && (
                    <PropertyBreakdown
                      rd={indiaP}
                      flag="🇮🇳"
                      label="India Property"
                    />
                  )}

                  {/* Combined total (if both properties) */}
                  {hasIndiaProperty && hasUSProperty && (
                    <div
                      className="breakdown-row total"
                      style={{ marginTop: 4, marginBottom: 8 }}
                    >
                      <span>Combined Net Rental Income (both properties)</span>
                      <span className="breakdown-val">
                        {fmtI(totalRentalNet)}
                      </span>
                    </div>
                  )}

                  {/* Tax impact */}
                  <div
                    style={{
                      background: "var(--bg4)",
                      border: "1px solid var(--border)",
                      borderRadius: 8,
                      padding: 14,
                      marginTop: 10,
                    }}
                  >
                    <div
                      style={{
                        fontSize: 11,
                        fontWeight: 600,
                        color: "var(--text3)",
                        textTransform: "uppercase",
                        letterSpacing: "0.05em",
                        marginBottom: 10,
                      }}
                    >
                      Tax Impact — Added to Slab Income
                    </div>
                    <div
                      style={{
                        display: "grid",
                        gridTemplateColumns: "1fr 1fr 1fr",
                        gap: 12,
                      }}
                    >
                      <div>
                        <div
                          style={{
                            fontSize: 10,
                            color: "var(--text3)",
                            textTransform: "uppercase",
                            marginBottom: 3,
                          }}
                        >
                          Per Spouse
                        </div>
                        <div
                          style={{
                            fontSize: 15,
                            fontWeight: 600,
                            fontFamily: "'IBM Plex Mono',monospace",
                          }}
                        >
                          {fmtI(perSpouse)}
                        </div>
                        <div
                          style={{
                            fontSize: 10,
                            color: "var(--text3)",
                            marginTop: 2,
                          }}
                        >
                          added to ordinary income
                        </div>
                      </div>
                      <div>
                        <div
                          style={{
                            fontSize: 10,
                            color: "var(--text3)",
                            textTransform: "uppercase",
                            marginBottom: 3,
                          }}
                        >
                          Est. Tax (both)
                        </div>
                        <div
                          style={{
                            fontSize: 15,
                            fontWeight: 600,
                            fontFamily: "'IBM Plex Mono',monospace",
                            color: "var(--red)",
                          }}
                        >
                          {fmtI(rentalTaxTotal)}
                        </div>
                        <div
                          style={{
                            fontSize: 10,
                            color: "var(--text3)",
                            marginTop: 2,
                          }}
                        >
                          @ {pct(marginalSlab * 100)} slab + cess
                          {surchargeRate > 0 ? " + surcharge" : ""}
                        </div>
                      </div>
                      <div>
                        <div
                          style={{
                            fontSize: 10,
                            color: "var(--text3)",
                            textTransform: "uppercase",
                            marginBottom: 3,
                          }}
                        >
                          Effective Rate
                        </div>
                        <div
                          style={{
                            fontSize: 15,
                            fontWeight: 600,
                            fontFamily: "'IBM Plex Mono',monospace",
                            color: "var(--orange)",
                          }}
                        >
                          {pct(rentalEffRate)}
                        </div>
                        <div
                          style={{
                            fontSize: 10,
                            color: "var(--text3)",
                            marginTop: 2,
                          }}
                        >
                          on gross rent ({pct(grossToNetPct)} deducted)
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Comparison note for US property */}
                  {hasUSProperty && (
                    <div
                      style={{
                        marginTop: 12,
                        padding: "10px 14px",
                        background: "var(--bg2)",
                        border: "1px solid var(--border)",
                        borderLeft: "3px solid var(--orange)",
                        borderRadius: 6,
                        fontSize: 12,
                        color: "var(--text2)",
                        lineHeight: 1.7,
                      }}
                    >
                      <strong style={{ color: "var(--orange)" }}>
                        US vs India treatment of your US rental:
                      </strong>
                      <br />• <strong>US (Schedule E)</strong>: Allows
                      depreciation ({fmtU((usP.grossRent * 0.8) / 27.5)}/yr),
                      mortgage interest, property tax, other expenses → lower
                      taxable amount
                      <br />• <strong>India (Sec 22-27)</strong>: 30% flat
                      standard deduction + loan interest only → net taxable{" "}
                      {fmtI(usP.netAfterInterest)}
                      <br />• India typically results in{" "}
                      <strong>higher taxable rental income</strong> than US
                      treatment due to no depreciation
                    </div>
                  )}

                  {/* India rental rules info box */}
                  {settings.expatCountry === "India" && <div
                    style={{
                      marginTop: 12,
                      padding: "10px 14px",
                      background: "var(--bg2)",
                      border: "1px solid var(--border)",
                      borderLeft: "3px solid var(--blue)",
                      borderRadius: 6,
                      fontSize: 12,
                      color: "var(--text2)",
                      lineHeight: 1.7,
                    }}
                  >
                    <strong style={{ color: "var(--text2)" }}>
                      India Rental Tax Rules (all properties):
                    </strong>
                    <br />• <strong>No depreciation</strong> — unlike US, India
                    doesn't allow depreciation on residential rental property
                    <br />• <strong>30% flat deduction (Sec 24a)</strong> —
                    covers maintenance, repairs, insurance. No receipts needed
                    <br />• <strong>Loan interest (Sec 24b)</strong> — unlimited
                    for let-out property; capped at ₹2L for self-occupied
                    <br />• <strong>Municipal taxes</strong> — only deductible
                    in the year actually paid (not accrued)
                    <br />• <strong>Loss from house property</strong> — can set
                    off up to ₹2L against other income; excess carries forward 8
                    years
                  </div>}
                </div>
              );
            })()}

            {/* Per spouse */}
            <div
              style={{
                display: "flex",
                gap: 24,
                marginBottom: 16,
                flexWrap: "wrap",
              }}
            >
              <SpouseCard sp={spouse1} label="Spouse 1" />
              <div style={{ width: 1, background: "var(--border)" }} />
              <SpouseCard sp={spouse2} label="Spouse 2" />
            </div>

            {/* FTC note */}
            <div
              style={{
                background: "var(--bg4)",
                border: "1px solid var(--border2)",
                borderRadius: 8,
                padding: "12px 16px",
                display: "flex",
                justifyContent: "space-between",
                alignItems: "center",
                flexWrap: "wrap",
                gap: 8,
              }}
            >
              <div style={{ fontSize: 12, color: "var(--text2)" }}>
                {settings.expatCountry} tax paid feeds into{" "}
                <strong style={{ color: "var(--green)" }}>
                  US Foreign Tax Credit (Form 1116)
                </strong>
                : {fmtU(total.totalINR)} credit available
              </div>
              <div style={{ fontSize: 12, color: "var(--text3)" }}>
                Surcharge: {fmtI(total.totalSurcharge)} | Cess:{" "}
                {fmtI(total.totalCess)}
              </div>
            </div>
          </div>
        );
      }

      // ============================================================
      // US RESULT CARD
      // ============================================================
      function USResultCard({
        result,
        settings,
        indiaTaxUSD,
        usIncome,
        usAutoDepreciation,
        usRentalGrossUSD,
      }) {
        if (!result) return null;
        const r = result;
        const td = US_TAX_DATA[settings.taxYear];

        // Build income type rows with type tags for rate/tax computation
        const incomeRows = [];
        if (usIncome) {
          const ui = usIncome;
          if (ui.wages > 0)
            incomeRows.push({
              label: "Wages / Salary",
              amount: ui.wages,
              cat: "Ordinary income",
              type: "ord",
            });
          if (ui.businessIncome > 0)
            incomeRows.push({
              label: "Business / Self-Employment",
              amount: ui.businessIncome,
              cat:
                td && td.qbiRate
                  ? "Ordinary + 20% QBI deduction"
                  : "Ordinary income",
              type: td && td.qbiRate ? "qbi" : "ord",
            });
          if (ui.rentalNet > 0)
            incomeRows.push({
              label: "Net Rental Income (passive)",
              amount: ui.rentalNet,
              cat: "Ordinary income",
              type: "ord",
            });
          if (ui.interest > 0)
            incomeRows.push({
              label: "Interest Income",
              amount: ui.interest,
              cat: "Ordinary income",
              type: "ord",
            });
          const nonQualDiv = Math.max(
            0,
            ui.ordinaryDividends - ui.qualifiedDividends,
          );
          if (nonQualDiv > 0)
            incomeRows.push({
              label: "Non-Qualified Dividends",
              amount: nonQualDiv,
              cat: "Ordinary income",
              type: "ord",
            });
          if (ui.qualifiedDividends > 0)
            incomeRows.push({
              label: "Qualified Dividends (QDI)",
              amount: ui.qualifiedDividends,
              cat: "Preferential (0/15/20%)",
              type: "ltcg",
            });
          if (ui.exemptIntDividends > 0)
            incomeRows.push({
              label: "Exempt-Interest Dividends",
              amount: ui.exemptIntDividends,
              cat: "Federal tax-exempt",
              type: "exempt",
            });
          if (ui.sec199aDividends > 0)
            incomeRows.push({
              label: "Sec 199A / REIT Dividends",
              amount: ui.sec199aDividends,
              cat: "Ordinary + 20% QBI deduction",
              type: "qbi",
            });
          if (ui.shortTermGains > 0)
            incomeRows.push({
              label: "Short-Term Capital Gains",
              amount: ui.shortTermGains,
              cat: "Ordinary income",
              type: "ord",
            });
          if (ui.longTermGains > 0)
            incomeRows.push({
              label: "Long-Term Capital Gains",
              amount: ui.longTermGains,
              cat: "Preferential (0/15/20%)",
              type: "ltcg",
            });
        }

        return (
          <div className="section-card">
            <div className="country-header">
              <span className="flag">🇺🇸</span>
              <div>
                <div className="country-title">US Federal Tax — Form 1040</div>
                <div style={{ fontSize: 12, color: "var(--text3)" }}>
                  Tax Year {settings.taxYear} •{" "}
                  {settings.filingStatus === "mfj"
                    ? "Married Filing Jointly"
                    : "Single"}
                </div>
              </div>
              <span className="badge badge-blue" style={{ marginLeft: "auto" }}>
                With FTC
              </span>
            </div>

            <div className="metric-grid">
              <div className="metric-card">
                <div className="metric-label">Gross Income</div>
                <div className="metric-val">
                  {fmt(r.totalGrossIncome, "USD")}
                </div>
              </div>
              <div className="metric-card">
                <div className="metric-label">Tax Before FTC</div>
                <div className="metric-val">{fmt(r.grossTax, "USD")}</div>
              </div>
              <div className="metric-card">
                <div className="metric-label">Net US Tax Owed</div>
                <div className="metric-val negative">
                  {fmt(r.netUSTax, "USD")}
                </div>
                <div className="metric-sub">
                  After FTC: {pct(r.effectiveRate)} eff. rate
                </div>
              </div>
            </div>

            {/* Income breakdown table with rates and tax */}
            {incomeRows.length > 0 &&
              (() => {
                // Compute per-row tax estimates for display
                const ordBase =
                  r.taxableOrdinary > 0 ? r.ordTax / r.taxableOrdinary : 0;
                const rows = incomeRows.map((row) => {
                  let ratePct,
                    effPct = null,
                    taxAmt,
                    badge;
                  let niitFrac =
                    r.niitIncome > 0 && r.prefIncome > 0
                      ? r.niitIncome / r.prefIncome
                      : 0;
                  niitFrac = Math.min(niitFrac, 1);
                  if (row.type === "exempt") {
                    ratePct = "0%";
                    effPct = null;
                    taxAmt = 0;
                    badge = "exempt";
                  } else if (row.type === "ltcg") {
                    const niitOnRow = row.amount * niitFrac * 0.038;
                    const prefEffRate =
                      r.ltcgEffectiveRate !== undefined
                        ? r.ltcgEffectiveRate
                        : r.ltcgRate;
                    taxAmt = row.amount * prefEffRate + niitOnRow;
                    const allInRate = prefEffRate + niitFrac * 0.038;
                    ratePct = pct((r.ltcgRate || 0) * 100) + " marginal";
                    effPct =
                      niitFrac > 0 || prefEffRate !== r.ltcgRate
                        ? "~" + pct(allInRate * 100) + " incl. NIIT (3.8%)"
                        : null;
                    badge = "pref";
                  } else if (row.type === "ord") {
                    ratePct = pct(r.marginalOrdRate * 100) + " marginal";
                    effPct = null;
                    taxAmt = row.amount * ordBase;
                    badge = "ord";
                  } else if (row.type === "qbi") {
                    const effOrd = r.marginalOrdRate * 0.8;
                    ratePct = pct(r.marginalOrdRate * 100);
                    effPct =
                      "~" + pct(effOrd * 100) + " after 20% QBI deduction";
                    taxAmt = row.amount * ordBase * 0.8;
                    badge = "qbi";
                  }
                  return { ...row, ratePct, effPct, taxAmt, badge };
                });
                const badgeStyle = {
                  ord: { bg: "var(--bg4)", color: "var(--text3)" },
                  pref: { bg: "var(--green3)", color: "var(--green)" },
                  qbi: { bg: "var(--blue3)", color: "var(--blue)" },
                  exempt: { bg: "var(--green3)", color: "var(--green)" },
                };
                return (
                  <div style={{ marginBottom: 16 }}>
                    <div
                      style={{
                        fontSize: 12,
                        fontWeight: 600,
                        color: "var(--text3)",
                        textTransform: "uppercase",
                        letterSpacing: "0.06em",
                        marginBottom: 10,
                      }}
                    >
                      Income Breakdown &amp; Tax Rates
                    </div>
                    <div
                      style={{
                        border: "1px solid var(--border)",
                        borderRadius: 8,
                        overflow: "hidden",
                      }}
                    >
                      <table
                        style={{
                          width: "100%",
                          borderCollapse: "collapse",
                          fontSize: 13,
                          tableLayout: "fixed",
                        }}
                      >
                        <colgroup>
                          <col style={{ width: "30%" }} />
                          <col style={{ width: "16%" }} />
                          <col style={{ width: "24%" }} />
                          <col style={{ width: "16%" }} />
                          <col style={{ width: "14%" }} />
                        </colgroup>
                        <thead>
                          <tr style={{ background: "var(--bg3)" }}>
                            {[
                              "Income Type",
                              "Amount",
                              "Tax Category",
                              "Rate",
                              "Est. Tax",
                            ].map((h) => (
                              <th
                                key={h}
                                style={{
                                  padding: "8px 10px",
                                  textAlign:
                                    h === "Amount" || h === "Est. Tax"
                                      ? "right"
                                      : "left",
                                  fontWeight: 500,
                                  color: "var(--text3)",
                                  fontSize: 11,
                                  textTransform: "uppercase",
                                  letterSpacing: "0.04em",
                                }}
                              >
                                {h}
                              </th>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {rows.map((row, i) => {
                            const bs = badgeStyle[row.badge] || badgeStyle.ord;
                            return (
                              <tr
                                key={i}
                                style={{
                                  borderTop: "1px solid var(--border)",
                                  background:
                                    i % 2 === 0 ? "transparent" : "var(--bg3)",
                                }}
                              >
                                <td
                                  style={{
                                    padding: "9px 10px",
                                    color: "var(--text)",
                                    fontSize: 12,
                                  }}
                                >
                                  {row.label}
                                </td>
                                <td
                                  style={{
                                    padding: "9px 10px",
                                    textAlign: "right",
                                    fontFamily: "'IBM Plex Mono',monospace",
                                    fontSize: 12,
                                  }}
                                >
                                  {fmt(row.amount, "USD")}
                                </td>
                                <td style={{ padding: "9px 10px" }}>
                                  <span
                                    style={{
                                      fontSize: 11,
                                      padding: "2px 7px",
                                      borderRadius: 4,
                                      background: bs.bg,
                                      color: bs.color,
                                      whiteSpace: "nowrap",
                                    }}
                                  >
                                    {row.cat}
                                  </span>
                                </td>
                                <td
                                  style={{
                                    padding: "9px 10px",
                                    fontFamily: "'IBM Plex Mono',monospace",
                                    fontSize: 12,
                                    color: bs.color,
                                  }}
                                >
                                  <div>{row.ratePct}</div>
                                  {row.effPct && (
                                    <div
                                      style={{
                                        fontSize: 10,
                                        color: "var(--text3)",
                                        marginTop: 2,
                                      }}
                                    >
                                      {row.effPct}
                                    </div>
                                  )}
                                </td>
                                <td
                                  style={{
                                    padding: "9px 10px",
                                    textAlign: "right",
                                    fontFamily: "'IBM Plex Mono',monospace",
                                    fontSize: 12,
                                    color: "var(--text2)",
                                  }}
                                >
                                  {fmt(row.taxAmt, "USD")}
                                </td>
                              </tr>
                            );
                          })}
                          <tr
                            style={{
                              borderTop: "2px solid var(--border2)",
                              background: "var(--bg4)",
                            }}
                          >
                            <td
                              style={{ padding: "9px 10px", fontWeight: 600 }}
                            >
                              Total
                            </td>
                            <td
                              style={{
                                padding: "9px 10px",
                                textAlign: "right",
                                fontFamily: "'IBM Plex Mono',monospace",
                                fontWeight: 600,
                              }}
                            >
                              {fmt(r.totalGrossIncome, "USD")}
                            </td>
                            <td
                              colSpan={2}
                              style={{
                                padding: "9px 10px",
                                fontSize: 12,
                                color: "var(--text3)",
                              }}
                            >
                              Eff. rate before FTC:{" "}
                              {pct((r.grossTax / r.totalGrossIncome) * 100)}
                            </td>
                            <td
                              style={{
                                padding: "9px 10px",
                                textAlign: "right",
                                fontFamily: "'IBM Plex Mono',monospace",
                                fontWeight: 600,
                              }}
                            >
                              {fmt(r.grossTax, "USD")}
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                    {usRentalGrossUSD > 0 && (
                      <div
                        style={{
                          marginTop: 8,
                          background: "var(--bg3)",
                          border: "1px solid var(--border)",
                          borderRadius: 8,
                          padding: 12,
                        }}
                      >
                        <div
                          style={{
                            fontSize: 12,
                            fontWeight: 600,
                            color: "var(--text2)",
                            marginBottom: 8,
                          }}
                        >
                          US Rental — Expense Offsets
                        </div>
                        <BRow

      // ============================================================

      // ============================================================
      function PlanningTab({
        usResult,
        indiaResult,
        usIncome,
        income,
        effectiveIncome,
        settings,
        inrToUsd,
        taxYear,
        indiaTotalIncomeINR,
        isCombined,
        projectionRows,
        passiveIncomeMode,
        passiveDerived,
      }) {
        const td = US_TAX_DATA[taxYear];
        const indiaTd = INDIA_TAX_DATA[taxYear];
        const foreignCur = settings.expatCountry === "Malaysia" ? "MYR" : "INR";
        const fmtI = (n) => fmt(Math.round(n / inrToUsd), "USD");
        const fmtU = (n) => fmt(Math.round(n), "USD");
        const cur = settings.currency;
        const isForeignCur = cur === "INR" || cur === "MYR";
        const toUSD = (v) => (isForeignCur ? v / inrToUsd : v);
        const toINR = (v) => (cur === "USD" ? v * inrToUsd : v);
        const liveIncome = effectiveIncome || income;
        const countryOptions = ["India", "Malaysia"];
        const defaultCompareA = settings.expatCountry || "India";
        const defaultCompareB =
          defaultCompareA === "India" ? "Malaysia" : "India";
        const [compareCountryA, setCompareCountryA] = React.useState(defaultCompareA);
        const [compareCountryB, setCompareCountryB] = React.useState(defaultCompareB);
        const planningIncomeUSD = React.useMemo(
          () => normalizeIncomeToUSD(income, settings),
          [income, settings],
        );
        const comparisonSettingsFor = React.useCallback(
          (country) => ({
            ...settings,
            expatCountry: country,
            currency: "USD",
            includeUS: true,
            includeExpat: true,
          }),
          [settings],
        );
        const compareScenarioA = React.useMemo(
          () =>
            computeScenario({
              settings: comparisonSettingsFor(compareCountryA),
              income: planningIncomeUSD,
            }),
          [compareCountryA, comparisonSettingsFor, planningIncomeUSD],
        );
        const compareScenarioB = React.useMemo(
          () =>
            computeScenario({
              settings: comparisonSettingsFor(compareCountryB),
              income: planningIncomeUSD,
            }),
          [compareCountryB, comparisonSettingsFor, planningIncomeUSD],
        );
        const compareRowsA = React.useMemo(
          () =>
            buildProjectionRows({
              settings: comparisonSettingsFor(compareCountryA),
              income: planningIncomeUSD,
            }),
          [compareCountryA, comparisonSettingsFor, planningIncomeUSD],
        );
        const compareRowsB = React.useMemo(
          () =>
            buildProjectionRows({
              settings: comparisonSettingsFor(compareCountryB),
              income: planningIncomeUSD,
            }),
          [compareCountryB, comparisonSettingsFor, planningIncomeUSD],
        );
        const comparisonRows = React.useMemo(
          () =>
            compareRowsA.map((rowA, idx) => {
              const rowB = compareRowsB[idx] || {};
              return {
                year: rowA.year,
                countryA: rowA,
                countryB: rowB,
                taxDeltaUSD: (rowA.combinedTaxUSD || 0) - (rowB.combinedTaxUSD || 0),
                localTaxDeltaUSD:
                  (rowA.expatTaxUSD || 0) - (rowB.expatTaxUSD || 0),
              };
            }),
          [compareRowsA, compareRowsB],
        );
        const comparisonSummary = React.useMemo(() => {
          const rows = comparisonRows || [];
          const totalTaxA = rows.reduce(
            (sum, row) => sum + (row.countryA.combinedTaxUSD || 0),
            0,
          );
          const totalTaxB = rows.reduce(
            (sum, row) => sum + (row.countryB.combinedTaxUSD || 0),
            0,
          );
          const last = rows[rows.length - 1] || {};
          const portfolioA = last.countryA?.portfolioEnd || 0;
          const portfolioB = last.countryB?.portfolioEnd || 0;
          return {
            totalTaxA,
            totalTaxB,
            taxDelta: totalTaxA - totalTaxB,
            portfolioA,
            portfolioB,
            portfolioDelta: portfolioA - portfolioB,
          };
        }, [comparisonRows]);
        const chartMetricOptions = [
          {
            id: "income",
            label: "Income",
            subtitle: "Projected taxable income context",
            valueA: (row) => row.countryA.incomeUSD,
            valueB: (row) => row.countryB.incomeUSD,
          },
          {
            id: "combinedTax",
            label: "Combined Tax",
            subtitle: "US + local country tax",
            valueA: (row) => row.countryA.combinedTaxUSD,
            valueB: (row) => row.countryB.combinedTaxUSD,
          },
          {
            id: "usDrag",
            label: "US Drag",
            subtitle: "US tax from portfolio income",
            valueA: (row) => row.countryA.usTaxDragUSD,
            valueB: (row) => row.countryB.usTaxDragUSD,

          {
            id: "localDrag",

          {
            id: "rmd",
            label: "RMD",
            subtitle: "Required minimum distributions",
            valueA: (row) => row.countryA.rmdUSD,
            valueB: (row) => row.countryB.rmdUSD,
          },
          {
            id: "rothConversion",
            label: "Roth Conversion",
            subtitle: "Country-optimized conversion amount",
            valueA: (row) => row.countryA.rothConversionUSD,
            valueB: (row) => row.countryB.rothConversionUSD,
          },
          {
            id: "brokerage",
            label: "Brokerage",
            subtitle: "Taxable brokerage ending value",
            valueA: (row) => row.countryA.brokerageEnd,
            valueB: (row) => row.countryB.brokerageEnd,
          },
          {
            id: "ira",
            label: "Traditional IRA",
            subtitle: "Traditional IRA ending value",
            valueA: (row) => row.countryA.iraEnd,
            valueB: (row) => row.countryB.iraEnd,
          },
          {
            id: "roth",
            label: "Roth IRA",
            subtitle: "Roth IRA ending value",
            valueA: (row) => row.countryA.rothEnd,
            valueB: (row) => row.countryB.rothEnd,
          },
          {
            id: "portfolioEnd",
            label: "Portfolio End",
            subtitle: "Nominal ending portfolio value",
            valueA: (row) => row.countryA.portfolioEnd,
            valueB: (row) => row.countryB.portfolioEnd,
          },
          {
            id: "realEnd",
            label: "Real End",
            subtitle: "Inflation-adjusted ending value",
            valueA: (row) => row.countryA.realPortfolioEnd,
            valueB: (row) => row.countryB.realPortfolioEnd,
          },
        ];
        const [selectedChartMetricIds, setSelectedChartMetricIds] =
          React.useState(["income", "combinedTax", "portfolioEnd"]);
        const selectedChartMetrics = chartMetricOptions.filter((option) =>
          selectedChartMetricIds.includes(option.id),
        );
        function toggleChartMetric(id) {
          setSelectedChartMetricIds((prev) => {
            if (prev.includes(id)) {
              return prev.length > 1 ? prev.filter((item) => item !== id) : prev;
            }
            return [...prev, id];
          });
        }
        const projectionYears = income.simulationYears || comparisonRows.length;

        const r = usResult;
        const sp1res = indiaResult?.spouse1?.result;
        const totalIndiaTaxINR = indiaResult?.total?.totalINR || 0;
        const isMFJ = settings.filingStatus === "mfj";

        // ── core numbers ──────────────────────────────────────────
        const usGross = r?.totalGrossIncome || 0;
        const usMarginal = r?.marginalOrdRate || 0;
        const usLtcgRate = r?.ltcgRate || 0;
        const usNetTax = r?.netUSTax || 0;
        const ftcClaimed = r?.ftcClaimed || 0;
        const ftcLimit = r?.ftcLimit || 0;
        const ftcUnused = Math.max(0, totalIndiaTaxINR / inrToUsd - ftcClaimed);
        const niitThresh = isMFJ ? 250000 : 200000;
        const niitIncome = r?.niitIncome || 0;
        const prefIncome = r?.prefIncome || 0;
        const taxableOrd = r?.taxableOrdinary || 0;
        const qbiDeduction = r?.qbiDeduction || 0;
        const stdDed = r?.stdDed || 0;

        // income items (USD)
        const wagesUSD = usIncome?.wages || 0;
        const bizUSD = usIncome?.businessIncome || 0;
        const stcgUSD = usIncome?.shortTermGains || 0;
        const ltcgUSD = usIncome?.longTermGains || 0;
        const qdiUSD = usIncome?.qualifiedDividends || 0;
        const ordDivUSD = usIncome?.ordinaryDividends || 0;
        const nonQualDivUSD = Math.max(0, ordDivUSD - qdiUSD);
        const rentalNetUSD = usIncome?.rentalNet || 0;
        const rentalGrossUSD = toUSD(liveIncome.usRentalGross || 0);
        const sec199aUSD = usIncome?.sec199aDividends || 0;

        // India income (INR)
        const indiaSalaryINR = isCombined
          ? toINR(liveIncome.wages || 0)
          : toINR(liveIncome.indiaSalary || 0);
        const indiaStcgINR = toINR(liveIncome.shortTermGains || 0);
        const indiaLtcgINR = toINR(liveIncome.longTermGains || 0);
        const indiaRentalGrossINR = toINR(liveIncome.indiaRentalGross || 0);
        const indiaInterestINR = toINR(liveIncome.interest || 0);

        // India tax rate info
        const indiaSurchargeRate =
          sp1res && sp1res.baseTax + sp1res.specialBaseTax > 0
            ? sp1res.surcharge / (sp1res.baseTax + sp1res.specialBaseTax)
            : 0;
        const indiaEffMultiplier = (1 + indiaSurchargeRate) * 1.04;
        const indiaSlabTopRate = 0.3 * indiaEffMultiplier; // 30% slab + cess + surcharge
        const indiaSTCGEffRate =
          (sp1res?.rates?.stcgEquityRate || 0.2) * indiaEffMultiplier;
        const indiaLTCGEffRate =
          (sp1res?.rates?.ltcgEquityRate || 0.125) * indiaEffMultiplier;

        // India marginal slab rate (for savings calcs)
        const indiaMarginalSlab =
          sp1res && sp1res.taxableOrdinary > 0
            ? (() => {
                const slabs =
                  settings.useNewIndia && indiaTd?.newSlabs
                    ? indiaTd.newSlabs
                    : indiaTd?.oldSlabs || [];
                let rate = 0,
                  prev = 0;
                for (const s of slabs) {
                  if (sp1res.taxableOrdinary > prev) rate = s.rate;
                  if (sp1res.taxableOrdinary <= s.max) break;
                  prev = s.max;
                }
                return rate;
              })()
            : 0;

        // ── flags ─────────────────────────────────────────────────
        const hasWages = wagesUSD > 0;
        const earnedIncomeUSD = wagesUSD + bizUSD;
        const hasEarnedIncome = earnedIncomeUSD > 0;
        const hasBiz = bizUSD > 0;
        const hasLTCG = ltcgUSD > 0;
        const hasSTCG = stcgUSD > 0;
        const hasQDI = qdiUSD > 0;
        const hasNonQualDiv = nonQualDivUSD > 500;
        const hasUSRental = (liveIncome.usRentalGross || 0) > 0;
        const hasIndiaRental = (liveIncome.indiaRentalGross || 0) > 0;
        const hasIndiaIncome = indiaTotalIncomeINR > 0;
        const subjectToNIIT = usGross > niitThresh && niitIncome > 0;
        const indiaNewRegime = settings.useNewIndia;
        const hasOldRegime = !!indiaTd?.oldSlabs;
        const indiaHasSTCG = indiaStcgINR > 0;
        const indiaHasLTCG = indiaLtcgINR > 0;
        const indiaHasInterest = indiaInterestINR > 100;

        // ── potential savings computations ───────────────────────
        // 401k: $23,000 employee contribution saves at marginal rate
        const k401kContrib = Math.min(23000, wagesUSD);
        const k401kSaving = k401kContrib * usMarginal;
        // SEP-IRA: 25% of net biz income, max $69,000
        const sepContrib = Math.min(69000, bizUSD * 0.25);
        const sepSaving = sepContrib * usMarginal;
        // HSA
        const hsaContrib = isMFJ ? 8300 : 4150;
        const hsaSaving = hsaContrib * usMarginal;
        // STCG→LTCG conversion saving
        const stcgToLtcgSaving = stcgUSD * (usMarginal - usLtcgRate);
        // Non-qual div → qual div saving
        const nqDivSaving = nonQualDivUSD * (usMarginal - usLtcgRate);
        // NIIT saving if eliminated (rough)
        const niitSaving = niitIncome * 0.038;
        // QBI max room
        const qbiMaxRoom = (bizUSD + sec199aUSD) * 0.2 - qbiDeduction;
        const qbiRoomSaving = Math.max(0, qbiMaxRoom) * usMarginal;
        // India 80C (old regime): full 1.5L at top marginal
        const india80CSaving =
          150000 * indiaMarginalSlab * indiaEffMultiplier * 2; // both spouses
        // India 80CCD extra NPS saving
        const indiaNPSSaving =
          50000 * indiaMarginalSlab * indiaEffMultiplier * 2;
        // India 80D saving
        const india80DSaving =
          (isMFJ ? 100000 : 50000) * indiaMarginalSlab * indiaEffMultiplier * 2;
        // India employer NPS (new regime): 14% of salary
        const indiaEmployerNPS = Math.min(indiaSalaryINR * 0.14, 0); // only if structured as employer contrib
        // STCG→LTCG in India: saves difference between STCG and LTCG eff rates
        const indiaStcgToLtcgSaving =
          indiaStcgINR * (indiaSTCGEffRate - indiaLTCGEffRate);
        // India interest in NRE: currently taxable in India at top slab; NRE would be exempt
        const indiaNRESaving =
          indiaInterestINR * indiaMarginalSlab * indiaEffMultiplier * 2;
        // FEIE saving: earned income up to $126,500 excluded if applicable
        const feieExclusion = Math.min(126500, earnedIncomeUSD);
        const feieSaving = feieExclusion * usMarginal; // rough – ignores FTC tradeoff
        // Regime switch saving (India): rough — compare new vs old on per-spouse basis
        let regimeSwitchSavingINR = 0;
        if (indiaTd && sp1res) {
          const altRegime = !indiaNewRegime;
          const altR = calcIndiaTax(
            sp1res.taxableOrdinary + (sp1res.sd || 0),
            indiaTd,
            altRegime,
            hasWages,
            {
              stcg: indiaStcgINR / 2,
              ltcgEquity: indiaLtcgINR / 2,
              ltcgOther: 0,
            },
            taxYear,
          );
          regimeSwitchSavingINR = (sp1res.total - altR.total) * 2; // positive = current is better
        }

        if (!r && !indiaResult) {
          return (
            <div
              className="main-wrap"
              style={{ textAlign: "center", paddingTop: 60 }}
            >
              <div style={{ fontSize: 32, marginBottom: 12 }}>💡</div>
              <div style={{ fontSize: 16, fontWeight: 600, marginBottom: 8 }}>
                Enter income data first
              </div>
              <div style={{ fontSize: 13, color: "var(--text3)" }}>
                Go to the Income tab and enter your numbers to get personalised
                planning ideas.
              </div>

        // ── UI helpers ────────────────────────────────────────────
        function OpCard({

        function Num({ v, currency }) {
          return (
            <strong
              style={{
                color: "var(--text)",
                fontFamily: "'IBM Plex Mono',monospace",
              }}
            >
              {(currency === "INR" || currency === "MYR") ? fmtI(v) : fmtU(v)}

        function Section({ title, children }) {
          return (
            <div style={{ marginBottom: 28 }}>

                  sure each basket is optimised independently.
                </OpCard>
              )}

              <OpCard
                emoji="💼"
                title="Investment Account Structure"
                country="Both countries"
                saving={null}
                priority="medium"
              >
                •{" "}
                <strong>Indian mutual funds = PFIC from US perspective</strong>{" "}
                — avoid. Use direct Indian equities (individual stocks) or
                US-domiciled international ETFs for Indian market exposure.
                <br />• <strong>NRE FDs</strong>: interest tax-free in India,
                fully repatriable, taxable in US — best for short-to-medium-term
                {settings.expatCountry === "India" ? "rupee" : "ringgit"} savings.
                <br />• <strong>FCNR deposits</strong>: foreign currency
                deposits, interest exempt in India, repatriable — good for
                USD-denominated savings avoiding forex risk.
                <br />• <strong>US 401k / IRA</strong>: continue contributing
                even while abroad — grows tax-deferred in US and distribution
                timing can be managed. Note India may tax distributions as
                income in the year received.
              </OpCard>

              <OpCard
                emoji="📅"
                title="Tax Year Mismatch — Planning Calendar"
                country="Both countries"
                saving={null}
                priority="medium"
              >
                India FY: 1 Apr – 31 Mar. US: 1 Jan – 31 Dec. The Jan–Mar
                overlap creates opportunities:
                <br />• <strong>Defer India income to April</strong>: pushes it
                into the next India FY while staying in the same US calendar
                year — can smooth India bracket exposure.
                <br />• <strong>FTC timing</strong>: India advance tax paid in
                March is a foreign tax paid in the current US year, but covers
                income that spans India FYs — coordinate with your CPA on which
                US year to claim it.
                <br />• <strong>Capital gains realisation</strong>: realise
                gains just after 31 March (new India FY) to maximise the time
                before India tax is due, while the US tax falls in the same
                calendar year.
              </OpCard>

              <OpCard
                emoji="⚠️"
                title="SE Tax & Social Security"
                country="US — Self-Employment Tax"
                saving={null}
                priority="medium"
              >
                The US and India have no Social Security Totalization Agreement.
                If you have US self-employment income:
                <br />• You owe <strong>15.3% SE tax</strong> on net
                self-employment income up to $168,600 (2024) + 2.9% Medicare
                above that — no cap.
                <br />
                • India does not have an equivalent bilateral exemption — you
                may owe both.
                <br />• <strong>S-Corp structure</strong> remains the best
                SE-tax mitigation: salary portion pays SE tax, distribution
                portion does not. At {pct(0.153)} SE rate on <Num v={bizUSD} />,
                a 60/40 salary-distribution split saves ~
                <Num v={bizUSD * 0.4 * 0.153} />.
              </OpCard>
            </Section>

            <div
              style={{
                fontSize: 11,
                color: "var(--text3)",
                marginTop: 16,
                padding: "14px 16px",
                background: "var(--bg2)",
                borderRadius: 8,
                lineHeight: 1.7,
              }}
            >
              <strong>Disclaimer:</strong> These are general planning ideas for
              educational purposes only and do not constitute tax advice. Tax
              laws change frequently. Consult a CPA, Enrolled Agent, or CA with
              cross-border expertise before implementing any strategy. Savings
              estimates are approximations based on your entered income and
              marginal rates.
            </div>
          </div>
        );
      }

      // ============================================================
      // MAIN APP
      // ============================================================
      function usePersisted(key, defaultVal) {
        const [state, setState] = React.useState(() => {
          try {
            const saved = localStorage.getItem(key);
            if (saved) return { ...defaultVal, ...JSON.parse(saved) };
          } catch (e) {}
          return defaultVal;
        });
        const set = React.useCallback(
          (valOrFn) => {
            setState((prev) => {
              const next =
                typeof valOrFn === "function" ? valOrFn(prev) : valOrFn;
              try {
                localStorage.setItem(key, JSON.stringify(next));
              } catch (e) {}
              return next;
            });
          },
          [key],
        );
        return [state, set];
      }

      function App() {
        const [tab, setTab] = React.useState("home");
        const appRef = React.useRef(null);
        const [settings, setSettings] = usePersisted(
          "expattax_settings",
          DEFAULT_SETTINGS,
        );
        const [income, setIncome] = usePersisted(
          "expattax_income",
          DEFAULT_INCOME,
        );

        const handleSaveSettings = (newSettings) => {
          setSettings(newSettings);
          setTab("income");
        };

        const handleToggleMode = (newMode) => {
          setSettings((prev) => ({ ...prev, splitIncomeMode: newMode }));
        };

        const {
          taxYear,
          expatCountry,
          includeExpat,
          includeUS,
          territorialForeignIncomeExempt,
        } = settings;
        const scenario = React.useMemo(
          () => computeScenario({ settings, income }),
          [settings, income],
        );
        const projectionRows = React.useMemo(
          () => buildProjectionRows({ settings, income }),
          [settings, income],
        );
        const {
          passiveIncomeMode,
          passiveDerived,
          effectiveIncome,
          expatToUsd,
          isCombined,
          malaysiaTerritorialExempt,
          usRentalGrossUSD,
          usAutoDepreciation,
          totalIndiaRentalNetINR,
          indiaStcgINR,
          indiaLtcgINR,
          indiaTotalIncomeINR,
          indiaResult,
          indiaTaxUSD,
          usIncome,
          usResult,
          totalUSTax,
          totalIndiaTax,
          totalIndiaTaxUSD,
          combinedTaxUSD,
          combinedIncomeUSD,
        } = scenario;
        const toLocal = (v) => (settings.currency === "USD" ? v * expatToUsd : v);

        function handleExportReport() {
          const stamp = new Date().toISOString().replace(/[:.]/g, "-");
          const uiSnapshot = normalizeExportText(
            (appRef.current && (appRef.current.innerText || appRef.current.textContent)) ||
              "",
          );
          const report = buildExportReport({
            currentTab: tab,
            settings,
            income,
            effectiveIncome,
            passiveIncomeMode,
            passiveDerived,
            usIncome,
            usResult,
            indiaResult,
            totalUSTax,
            totalIndiaTax,
            totalIndiaTaxUSD,
            combinedTaxUSD,
            combinedIncomeUSD,
            totalIndiaRentalNetINR,
            expatToUsd,
            projectionRows,
            uiSnapshot,
          });
          downloadTextReport(`expattax-export-${stamp}.txt`, report);
        }

        return (
          <div ref={appRef}>
            <div className="nav">
              <div className="nav-logo">⬡ ExpatTax</div>
              {[
                { id: "home", label: "Overview" },
                { id: "setup", label: "Setup" },
                { id: "income", label: "Income" },
                { id: "results", label: "Taxes" },
                { id: "planning", label: "Planning" },
              ].map((item) => (
                <button
                  key={item.id}
                  className={`tab-btn ${tab === item.id ? "active" : ""}`}
                  onClick={() => setTab(item.id)}
                >
                  {item.label}
                </button>
              ))}
              <div className="nav-meta">
                <span className="nav-chip">FY {taxYear}</span>
                <span className="nav-chip">{expatCountry}</span>
                <span className="nav-chip">
                  {settings.filingStatus === "mfj" ? "MFJ" : "Single"}
                </span>
	                <span className="nav-chip">
	                  {tab === "planning"
	                    ? "$ planning view"
	                    : `${expatCountry === "Malaysia" ? "RM" : "₹"}${expatToUsd}/$1`}
	                </span>
                <span className="nav-chip accent">
                  {isCombined ? "Combined mode" : "By-country mode"}
                </span>
                <button
                  className="ghost-btn"
                  onClick={handleExportReport}
                  style={{ padding: "7px 12px", fontSize: 12 }}
                >
                  Export TXT
                </button>
              </div>
            </div>

            {tab === "home" && (
              <HomePanel
                settings={settings}
                income={effectiveIncome}
                setTab={setTab}
                combinedTaxUSD={combinedTaxUSD}
                combinedIncomeUSD={combinedIncomeUSD}
              />
            )}

            {tab === "setup" && (
              <SettingsPanel
                settings={settings}
                onSave={handleSaveSettings}
                onChange={setSettings}
              />
            )}

            {tab === "income" && (
              <IncomePanel
                income={income}
                onChange={setIncome}
                settings={settings}
                onChangeSettings={setSettings}
                onToggleMode={handleToggleMode}
                onChangeCurrency={(c) =>
                  setSettings((prev) => ({ ...prev, currency: c }))
                }
              />
            )}

            {tab === "results" && (
              <div className="main-wrap">
                <div style={{ marginBottom: 20 }}>
                  <div style={{ fontSize: 20, fontWeight: 600 }}>
                    Tax Summary — {taxYear}
                  </div>
                  <div
                    style={{
                      fontSize: 13,
                      color: "var(--text3)",
                      marginTop: 2,
                    }}
                  >
                    US expat {settings.filingStatus === "mfj" ? "filers" : "taxpayer"} · {settings.expatCountry} FTC claimed on US return
                  </div>
                </div>

                {/* Banner */}
                <div className="total-banner">
                  <div className="total-banner-item">
                    <div className="total-banner-label">Net US Tax Owed</div>
                    <div
                      className="total-banner-val"
                      style={{ color: "var(--blue)" }}
                    >
                      {fmt(totalUSTax, "USD")}
                    </div>
                    <div
                      style={{
                        fontSize: 11,
                        color: "var(--text3)",
                        marginTop: 2,
                      }}
                    >
                      After FTC
                    </div>
                  </div>
                  <div
                    style={{
                      width: 1,
                      height: 60,
                      background: "var(--border)",
                    }}
                  />
                  <div className="total-banner-item">
                    <div className="total-banner-label">
                      {settings.expatCountry} Tax (Combined)
                    </div>
                    <div
                      className="total-banner-val"
                      style={{ color: "var(--orange)" }}
                    >
                      {fmt(totalIndiaTax, expatCountry === "Malaysia" ? "MYR" : "INR")}
                    </div>
                    <div
                      style={{
                        fontSize: 11,
                        color: "var(--text3)",
                        marginTop: 2,
                      }}
                    >
                      {fmt(totalIndiaTaxUSD, "USD")}
                    </div>
                  </div>
                  <div
                    style={{
                      width: 1,
                      height: 60,
                      background: "var(--border)",
                    }}
                  />
                  <div className="total-banner-item">
                    <div className="total-banner-label">Total Combined</div>
                    <div
                      className="total-banner-val"
                      style={{ color: "var(--gold)" }}
                    >
                      {fmt(combinedTaxUSD, "USD")}
                    </div>
                    <div
                      style={{
                        fontSize: 11,
                        color: "var(--text3)",
                        marginTop: 2,
                      }}
                    >
                      {combinedIncomeUSD > 0
                        ? pct((combinedTaxUSD / combinedIncomeUSD) * 100)
                        : ""}{" "}
                      combined eff. rate
                    </div>
                  </div>
                  <div
                    style={{
                      width: 1,
                      height: 60,
                      background: "var(--border)",
                    }}
                  />
                  <div className="total-banner-item">
                    <div className="total-banner-label">FTC Credit Used</div>
                    <div
                      className="total-banner-val"
                      style={{ color: "var(--green)" }}
                    >
                      {usResult ? fmt(usResult.ftcClaimed, "USD") : "—"}
                    </div>
                    <div
                      style={{
                        fontSize: 11,
                        color: "var(--text3)",
                        marginTop: 2,
                      }}
                    >
                      Reduces US tax
                    </div>
                  </div>
                </div>

                {indiaResult && (
                  <ExpatResultCard
                    result={indiaResult}
                    settings={settings}
                    inrToUsd={expatToUsd}
                    taxYear={taxYear}
                    incomeINR={{
                      salary: isCombined
                        ? malaysiaTerritorialExempt
                          ? 0
                          : toLocal(effectiveIncome.wages)
                        : toLocal(effectiveIncome.indiaSalary || 0),
                      business:
                        isCombined && !malaysiaTerritorialExempt
                          ? toLocal(effectiveIncome.businessIncome)
                          : 0,
                      other: toLocal(effectiveIncome.indiaOtherIncome || 0),
                      rental: totalIndiaRentalNetINR,
                      combined: isCombined,
                      interest:
                        expatCountry === "India"
                          ? toLocal(effectiveIncome.interest || 0)
                          : 0,
                      dividends:
                        expatCountry === "India"
                          ? toLocal(effectiveIncome.ordinaryDividends || 0)
                          : 0,
                      stcg: expatCountry === "India" ? indiaStcgINR : 0,
                      ltcgEquity:
                        expatCountry === "India" ? indiaLtcgINR : 0,
                      excludedSalary:
                        expatCountry === "Malaysia" && territorialForeignIncomeExempt
                          ? toLocal(effectiveIncome.wages || 0)
                          : 0,
                      excludedBusiness:
                        expatCountry === "Malaysia" && territorialForeignIncomeExempt
                          ? toLocal(effectiveIncome.businessIncome || 0)
                          : 0,
                      excludedInterest:
                        expatCountry === "Malaysia" && territorialForeignIncomeExempt
                          ? toLocal(effectiveIncome.interest || 0)
                          : 0,
                      excludedDividends:
                        expatCountry === "Malaysia" && territorialForeignIncomeExempt
                          ? toLocal(effectiveIncome.ordinaryDividends || 0)
                          : 0,
                      excludedStcg:
                        expatCountry === "Malaysia" && territorialForeignIncomeExempt
                          ? toLocal(effectiveIncome.shortTermGains || 0)
                          : 0,
                      excludedLtcg:
                        expatCountry === "Malaysia" && territorialForeignIncomeExempt
                          ? toLocal(effectiveIncome.longTermGains || 0)
                          : 0,
                      excludedRental:
                        expatCountry === "Malaysia" && territorialForeignIncomeExempt
                          ? toLocal(effectiveIncome.usRentalGross || 0)
                          : 0,
                    }}
                  />
                )}
                {usResult && (
                  <USResultCard
                    result={usResult}
                    settings={settings}
                    indiaTaxUSD={indiaTaxUSD}
                    usIncome={usIncome}
                    usAutoDepreciation={usAutoDepreciation}
                    usRentalGrossUSD={usRentalGrossUSD}
                  />
                )}

                {!includeExpat && !includeUS && (
                  <div
                    className="info-box"
                    style={{ textAlign: "center", padding: 32 }}
                  >
                    Enable at least one country in Setup to see taxes.
                  </div>
                )}

                <div
                  style={{
                    fontSize: 11,
                    color: "var(--text3)",
                    marginTop: 24,
                    padding: "16px",
                    background: "var(--bg2)",
                    borderRadius: 8,
                    lineHeight: 1.7,
                  }}
                >
                  <strong style={{ color: "var(--text3)" }}>Disclaimer:</strong>{" "}
                  This tool provides estimates for informational purposes only.
                  Tax laws are complex and change frequently. Always consult a
                  qualified CPA or tax attorney for advice specific to your
                  situation. This calculator does not account for state taxes,
                  AMT, FEIE, foreign pension income, treaty provisions, or all
                  possible deductions.
                </div>
              </div>
            )}

            {tab === "planning" && (
              <PlanningTab
                usResult={usResult}
                indiaResult={indiaResult}
                usIncome={usIncome}
                income={income}
                effectiveIncome={effectiveIncome}
                settings={settings}
                inrToUsd={expatToUsd}
                taxYear={taxYear}
                indiaTotalIncomeINR={indiaTotalIncomeINR}
                isCombined={isCombined}
                projectionRows={projectionRows}
                passiveIncomeMode={passiveIncomeMode}
                passiveDerived={passiveDerived}
              />
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
