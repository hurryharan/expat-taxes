<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expat Tax Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link

      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "IBM Plex Sans", sans-serif;
        background: #0f1117;
        color: #e8e9eb;
        min-height: 100vh;
      }

      :root {
        --bg: #0f1117;
        --bg2: #161b26;
        --bg3: #1e2535;
        --bg4: #252d40;
        --border: #2a3348;
        --border2: #3a4560;
        --text: #e8e9eb;
        --text2: #9aa3b8;
        --text3: #606880;
        --blue: #4a9eff;
        --blue2: #1a4a8a;
        --blue3: #0d2545;
        --green: #3ecf8e;
        --green2: #1a6b4a;
        --green3: #0d3522;
        --orange: #f59e42;
        --orange2: #7a4a10;
        --red: #f06060;
        --red2: #7a1a1a;
        --purple: #a78bfa;
        --purple2: #4a2a8a;
        --gold: #e8c84a;
        --radius: 8px;
        --radius2: 12px;
      }

      input,
      select,
      textarea {
        background: var(--bg3);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: var(--radius);
        padding: 8px 12px;
        font-family: inherit;
        font-size: 14px;
        outline: none;
        transition: border 0.2s;
        width: 100%;
      }

      input:focus,
      select:focus {
        border-color: var(--blue);
      }

      input[type="number"] {
        font-family: "IBM Plex Mono", monospace;
      }

      button {
        cursor: pointer;
        font-family: inherit;
        border: none;
        border-radius: var(--radius);
        font-size: 13px;
        font-weight: 500;
        transition: all 0.15s;
      }

      .tab-btn {
        background: transparent;
        color: var(--text2);
        padding: 8px 16px;
        border-radius: var(--radius);
        border: 1px solid transparent;
      }

      .tab-btn.active {
        background: var(--bg3);
        color: var(--text);
        border-color: var(--border);
      }

      .tab-btn:hover:not(.active) {
        color: var(--text);
      }

      .section-card {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: var(--radius2);
        padding: 20px;
        margin-bottom: 16px;
      }

      .label {
        font-size: 12px;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 6px;
      }

      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 12px;
      }

      .field-row-3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
        margin-bottom: 12px;
      }

      .field-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 12px;
      }

      .mono {
        font-family: "IBM Plex Mono", monospace;
      }

      .positive {
        color: var(--green);
      }

      .negative {
        color: var(--red);
      }

      .dimmed {
        color: var(--text3);
      }

      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 500;
      }

      .badge-blue {
        background: var(--blue3);
        color: var(--blue);
      }

      .badge-green {
        background: var(--green3);
        color: var(--green);
      }

      .badge-orange {
        background: var(--orange2);
        color: var(--orange);
      }

      .badge-red {
        background: var(--red2);
        color: var(--red);
      }

      .toggle-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .toggle {
        position: relative;
        width: 40px;
        height: 22px;
        flex-shrink: 0;
      }

      .toggle input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .toggle-slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: var(--bg4);
        border-radius: 11px;
        transition: 0.2s;
      }

      .toggle-slider:before {
        position: absolute;
        content: "";
        height: 16px;
        width: 16px;
        left: 3px;
        bottom: 3px;
        background: var(--text3);
        border-radius: 50%;
        transition: 0.2s;
      }

      .toggle input:checked + .toggle-slider {
        background: var(--blue2);
      }

      .toggle input:checked + .toggle-slider:before {
        transform: translateX(18px);
        background: var(--blue);
      }

      .divider {
        border: none;
        border-top: 1px solid var(--border);
        margin: 16px 0;
      }

      .number-tag {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
      }

      .breakdown-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
      }

      .breakdown-row:last-child {
        border-bottom: none;
      }

      .breakdown-row.total {
        font-weight: 600;
        font-size: 15px;
        padding-top: 12px;
        border-top: 2px solid var(--border2);
        border-bottom: none;
        margin-top: 4px;
      }

      .breakdown-row.sub {
        padding-left: 16px;
        font-size: 13px;
        color: var(--text2);
      }

      .breakdown-row.sub .breakdown-val {
        font-size: 13px;
      }

      .breakdown-val {
        font-family: "IBM Plex Mono", monospace;
        font-size: 14px;
      }

      .country-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .flag {
        font-size: 24px;
      }

      .country-title {
        font-size: 18px;
        font-weight: 600;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 16px;
      }

      .metric-card {
        background: var(--bg3);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
      }

      .metric-label {
        font-size: 11px;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 6px;
      }

      .metric-val {
        font-size: 20px;
        font-weight: 600;
        font-family: "IBM Plex Mono", monospace;
      }

      .metric-sub {
        font-size: 11px;
        color: var(--text3);
        margin-top: 2px;
      }

      .nav {
        display: flex;
        gap: 6px;
        padding: 16px 24px;
        background: var(--bg2);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .nav-logo {
        font-weight: 600;
        font-size: 15px;
        color: var(--blue);
        margin-right: 16px;
        display: flex;
        align-items: center;
      }

      .nav-meta {
        margin-left: auto;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }

      .nav-chip {
        font-size: 11px;
        color: var(--text2);
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.02);
      }

      .nav-chip.accent {
        color: var(--blue);
        border-color: var(--blue2);
        background: var(--blue3);
      }

      .main-wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }

      .side-by-side {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .save-btn {
        background: var(--blue);
        color: white;
        padding: 9px 20px;
        border-radius: var(--radius);
        font-size: 13px;
        font-weight: 600;
      }

      .save-btn:hover {
        background: #2a8ef0;
      }

      .ghost-btn {
        background: transparent;
        color: var(--text);
        padding: 9px 18px;
        border: 1px solid var(--border2);
      }

      .ghost-btn:hover {
        border-color: var(--blue);
        color: var(--blue);
      }

      .section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text2);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        margin-bottom: 14px;
      }

      .info-box {
        background: var(--bg3);
        border: 1px solid var(--border);
        border-left: 3px solid var(--blue);
        border-radius: var(--radius);
        padding: 12px 14px;
        font-size: 13px;
        color: var(--text2);
        margin-top: 8px;
      }

      .warn-box {
        background: var(--bg3);
        border: 1px solid var(--border);
        border-left: 3px solid var(--orange);
        border-radius: var(--radius);
        padding: 12px 14px;
        font-size: 13px;
        color: var(--text2);
        margin-top: 8px;
      }

      .total-banner {
        background: linear-gradient(135deg, var(--bg3), var(--bg4));
        border: 1px solid var(--border2);
        border-radius: var(--radius2);
        padding: 24px;
        margin-bottom: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
      }

      .total-banner-item {
        text-align: center;
      }

      .total-banner-label {
        font-size: 12px;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 4px;
      }

      .total-banner-val {
        font-size: 26px;
        font-weight: 600;
        font-family: "IBM Plex Mono", monospace;
      }

      .ftc-banner {
        background: var(--green3);
        border: 1px solid var(--green2);
        border-radius: var(--radius);
        padding: 12px 16px;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      hr.section-sep {
        border: none;
        border-top: 1px solid var(--border);
        margin: 20px 0;
      }

      .hero-card {
        background:
          radial-gradient(circle at top left, rgba(74, 158, 255, 0.18), transparent 34%),
          linear-gradient(145deg, rgba(30, 37, 53, 0.98), rgba(18, 22, 31, 0.98));
        border: 1px solid var(--border2);
        border-radius: 18px;
        padding: 28px;
        margin-bottom: 18px;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: 1.3fr 0.9fr;
        gap: 18px;
        align-items: stretch;
      }

      .hero-kicker {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border: 1px solid var(--border2);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.03);
        color: var(--text2);
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 16px;
      }

      .hero-title {
        font-size: 38px;
        line-height: 1.05;
        font-weight: 600;
        max-width: 11ch;
        margin-bottom: 14px;
      }

      .hero-copy {
        color: var(--text2);
        font-size: 15px;
        line-height: 1.7;
        max-width: 58ch;
      }

      .hero-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 22px;
      }

      .feature-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: 18px 0;
      }

      .feature-card,
      .support-card,
      .setup-choice {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
      }

      .feature-card strong,
      .support-card strong {
        display: block;
        margin-bottom: 6px;
      }

      .support-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .setup-choice {
        cursor: pointer;
        transition: border-color 0.15s, transform 0.15s, background 0.15s;
      }

      .setup-choice.active {
        border-color: var(--blue);
        background: rgba(74, 158, 255, 0.08);
      }

      .setup-choice:hover {
        border-color: var(--border2);
        transform: translateY(-1px);
      }

      .journey-list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .journey-step {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
      }

      .journey-step-num {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: "IBM Plex Mono", monospace;
        color: var(--blue);
        background: var(--blue3);
        margin-bottom: 12px;
      }

      @media (max-width: 700px) {
        .side-by-side,
        .metric-grid,
        .field-row,
        .field-row-3,
        .feature-grid,
        .support-grid,
        .journey-list,
        .hero-grid {
          grid-template-columns: 1fr;
        }

        .total-banner {
          flex-direction: column;
          text-align: center;
        }

        .nav {
          padding: 14px 16px;
          flex-wrap: wrap;
        }

        .nav-meta {
          margin-left: 0;
        }

        .hero-title {
          font-size: 30px;
          max-width: none;
        }
      }

      select option {
        background: var(--bg3);
      }
    </style>
  </head>

      function calcIndiaSurcharge(taxableIncome, baseTax, year, newRegime) {
        // New regime caps surcharge at 25%; old regime goes up to 37%
        // Thresholds: 50L, 1Cr, 2Cr, 5Cr
        const INR_50L = 5000000;
        const INR_1CR = 10000000;
        const INR_2CR = 20000000;
        const INR_5CR = 50000000;
        let surchargeRate = 0;
        if (taxableIncome > INR_5CR) surchargeRate = newRegime ? 0.25 : 0.37;
        else if (taxableIncome > INR_2CR) surchargeRate = 0.25;
        else if (taxableIncome > INR_1CR) surchargeRate = 0.15;
        else if (taxableIncome > INR_50L) surchargeRate = 0.1;
        return baseTax * surchargeRate;
      }

      function calcIndiaSlabTax(income, slabs) {
        let tax = 0;
        let prev = 0;
        for (const s of slabs) {
          if (income <= prev) break;
          const taxable = Math.min(income, s.max) - prev;
          tax += taxable * s.rate;
          prev = s.max;
        }
        return tax;
      }

      // India rental calc per the sample math provided
      // Revenue - RE Tax - 30% std deduction on (Revenue - RE Tax) - Interest = taxable
      function calcIndiaRentalIncome({
        grossRent,
        reTax,
        additionalExpenses,
        interest,
        isMalaysia,
      }) {
        const revenueAfterExpenses = grossRent - (additionalExpenses || 0);
        const profitAfterReTax = revenueAfterExpenses - reTax;
        const stdDeduction30 = isMalaysia ? 0 : (profitAfterReTax * 0.3);
        const profitAfterSD = profitAfterReTax - stdDeduction30;
        const netAfterInterest = profitAfterSD - interest;
        return {
          revenueAfterExpenses,
          profitAfterReTax,
          stdDeduction30,
          profitAfterSD,
          netAfterInterest: Math.max(0, netAfterInterest),
        };
      }

      // India special flat rates by FY year
      // STCG on equity (111A): 15% until FY2024, 20% from FY2024 onwards
      // LTCG on equity (112A): 10% above 1L until FY2024, 12.5% from FY2024 (exemption removed)
      // LTCG other (112): 20% with indexation (old regime) / 12.5% without (new regime from FY2024)
      function getIndiaSpecialRates(year, useNewRegime) {
        if (year >= 2024) {
          return {
            stcgEquityRate: 0.2, // Sec 111A, raised in Budget 2024
            ltcgEquityRate: 0.125, // Sec 112A, raised in Budget 2024
            ltcgEquityExemption: 0, // ₹1L exemption removed from FY2024-25 (Budget 2024)
            ltcgOtherRate: useNewRegime ? 0.125 : 0.2, // new regime: 12.5% no indexation
          };
        }
        return {
          stcgEquityRate: 0.15, // Sec 111A
          ltcgEquityRate: 0.1, // Sec 112A
          ltcgEquityExemption: 100000, // ₹1L exempt
          ltcgOtherRate: 0.2, // Sec 112 with indexation
        };
      }

      function calcIndiaTax(
        ordinaryIncomeINR,
        data,
        useNewRegime,
        includeStdDeduction,
        specialIncome,
        year,
      ) {
        // specialIncome: {stcg, ltcgEquity, ltcgOther} — all in INR per spouse, default 0
        const si = specialIncome || {};
        const stcg = si.stcg || 0;
        const ltcgEquity = si.ltcgEquity || 0;
        const ltcgOther = si.ltcgOther || 0;
        const rates = getIndiaSpecialRates(year || 2024, useNewRegime);

        const sd = useNewRegime
          ? data.newStdDeduction || 0
          : data.stdDeduction || 0;
        const effectiveSD = includeStdDeduction ? sd : 0;

        // Slab tax applies only to ordinary income
        const taxableOrdinary = Math.max(0, ordinaryIncomeINR - effectiveSD);
        const slabs =
          useNewRegime && data.newSlabs ? data.newSlabs : data.oldSlabs;
        let slabTax = calcIndiaSlabTax(taxableOrdinary, slabs);

        // 87A rebate applies only on ordinary income (not special rate income)
        const totalForRebate = taxableOrdinary; // special income excluded from rebate eligibility check
        if (totalForRebate <= data.rebateLimit) {
          slabTax = Math.max(0, slabTax - Math.min(slabTax, data.rebate87A));
        }

        // Special rate taxes (no surcharge cap for 111A/112A — max surcharge 15%)
        const stcgTax = stcg * rates.stcgEquityRate;
        const ltcgEquityAboveExemption = Math.max(
          0,
          ltcgEquity - rates.ltcgEquityExemption,
        );
        const ltcgEquityTax = ltcgEquityAboveExemption * rates.ltcgEquityRate;
        const ltcgOtherTax = ltcgOther * rates.ltcgOtherRate;
        const specialBaseTax = stcgTax + ltcgEquityTax + ltcgOtherTax;

        const baseTax = slabTax + specialBaseTax;
        const totalIncomeForSurcharge =
          taxableOrdinary + stcg + ltcgEquity + ltcgOther;

        // Surcharge: capped at 15% for special-rate income under 111A/112A
        const ordSurcharge = calcIndiaSurcharge(
          totalIncomeForSurcharge,
          slabTax,
          null,
          useNewRegime,
        );
        // For special rate income, surcharge capped at 15%
        const specialSurchargeRate = Math.min(
          0.15,
          totalIncomeForSurcharge > 50000000
            ? 0.25
            : totalIncomeForSurcharge > 20000000
              ? 0.15
              : totalIncomeForSurcharge > 10000000
                ? 0.15
                : totalIncomeForSurcharge > 5000000
                  ? 0.1
                  : 0,
        );
        const specialSurcharge = specialBaseTax * specialSurchargeRate;
        const surcharge = ordSurcharge + specialSurcharge;

        const cess = (baseTax + surcharge) * 0.04;
        const total = baseTax + surcharge + cess;

        return {
          taxableOrdinary,
          baseTax: slabTax,
          specialBaseTax,
          stcgTax,
          ltcgEquityTax,
          ltcgOtherTax,
          surcharge,
          cess,
          total,
          sd: effectiveSD,
          rates,
          totalIncome: totalIncomeForSurcharge,
          // For display
          stcg,
          ltcgEquity,
          ltcgOther,
          ltcgEquityExemption: rates.ltcgEquityExemption,
        };
      }

      function calcUSBracketTax(income, brackets) {
        let tax = 0,
          prev = 0;
        for (const b of brackets) {
          if (income <= prev) break;
          tax += (Math.min(income, b.max) - prev) * b.rate;
          prev = b.max;
        }
        return tax;
      }

      function getLTCGRate(income, year, mfj) {
        // 2024 thresholds
        const thresh0 = mfj ? 94050 : 47025;
        const thresh15 = mfj ? 583750 : 518900;
        if (income <= thresh0) return 0;
        if (income <= thresh15) return 0.15;
        return 0.2;
      }

      function calcUSOrdinaryTax(taxableOrdinary, excludedForStacking, brackets) {
        if (excludedForStacking <= 0) {
          return calcUSBracketTax(taxableOrdinary, brackets);
        }
        return Math.max(
          0,
          calcUSBracketTax(taxableOrdinary + excludedForStacking, brackets) -
            calcUSBracketTax(excludedForStacking, brackets),
        );
      }

      function calcUSPrefTax(prefIncome, taxableOrdinary, excludedForStacking, year, mfj) {
        if (prefIncome <= 0) {
          return {
            tax: 0,
            marginalRate: 0,
            effectiveRate: 0,
            stackBase: taxableOrdinary + excludedForStacking,
          };
        }
        const thresh0 = mfj ? 94050 : 47025;
        const thresh15 = mfj ? 583750 : 518900;
        const stackBase = taxableOrdinary + excludedForStacking;
        const roomAt0 = Math.max(0, thresh0 - stackBase);
        const taxedAt0 = Math.min(prefIncome, roomAt0);
        const after0 = Math.max(0, prefIncome - taxedAt0);
        const roomAt15 = Math.max(0, thresh15 - Math.max(stackBase, thresh0));
        const taxedAt15 = Math.min(after0, roomAt15);
        const taxedAt20 = Math.max(0, after0 - taxedAt15);
        const tax = taxedAt15 * 0.15 + taxedAt20 * 0.2;
        const marginalRate = taxedAt20 > 0 ? 0.2 : after0 > 0 ? 0.15 : 0;
        return {
          tax,
          marginalRate,
          effectiveRate: prefIncome > 0 ? tax / prefIncome : 0,
          stackBase,
        };
      }

      function calcUSTax({
        wages,
        businessIncome,
        rentalNet,
        interest,
        ordinaryDividends,
        qualifiedDividends,
        exemptIntDividends,
        sec199aDividends,
        longTermGains,
        shortTermGains,
        filingStatus,
        year,
        indiaTaxPaid,
        useFEIE,
      }) {
        const td = US_TAX_DATA[year];
        if (!td) return null;
        const isMFJ = filingStatus === "mfj";
        const brackets = isMFJ ? td.mfj : td.brackets;
        const stdDed = isMFJ ? td.stdDeduction.mfj : td.stdDeduction.single;
        const personalEx = (td.personalExemption || 0) * (isMFJ ? 2 : 1);

        // Treat wages and business income as FEIE-eligible earned income in this simplified model.
        // The exclusion is split proportionally so the remaining taxable mix stays coherent.
        let feieExclusion = 0;
        let feieExcludedWages = 0;
        let feieExcludedBusiness = 0;
        if (useFEIE) {
          const feieLimit =
            year >= 2024 ? 126500 : year === 2023 ? 120000 : 112000;
          const earnedIncomeEligible = Math.max(0, wages) + Math.max(0, businessIncome);
          feieExclusion = Math.min(
            earnedIncomeEligible,
            isMFJ ? feieLimit * 2 : feieLimit,
          );
          if (earnedIncomeEligible > 0 && feieExclusion > 0) {
            feieExcludedWages = feieExclusion * (Math.max(0, wages) / earnedIncomeEligible);
            feieExcludedBusiness = feieExclusion - feieExcludedWages;
          }
        }
        const taxableWages = Math.max(0, wages - feieExcludedWages);
        const taxableBusinessIncome = Math.max(0, businessIncome - feieExcludedBusiness);
        const ordinaryIncome =
          taxableWages +
          taxableBusinessIncome +
          rentalNet +
          interest +
          (ordinaryDividends - qualifiedDividends) +
          shortTermGains;
        // Qualified/LTCG income
        const prefIncome = qualifiedDividends + longTermGains;
        const totalGrossIncome = ordinaryIncome + prefIncome;

        const deductions = stdDed + personalEx;
        const agi = totalGrossIncome; // simplified (no above-line deductions)
        const taxableOrdinaryPreQBI = Math.max(0, ordinaryIncome - deductions);

        // Ordinary bracket tax
        let ordTax = calcUSOrdinaryTax(taxableOrdinaryPreQBI, feieExclusion, brackets);

        // NIIT
        const niitThresh = isMFJ
          ? td.niitThreshold.mfj
          : td.niitThreshold.single;
        const niitIncome = Math.max(
          0,
          Math.min(prefIncome + rentalNet, agi - niitThresh),
        );
        const niitTax = niitIncome * td.niit;

        // QBI deduction (199A) - simplified: 20% of qualified business income
        const qbiDeduction =
          (td.qbiRate || 0) * Math.max(0, taxableBusinessIncome + sec199aDividends);
        // Apply QBI deduction to ordinary income (rough)
        const taxableOrdinary = Math.max(0, taxableOrdinaryPreQBI - qbiDeduction);
        const adjOrdTax = calcUSOrdinaryTax(
          taxableOrdinary,
          feieExclusion,
          brackets,
        );
        ordTax = adjOrdTax;

        // QDI / LTCG preferential tax with FEIE stacking
        const prefTax = calcUSPrefTax(
          prefIncome,
          taxableOrdinary,
          feieExclusion,
          year,
          isMFJ,
        );
        const ltcgRate = prefTax.marginalRate;
        const ltcgEffectiveRate = prefTax.effectiveRate;
        const ltcgTax = prefTax.tax;
        const totalTaxable = taxableOrdinary + prefIncome;

        const grossTax = ordTax + ltcgTax + niitTax;

        // FTC - limited to US tax attributable to foreign income
        // For expats: assume all India income is foreign source
        // FTC cannot exceed US tax * (foreign income / total income)
        const foreignIncome = totalGrossIncome; // assume all income is India-sourced
        const ftcLimit =
          totalGrossIncome > 0
            ? grossTax * (foreignIncome / totalGrossIncome)
            : 0;
        const ftcClaimed = Math.min(indiaTaxPaid, ftcLimit);
        const netUSTax = Math.max(0, grossTax - ftcClaimed);

        // Marginal rate: top bracket hit by taxable ordinary income
        let marginalOrdRate = 0;
        let prev2 = 0;
        for (const b of brackets) {
          if (taxableOrdinary > prev2) marginalOrdRate = b.rate;
          if (taxableOrdinary <= b.max) break;
          prev2 = b.max;
        }

        return {
          feieExclusion,
          feieExcludedWages,
          feieExcludedBusiness,
          feieStackingIncome: feieExclusion,
          agi,
          totalGrossIncome,
          deductions,
          taxableOrdinary,
          totalTaxable,
          ordTax,
          ltcgTax,
          ltcgEffectiveRate,
          niitTax,
          qbiDeduction,
          grossTax,
          ftcLimit,
          ftcClaimed,
          netUSTax,
          stdDed,
          personalEx,
          ltcgRate,
          marginalOrdRate,
          niitIncome,
          ordinaryIncome,
          prefIncome,
          nonQualDiv: ordinaryDividends - qualifiedDividends,
          effectiveRate:
            totalGrossIncome > 0 ? (netUSTax / totalGrossIncome) * 100 : 0,
        };
      }

      function clampPct(n, fallback = 0) {
        const v = Number.isFinite(n) ? n : fallback;
        return Math.max(0, Math.min(100, v));
      }

      function growByRate(value, pct, yearOffset) {
        const base = Math.max(0, value || 0);
        const rate = (Number.isFinite(pct) ? pct : 0) / 100;
        return base * Math.pow(1 + rate, yearOffset);
      }

      function resolvePassiveIncome(income) {
        const passiveIncomeMode =
          income.passiveIncomeMode === "portfolio" ? "portfolio" : "manual";
        if (passiveIncomeMode !== "portfolio") {
          return {
            passiveIncomeMode,
            passiveDerived: null,
            effectiveIncome: { ...income },
          };
        }

        const portfolioValue = Math.max(0, income.portfolioValue || 0);
        const brokeragePct = clampPct(income.portfolioBrokeragePct, 60);
        const brokerageValue = portfolioValue * (brokeragePct / 100);
        const iraValue = Math.max(0, portfolioValue - brokerageValue);
        const rothValue = Math.max(0, income.portfolioRothValue || 0);
        const brokerageEquityPct = clampPct(income.brokerageEquityPct, 60);
        const iraEquityPct = clampPct(income.iraEquityPct, 60);
        const rothEquityPct = clampPct(income.rothEquityPct, 60);
        const brokerageFixedPct = 100 - brokerageEquityPct;
        const iraFixedPct = 100 - iraEquityPct;
        const rothFixedPct = 100 - rothEquityPct;
        const brokerageEquityValue = brokerageValue * (brokerageEquityPct / 100);
        const brokerageFixedValue = brokerageValue * (brokerageFixedPct / 100);
        const iraEquityValue = iraValue * (iraEquityPct / 100);
        const iraFixedValue = iraValue * (iraFixedPct / 100);
        const rothEquityValue = rothValue * (rothEquityPct / 100);
        const rothFixedValue = rothValue * (rothFixedPct / 100);
        const dividendYieldPct = Math.max(0, income.portfolioDividendYieldPct || 0);
        const qualifiedDividendPct = clampPct(
          income.portfolioQualifiedDividendPct,
          85,
        );
        const interestYieldPct = Math.max(0, income.portfolioInterestYieldPct || 0);
        const ltcgYieldPct = Math.max(0, income.portfolioLongTermGainYieldPct || 0);
        const stcgYieldPct = Math.max(0, income.portfolioShortTermGainYieldPct || 0);
        const exemptInterestYieldPct = Math.max(
          0,
          income.portfolioExemptInterestYieldPct || 0,
        );
        const sec199aDividendYieldPct = Math.max(
          0,
          income.portfolioSec199aDividendYieldPct || 0,
        );
        const expectedEquityGrowthPct = Math.max(
          0,
          income.portfolioExpectedEquityGrowthPct || 0,
        );
        const expectedFixedIncomeGrowthPct = Math.max(
          0,
          income.portfolioExpectedFixedIncomeGrowthPct || 0,
        );

        const ordinaryDividends = brokerageEquityValue * (dividendYieldPct / 100);
        const qualifiedDividends =
          ordinaryDividends * (qualifiedDividendPct / 100);
        const interest = brokerageFixedValue * (interestYieldPct / 100);
        const longTermGains = brokerageEquityValue * (ltcgYieldPct / 100);
        const shortTermGains = brokerageEquityValue * (stcgYieldPct / 100);
        const exemptIntDividends =
          brokerageFixedValue * (exemptInterestYieldPct / 100);
        const sec199aDividends =
          brokerageEquityValue * (sec199aDividendYieldPct / 100);
        const brokerageReturnPct =
          (brokerageEquityPct / 100) * expectedEquityGrowthPct +
          (brokerageFixedPct / 100) * expectedFixedIncomeGrowthPct;
        const iraReturnPct =
          (iraEquityPct / 100) * expectedEquityGrowthPct +
          (iraFixedPct / 100) * expectedFixedIncomeGrowthPct;
        const rothReturnPct =
          (rothEquityPct / 100) * expectedEquityGrowthPct +
          (rothFixedPct / 100) * expectedFixedIncomeGrowthPct;
        const totalPortfolioForReturn = brokerageValue + iraValue + rothValue;
        const expectedAnnualReturnPct =
          totalPortfolioForReturn > 0
            ? (brokerageValue * brokerageReturnPct +
                iraValue * iraReturnPct +
                rothValue * rothReturnPct) /
              totalPortfolioForReturn
            : 0;

        const passiveDerived = {
          portfolioValue,
          brokeragePct,
          iraPct: 100 - brokeragePct,
          brokerageEquityPct,
          iraEquityPct,
          rothEquityPct,
          brokerageValue,
          iraValue,
          rothValue,
          brokerageEquityValue,
          brokerageFixedValue,
          iraEquityValue,
          iraFixedValue,
          rothEquityValue,
          rothFixedValue,
          ordinaryDividends,
          qualifiedDividends,
          interest,
          longTermGains,
          shortTermGains,
          exemptIntDividends,
          sec199aDividends,
          taxableOrdinaryDividends: ordinaryDividends,
          taxableQualifiedDividends: qualifiedDividends,
          taxableInterest: interest,
          taxableLTCG: longTermGains,
          taxableSTCG: shortTermGains,
          taxableExemptInt: exemptIntDividends,
          taxableSec199a: sec199aDividends,
          brokerageReturnPct,
          iraReturnPct,
          rothReturnPct,
          expectedAnnualReturnPct,
          estimatedPassiveIncome:
            ordinaryDividends +
            interest +
            longTermGains +
            shortTermGains +
            exemptIntDividends,
        };

        return {
          passiveIncomeMode,
          passiveDerived,
          effectiveIncome: {
            ...income,
            shortTermGains: shortTermGains,
            longTermGains: longTermGains,
            interest: interest,
            ordinaryDividends: ordinaryDividends,
            qualifiedDividends: qualifiedDividends,
            exemptIntDividends: exemptIntDividends,
            sec199aDividends: sec199aDividends,
          },
        };
      }

      function calcRMD(iraBalance, age) {
        if (age < 73) return 0;
        const table = {
          73: 26.5, 74: 25.5, 75: 24.6, 76: 23.7, 77: 22.9, 78: 22.0, 79: 21.1,
          80: 20.2, 81: 19.4, 82: 18.5, 83: 17.7, 84: 16.8, 85: 16.0, 86: 15.2,
          87: 14.4, 88: 13.7, 89: 12.9, 90: 12.2, 91: 11.5, 92: 10.8, 93: 10.1,
          94: 9.5, 95: 8.9, 96: 8.4, 97: 7.8, 98: 7.3, 99: 6.8, 100: 6.4,
        };
        const factor = table[Math.min(age, 100)] || 6.4;
        return Math.max(0, iraBalance) / factor;
      }

      function calcSSTaxableAmount(ssBenefit, otherIncome, isMFJ) {
        const provisional = Math.max(0, otherIncome) + Math.max(0, ssBenefit) * 0.5;
        const thresh1 = isMFJ ? 32000 : 25000;
        const thresh2 = isMFJ ? 44000 : 34000;
        if (provisional <= thresh1) return 0;
        if (provisional <= thresh2) {
          return Math.min(ssBenefit * 0.5, (provisional - thresh1) * 0.5);
        }
        return Math.min(
          ssBenefit * 0.85,
          (provisional - thresh2) * 0.85 +
            Math.min(ssBenefit * 0.5, (thresh2 - thresh1) * 0.5),
        );
      }

      function rothBracketCeiling(targetRate, filingStatus) {
        const isMFJ = filingStatus === "mfj";
        const mfj = {
          0.1: 23200,
          0.12: 94300,
          0.22: 201050,
          0.24: 383900,
          0.32: 487450,
          0.35: 731200,
        };
        const single = {
          0.1: 11600,
          0.12: 47150,
          0.22: 100525,
          0.24: 191950,
          0.32: 243725,
          0.35: 609350,
        };
        const table = isMFJ ? mfj : single;
        return table[targetRate] || table[0.22];
      }

      function calcOptimalRothConversion({
        settings,
        projectedIncome,
        iraBalance,
        rmdAmount,
        ssTaxableIncome,
        ordinaryIncomeBeforeConversion,
      }) {
        if (!projectedIncome.enableRothConversion || projectedIncome.passiveIncomeMode !== "portfolio") {
          return 0;
        }
        const iraAfterRmd = Math.max(0, iraBalance - rmdAmount);
        if (iraAfterRmd <= 0) return 0;

        const targetRate = Number(projectedIncome.rothConversionTargetRate || 0.22);
        const stdDed = (settings.filingStatus || "mfj") === "mfj" ? 29200 : 14600;
        const bracketCeiling = rothBracketCeiling(targetRate, settings.filingStatus);
        const taxablePreConversion = Math.max(
          0,
          ordinaryIncomeBeforeConversion + ssTaxableIncome - stdDed,
        );
        const maxConvert = Math.min(
          iraAfterRmd,
          Math.max(0, bracketCeiling - taxablePreConversion),
        );
        if (maxConvert <= 0) return 0;

        const baseIncome = {
          ...projectedIncome,
          iraDistribution: rmdAmount,
          ssTaxableIncome,
        };
        const baseTax = computeScenario({ settings, income: baseIncome }).combinedTaxUSD || 0;
        const taxCostFor = (conversion) => {
          const scenario = computeScenario({
            settings,
            income: {
              ...projectedIncome,
              iraDistribution: rmdAmount + conversion,
              ssTaxableIncome,
            },
          });
          return Math.max(0, (scenario.combinedTaxUSD || 0) - baseTax);
        };

        if (taxCostFor(1) > targetRate) return 0;
        if (taxCostFor(maxConvert) / maxConvert <= targetRate) {
          return Math.round(maxConvert);
        }

        let low = 0;
        let high = maxConvert;
        for (let i = 0; i < 18; i += 1) {
          const mid = (low + high) / 2;
          const effectiveRate = mid > 0 ? taxCostFor(mid) / mid : 0;
          if (effectiveRate <= targetRate) low = mid;
          else high = mid;
        }
        return Math.round(low);
      }

      function computeScenario({ settings, income }) {
        const {
          passiveIncomeMode,
          passiveDerived,
          effectiveIncome,
        } = resolvePassiveIncome(income);

        if (settings.includeUSRealEstate === false) {
          effectiveIncome.usRentalGross = 0;
          effectiveIncome.usRentalMortgageInterest = 0;
          effectiveIncome.usRentalPropertyTax = 0;
          effectiveIncome.usRentalDepreciation = 0;
          effectiveIncome.usRentalOtherExpenses = 0;
        }

        const {
          inrToUsd,
          myrToUsd,
          taxYear,
          filingStatus,
          useNewIndia,
          expatTaxRegime,
          useFEIE,
          expatCountry,
          currency,
          includeExpat,
          includeUS,
          splitIncomeMode,
          territorialForeignIncomeExempt,
        } = settings;
        const expatToUsd = expatCountry === "Malaysia" ? myrToUsd : inrToUsd;
        const isCombined = splitIncomeMode === "combined";
        const malaysiaTerritorialExempt =
          expatCountry === "Malaysia" && territorialForeignIncomeExempt;

        function toUSD(v) {
          return currency !== "USD" ? v / expatToUsd : v;
        }
        function toINR(v) {
          return currency === "USD" ? v * expatToUsd : v;
        }

        const usRentalGrossUSD = toUSD(effectiveIncome.usRentalGross);
        const usPropertyPriceUSD = toUSD(settings.usPropertyPrice || 0);
        const usAutoDepreciation = (usPropertyPriceUSD * 0.8) / 27.5;
        const usRentalNet = Math.max(
          0,
          usRentalGrossUSD -
            toUSD(effectiveIncome.usRentalMortgageInterest) -
            toUSD(effectiveIncome.usRentalPropertyTax) -
            usAutoDepreciation -
            toUSD(effectiveIncome.usRentalOtherExpenses),
        );

        const indiaRentalDetailINR = calcIndiaRentalIncome({
          grossRent: toINR(effectiveIncome.indiaRentalGross),
          reTax: toINR(effectiveIncome.indiaRentalReTax),
          additionalExpenses: toINR(effectiveIncome.indiaRentalAddlExpenses),
          interest: toINR(effectiveIncome.indiaRentalInterest),
          isMalaysia: expatCountry === "Malaysia",
        });

        const usRentalUnderIndiaRulesINR =
          expatCountry === "Malaysia"
            ? {
                grossRent: 0,
                reTax: 0,
                additionalExpenses: 0,
                interest: 0,
                revenueAfterExpenses: 0,
                profitAfterReTax: 0,
                stdDeduction30: 0,
                profitAfterSD: 0,
                netAfterInterest: 0,
              }
            : calcIndiaRentalIncome({
                grossRent: toINR(effectiveIncome.usRentalGross),
                reTax: toINR(effectiveIncome.usRentalPropertyTax),
                additionalExpenses: 0,
                interest: toINR(effectiveIncome.usRentalMortgageInterest),
              });

        const totalIndiaRentalNetINR =
          indiaRentalDetailINR.netAfterInterest +
          usRentalUnderIndiaRulesINR.netAfterInterest;

        function spouseVal(fieldKey, spouseNum) {
          const total = toINR(effectiveIncome[fieldKey] || 0);
          if (!effectiveIncome[fieldKey + "_split"]) return total / 2;
          const rawTotal = toINR(income[fieldKey] || 0);
          const s1Stored = toINR(
            effectiveIncome[fieldKey + "_s1"] !== undefined
              ? effectiveIncome[fieldKey + "_s1"]
              : rawTotal / 2,
          );
          const ratioBase = rawTotal > 0 ? rawTotal : total > 0 ? total : 1;
          const frac = Math.max(0, Math.min(1, s1Stored / ratioBase));
          const s1 = total * frac;
          return spouseNum === 1 ? s1 : Math.max(0, total - s1);
        }

        const includeGlobalInvestment = expatCountry !== "Malaysia";
        const indiaStcgINR =
          isCombined && !includeGlobalInvestment
            ? 0
            : toINR(effectiveIncome.shortTermGains || 0);
        const indiaLtcgINR =
          isCombined && !includeGlobalInvestment
            ? 0
            : toINR(effectiveIncome.longTermGains || 0);

        const indiaOrdinaryIncomeINR = isCombined
          ? malaysiaTerritorialExempt
            ? 0
            : toINR(effectiveIncome.wages) +
              toINR(effectiveIncome.businessIncome) +
              toINR(effectiveIncome.iraDistribution || 0) +
              toINR(effectiveIncome.interest) +
              toINR(effectiveIncome.ordinaryDividends)
          : toINR(effectiveIncome.indiaSalary) +
            toINR(effectiveIncome.indiaOtherIncome);

        const indiaTotalIncomeINR =
          indiaOrdinaryIncomeINR +
          totalIndiaRentalNetINR +
          indiaStcgINR +
          indiaLtcgINR;

        const indiaOrdS1 = isCombined
          ? malaysiaTerritorialExempt
            ? 0
            : spouseVal("wages", 1) +
              spouseVal("businessIncome", 1) +
              toINR(effectiveIncome.iraDistribution || 0) / 2 +
              (includeGlobalInvestment
                ? toINR(effectiveIncome.interest || 0) / 2 +
                  toINR(effectiveIncome.ordinaryDividends || 0) / 2
                : 0)
          : spouseVal("indiaSalary", 1) + spouseVal("indiaOtherIncome", 1);
        const indiaOrdS2 = isCombined
          ? malaysiaTerritorialExempt
            ? 0
            : spouseVal("wages", 2) +
              spouseVal("businessIncome", 2) +
              toINR(effectiveIncome.iraDistribution || 0) / 2 +
              (includeGlobalInvestment
                ? toINR(effectiveIncome.interest || 0) / 2 +
                  toINR(effectiveIncome.ordinaryDividends || 0) / 2
                : 0)
          : spouseVal("indiaSalary", 2) + spouseVal("indiaOtherIncome", 2);

        const indiaRentalPerSpouse = totalIndiaRentalNetINR / 2;
        const indiaSpecialS1 = {
          stcg: isCombined && !includeGlobalInvestment ? 0 : spouseVal("shortTermGains", 1),
          ltcgEquity:
            isCombined && !includeGlobalInvestment ? 0 : spouseVal("longTermGains", 1),
          ltcgOther: 0,
        };
        const indiaSpecialS2 = {
          stcg: isCombined && !includeGlobalInvestment ? 0 : spouseVal("shortTermGains", 2),
          ltcgEquity:
            isCombined && !includeGlobalInvestment ? 0 : spouseVal("longTermGains", 2),
          ltcgOther: 0,
        };

        const hasSalaryIndia = isCombined
          ? toINR(effectiveIncome.wages) > 0
          : toINR(effectiveIncome.indiaSalary) > 0;

        const indiaTd = INDIA_TAX_DATA[taxYear];
        let indiaResult = null;
        if (includeExpat) {
          if (expatCountry === "Malaysia") {
            const r1 = calcMalaysiaTax(
              indiaOrdS1 + indiaRentalPerSpouse,
              expatTaxRegime === "resident",
              indiaSpecialS1,
              taxYear,
            );
            const r2 = calcMalaysiaTax(
              indiaOrdS2 + indiaRentalPerSpouse,
              expatTaxRegime === "resident",
              indiaSpecialS2,
              taxYear,
            );
            indiaResult = {
              spouse1: {
                incomeINR: indiaOrdS1 + indiaRentalPerSpouse,
                result: r1,
              },
              spouse2: {
                incomeINR: indiaOrdS2 + indiaRentalPerSpouse,
                result: r2,
              },
              total: {
                totalINR: r1.total + r2.total,
                totalCess: r1.cess + r2.cess,
                totalSurcharge: r1.surcharge + r2.surcharge,
                effectiveRate:
                  indiaTotalIncomeINR > 0
                    ? ((r1.total + r2.total) / indiaTotalIncomeINR) * 100
                    : 0,
              },
              indiaPropertyDetail: {
                ...indiaRentalDetailINR,
                grossRent: toINR(effectiveIncome.indiaRentalGross),
                reTax: toINR(effectiveIncome.indiaRentalReTax),
                additionalExpenses: toINR(effectiveIncome.indiaRentalAddlExpenses),
                interest: toINR(effectiveIncome.indiaRentalInterest),
                label: "Malaysia Property",
              },
              usPropertyDetail: {
                ...usRentalUnderIndiaRulesINR,
                grossRent: toINR(effectiveIncome.usRentalGross),
                reTax: toINR(effectiveIncome.usRentalPropertyTax),
                additionalExpenses: 0,
                interest: toINR(effectiveIncome.usRentalMortgageInterest),
                label: "US Property (taxed under Malaysia rules)",
              },
              totalRentalNetINR: totalIndiaRentalNetINR,
            };
          } else if (indiaTd) {
            const r1 = calcIndiaTax(
              indiaOrdS1 + indiaRentalPerSpouse,
              indiaTd,
              useNewIndia,
              hasSalaryIndia,
              indiaSpecialS1,
              taxYear,
            );
            const r2 = calcIndiaTax(
              indiaOrdS2 + indiaRentalPerSpouse,
              indiaTd,
              useNewIndia,
              hasSalaryIndia,
              indiaSpecialS2,
              taxYear,
            );
            indiaResult = {
              spouse1: {
                incomeINR: indiaOrdS1 + indiaRentalPerSpouse,
                result: r1,
              },
              spouse2: {
                incomeINR: indiaOrdS2 + indiaRentalPerSpouse,
                result: r2,
              },
              total: {
                totalINR: r1.total + r2.total,
                totalCess: r1.cess + r2.cess,
                totalSurcharge: r1.surcharge + r2.surcharge,
                effectiveRate:
                  indiaTotalIncomeINR > 0
                    ? ((r1.total + r2.total) / indiaTotalIncomeINR) * 100
                    : 0,
              },
              indiaPropertyDetail: {
                ...indiaRentalDetailINR,
                grossRent: toINR(effectiveIncome.indiaRentalGross),
                reTax: toINR(effectiveIncome.indiaRentalReTax),
                additionalExpenses: toINR(effectiveIncome.indiaRentalAddlExpenses),
                interest: toINR(effectiveIncome.indiaRentalInterest),
                label: "India Property",
              },
              usPropertyDetail: {
                ...usRentalUnderIndiaRulesINR,
                grossRent: toINR(effectiveIncome.usRentalGross),
                reTax: toINR(effectiveIncome.usRentalPropertyTax),
                additionalExpenses: 0,
                interest: toINR(effectiveIncome.usRentalMortgageInterest),
                label: "US Property (taxed under India rules)",
              },
              totalRentalNetINR: totalIndiaRentalNetINR,
            };
          }
        }

        const indiaTaxUSD = indiaResult
          ? indiaResult.total.totalINR / expatToUsd
          : 0;

        const usIncome = {
          wages:
            toUSD(effectiveIncome.wages) +
            toUSD(effectiveIncome.iraDistribution || 0) +
            toUSD(effectiveIncome.ssTaxableIncome || 0),
          businessIncome: toUSD(effectiveIncome.businessIncome),
          rentalNet: usRentalNet,
          rentalMortgageInterest: toUSD(effectiveIncome.usRentalMortgageInterest),
          rentalPropertyTax: toUSD(effectiveIncome.usRentalPropertyTax),
          rentalOtherExpenses: toUSD(effectiveIncome.usRentalOtherExpenses),
          interest: toUSD(effectiveIncome.interest),
          ordinaryDividends: toUSD(effectiveIncome.ordinaryDividends),
          qualifiedDividends: toUSD(effectiveIncome.qualifiedDividends),
          exemptIntDividends: toUSD(effectiveIncome.exemptIntDividends),
          sec199aDividends: toUSD(effectiveIncome.sec199aDividends),
          longTermGains: toUSD(effectiveIncome.longTermGains),
          shortTermGains: toUSD(effectiveIncome.shortTermGains),
          filingStatus,
          year: taxYear,
          indiaTaxPaid: indiaTaxUSD,
          useFEIE,
        };

        let usResult = null;
        if (includeUS && US_TAX_DATA[taxYear]) {
          usResult = calcUSTax(usIncome);
        }

        const totalUSTax = usResult ? usResult.netUSTax : 0;
        const totalIndiaTax = indiaResult ? indiaResult.total.totalINR : 0;
        const totalIndiaTaxUSD = totalIndiaTax / expatToUsd;
        const combinedTaxUSD = totalUSTax + totalIndiaTaxUSD;
        const combinedIncomeUSD = isCombined
          ? usResult
            ? usResult.totalGrossIncome
            : indiaTotalIncomeINR / expatToUsd
          : (usResult ? usResult.totalGrossIncome : 0) +
            indiaTotalIncomeINR / expatToUsd;

        return {
          passiveIncomeMode,
          passiveDerived,
          effectiveIncome,
          expatToUsd,
          isCombined,
          malaysiaTerritorialExempt,
          usRentalGrossUSD,
          usPropertyPriceUSD,
          usAutoDepreciation,
          usRentalNet,
          indiaRentalDetailINR,
          usRentalUnderIndiaRulesINR,
          totalIndiaRentalNetINR,
          indiaStcgINR,
          indiaLtcgINR,
          indiaOrdinaryIncomeINR,
          indiaTotalIncomeINR,
          indiaResult,
          indiaTaxUSD,
          usIncome,
          usResult,
          totalUSTax,
          totalIndiaTax,
          totalIndiaTaxUSD,
          combinedTaxUSD,
          combinedIncomeUSD,
        };
      }

      function buildProjectionRows({ settings, income }) {
        const years = Math.max(
          1,
          Math.min(60, Math.round(income.simulationYears || 10)),
        );
        const inflationPct = Math.max(0, income.inflationPct || 0);
        const earnedIncomeGrowthPct = Math.max(
          0,
          income.earnedIncomeGrowthPct || 0,
        );
        const rentalGrowthPct = Math.max(
          0,
          income.rentalGrowthPct || inflationPct,
        );
        const contributionBase = Math.max(0, income.annualPortfolioContribution || 0);
        const withdrawalBase = Math.max(0, income.annualPortfolioWithdrawal || 0);
        const rows = [];
        const startPortfolio = Math.max(0, income.portfolioValue || 0);
        const startBrokeragePct = clampPct(income.portfolioBrokeragePct, 60) / 100;
        let brokerageStart = startPortfolio * startBrokeragePct;
        let iraStart = startPortfolio - brokerageStart;
        let rothStart = Math.max(0, income.portfolioRothValue || 0);

        for (let i = 0; i < years; i += 1) {
          const projectedIncome = {
            ...income,
            wages: growByRate(income.wages, earnedIncomeGrowthPct, i),
            businessIncome: growByRate(
              income.businessIncome,
              earnedIncomeGrowthPct,
              i,
            ),
            indiaSalary: growByRate(income.indiaSalary, earnedIncomeGrowthPct, i),
            indiaOtherIncome: growByRate(
              income.indiaOtherIncome,
              inflationPct,
              i,
            ),
            usRentalGross: growByRate(income.usRentalGross, rentalGrowthPct, i),
            usRentalMortgageInterest: growByRate(
              income.usRentalMortgageInterest,
              inflationPct,
              i,
            ),
            usRentalPropertyTax: growByRate(
              income.usRentalPropertyTax,
              inflationPct,
              i,
            ),
            usRentalOtherExpenses: growByRate(
              income.usRentalOtherExpenses,
              inflationPct,
              i,
            ),
            indiaRentalGross: growByRate(
              income.indiaRentalGross,
              rentalGrowthPct,
              i,
            ),
            indiaRentalReTax: growByRate(
              income.indiaRentalReTax,
              inflationPct,
              i,
            ),
            indiaRentalAddlExpenses: growByRate(
              income.indiaRentalAddlExpenses,
              inflationPct,
              i,
            ),
            indiaRentalInterest: growByRate(
              income.indiaRentalInterest,
              inflationPct,
              i,
            ),
            shortTermGains:
              income.passiveIncomeMode === "portfolio"
                ? income.shortTermGains || 0
                : growByRate(income.shortTermGains, inflationPct, i),
            longTermGains:
              income.passiveIncomeMode === "portfolio"
                ? income.longTermGains || 0
                : growByRate(income.longTermGains, inflationPct, i),
            interest:
              income.passiveIncomeMode === "portfolio"
                ? income.interest || 0
                : growByRate(income.interest, inflationPct, i),
            ordinaryDividends:
              income.passiveIncomeMode === "portfolio"
                ? income.ordinaryDividends || 0
                : growByRate(income.ordinaryDividends, inflationPct, i),
            qualifiedDividends:
              income.passiveIncomeMode === "portfolio"
                ? income.qualifiedDividends || 0
                : growByRate(income.qualifiedDividends, inflationPct, i),
            exemptIntDividends:
              income.passiveIncomeMode === "portfolio"
                ? income.exemptIntDividends || 0
                : growByRate(income.exemptIntDividends, inflationPct, i),
            sec199aDividends:
              income.passiveIncomeMode === "portfolio"
                ? income.sec199aDividends || 0
                : growByRate(income.sec199aDividends, inflationPct, i),
            portfolioValue:
              income.passiveIncomeMode === "portfolio"
                ? Math.max(0, brokerageStart + iraStart)
                : 0,
          };

          const age = Math.max(0, (income.currentAge || 40) + i);
          const annualSSRaw =
            age >= (income.ssStartAge || 67)
              ? growByRate((income.ssMonthlyBenefit || 0) * 12, inflationPct, i)
              : 0;
          const rmdAmount =
            income.passiveIncomeMode === "portfolio" ? calcRMD(iraStart, age) : 0;
          const baseOtherIncome =
            projectedIncome.wages +
            projectedIncome.businessIncome +
            (projectedIncome.interest || 0) +
            (projectedIncome.ordinaryDividends || 0) +
            (projectedIncome.shortTermGains || 0) +
            (projectedIncome.longTermGains || 0) +
            rmdAmount;
          const ssTaxableIncome = calcSSTaxableAmount(
            annualSSRaw,
            baseOtherIncome,
            (settings.filingStatus || "mfj") === "mfj",
          );
          const rothConversionUSD = calcOptimalRothConversion({
            settings,
            projectedIncome,
            iraBalance: iraStart,
            rmdAmount,
            ssTaxableIncome,
            ordinaryIncomeBeforeConversion: baseOtherIncome,
          });

          projectedIncome.iraDistribution = rmdAmount + rothConversionUSD;
          projectedIncome.ssGrossIncome = annualSSRaw;
          projectedIncome.ssTaxableIncome = ssTaxableIncome;

          const scenario = computeScenario({ settings, income: projectedIncome });

          // Calculate baseline scenario without any passive portfolio income to find the tax drag
          const baselineIncome = {
            ...projectedIncome,
            shortTermGains: 0,
            longTermGains: 0,
            interest: 0,
            ordinaryDividends: 0,
            qualifiedDividends: 0,
            exemptIntDividends: 0,
            sec199aDividends: 0,
            portfolioValue: 0,
          };
          const baselineScenario = computeScenario({ settings, income: baselineIncome });

          const usTaxDragUSD = Math.max(0, (scenario.totalUSTax || 0) - (baselineScenario.totalUSTax || 0));
          const expatTaxDragUSD = Math.max(0, (scenario.totalIndiaTaxUSD || 0) - (baselineScenario.totalIndiaTaxUSD || 0));
          const combinedTaxDragUSD = usTaxDragUSD + expatTaxDragUSD;

          const contribution = growByRate(contributionBase, inflationPct, i);
          const withdrawal = growByRate(withdrawalBase, inflationPct, i);
          const passiveCashUSD = scenario.usIncome
            ? scenario.usIncome.interest +
              scenario.usIncome.ordinaryDividends +
              scenario.usIncome.exemptIntDividends +
              scenario.usIncome.longTermGains +
              scenario.usIncome.shortTermGains
            : 0;
          const brokerageReturnPct = scenario.passiveDerived?.brokerageReturnPct || 0;
          const iraReturnPct = scenario.passiveDerived?.iraReturnPct || 0;
          const rothReturnPct = scenario.passiveDerived?.rothReturnPct || 0;
          const brokerageEnd =
            income.passiveIncomeMode === "portfolio"
              ? Math.max(
                  0,
                  brokerageStart * (1 + brokerageReturnPct / 100) +
                    contribution -
                    withdrawal -
                    combinedTaxDragUSD,
                )
              : 0;
          const iraEnd =
            income.passiveIncomeMode === "portfolio"
              ? Math.max(
                  0,
                  (iraStart - rmdAmount - rothConversionUSD) *
                    (1 + iraReturnPct / 100),
                )
              : 0;
          const rothEnd =
            income.passiveIncomeMode === "portfolio"
              ? Math.max(
                  0,
                  (rothStart + rothConversionUSD) * (1 + rothReturnPct / 100),
                )
              : 0;
          const portfolioStart = brokerageStart + iraStart + rothStart;
          const portfolioEnd = brokerageEnd + iraEnd + rothEnd;
          const inflationFactor = Math.pow(1 + inflationPct / 100, i + 1);

          rows.push({
            year: settings.taxYear + i,
            incomeUSD: scenario.combinedIncomeUSD,
            usTaxUSD: scenario.totalUSTax,
            expatTaxUSD: scenario.totalIndiaTaxUSD,
            combinedTaxUSD: scenario.combinedTaxUSD,
            effectiveRatePct:
              scenario.combinedIncomeUSD > 0
                ? (scenario.combinedTaxUSD / scenario.combinedIncomeUSD) * 100
                : 0,
            passiveCashUSD,
            portfolioStart,
            portfolioContribution: contribution,
            portfolioWithdrawal: withdrawal,
            portfolioEnd,
            brokerageEnd,
            iraEnd,
            rothEnd,
            age,
            rmdUSD: rmdAmount,
            ssIncomeUSD: annualSSRaw,
            ssTaxableUSD: ssTaxableIncome,
            rothConversionUSD,
            usTaxDragUSD,
            expatTaxDragUSD,
            combinedTaxDragUSD,
            realPortfolioEnd:
              income.passiveIncomeMode === "portfolio" && inflationFactor > 0
                ? portfolioEnd / inflationFactor
                : 0,
          });

          if (income.passiveIncomeMode === "portfolio") {
            brokerageStart = brokerageEnd;
            iraStart = iraEnd;
            rothStart = rothEnd;
          }
        }

        return rows;
      }

      function normalizeIncomeToUSD(income, settings) {
        const expatToUsd =
          settings.expatCountry === "Malaysia" ? settings.myrToUsd : settings.inrToUsd;
        if (settings.currency === "USD") return { ...income };
        const usdIncome = { ...income };
        const baseMoneyFields = new Set([
          "wages",
          "businessIncome",
          "shortTermGains",
          "longTermGains",
          "interest",
          "ordinaryDividends",
          "qualifiedDividends",
          "exemptIntDividends",
          "sec199aDividends",
          "usRentalGross",
          "usRentalMortgageInterest",
          "usRentalPropertyTax",
          "usRentalDepreciation",
          "usRentalOtherExpenses",
          "indiaRentalGross",
          "indiaRentalReTax",
          "indiaRentalAddlExpenses",
          "indiaRentalInterest",
          "indiaSalary",
          "indiaOtherIncome",
          "portfolioValue",
          "annualPortfolioContribution",
          "annualPortfolioWithdrawal",
        ]);
        Object.keys(usdIncome).forEach((key) => {
          const value = usdIncome[key];
          if (!Number.isFinite(value)) return;
          if (baseMoneyFields.has(key) || key.endsWith("_s1")) {
            usdIncome[key] = value / expatToUsd;
          }
        });
        return usdIncome;
      }

      function fmt(n, currency = "USD", compact = false) {
        if (isNaN(n) || !isFinite(n)) return "—";
        const absN = Math.abs(Math.round(n));
        const sign = n < 0 ? "-" : "";
        if (currency === "INR") {
          if (compact) {
            if (absN >= 10000000)
              return sign + "₹" + (absN / 10000000).toFixed(2) + " Cr";
            if (absN >= 100000)
              return sign + "₹" + (absN / 100000).toFixed(2) + " L";
          }
          return (
            sign +
            "₹" +
            new Intl.NumberFormat("en-IN", { maximumFractionDigits: 0 }).format(
              absN,
            )
          );
        }
        if (currency === "MYR") {
          if (compact) {
            if (absN >= 1000000)
              return sign + "RM" + (absN / 1000000).toFixed(2) + "M";
            if (absN >= 100000)
              return sign + "RM" + (absN / 1000).toFixed(1) + "K";
          }
          return (
            sign +
            "RM" +
            new Intl.NumberFormat("en-MY", { maximumFractionDigits: 0 }).format(
              absN,
            )
          );
        }
        if (compact && absN >= 100000)
          return sign + "$" + (absN / 1000).toFixed(1) + "K";
        return new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: "USD",
          maximumFractionDigits: 0,
        }).format(Math.round(n));
      }

      function fmtN(n, currency) {
        if (isNaN(n) || !isFinite(n)) return "—";
        const locale = currency === "INR" ? "en-IN" : "en-US";
        return Math.round(n).toLocaleString(locale);
      }

      function pct(n) {
        if (isNaN(n)) return "—";
        return n.toFixed(2) + "%";
      }

      function parseAmount(raw) {
        // Strip currency symbols, commas (works for both US 1,000 and Indian 1,00,000), spaces
        const cleaned = String(raw)
          .replace(/[\$\u20b9\u20ac\u00a3,\s]/g, "")
          .trim();
        const n = parseFloat(cleaned);
        return isNaN(n) ? 0 : n;
      }

      function NumberInput({ label, value, onChange, prefix, suffix, note }) {
        const [display, setDisplay] = React.useState(
          value === 0 ? "" : String(value),
        );
        const focusedRef = React.useRef(false);
        React.useEffect(() => {
          if (!focusedRef.current) {
            setDisplay(value === 0 ? "" : String(value));
          }
        }, [value]);
        return (
          <div className="field-group">
            {label && <div className="label">{label}</div>}
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              {prefix && (
                <span
                  style={{ fontSize: 14, color: "var(--text3)", minWidth: 14 }}
                >
                  {prefix}
                </span>
              )}
              <input
                type="text"
                inputMode="decimal"
                value={display}
                placeholder="0"
                onFocus={() => {
                  focusedRef.current = true;
                }}
                onChange={(e) => {
                  const nextDisplay = e.target.value;
                  setDisplay(nextDisplay);
                  onChange(parseAmount(nextDisplay));
                }}
                onBlur={(e) => {
                  focusedRef.current = false;
                  const n = parseAmount(e.target.value);
                  onChange(n);
                  setDisplay(n === 0 ? "" : String(n));
                }}
                onPaste={(e) => {
                  e.preventDefault();
                  const pasted = e.clipboardData.getData("text");
                  const n = parseAmount(pasted);
                  onChange(n);
                  setDisplay(n === 0 ? "" : String(n));
                }}
                style={{
                  textAlign: "right",
                  fontFamily: "'IBM Plex Mono',monospace",

              />

          </div>
        );

      // SpouseField: combined input with optional per-spouse split toggle
      function SpouseField({ label, fieldKey, income, onChange, pfx, note }) {
        const combined = income[fieldKey] || 0;
        const isSplit = !!income[fieldKey + "_split"];
        const s1val =
          income[fieldKey + "_s1"] !== undefined
            ? income[fieldKey + "_s1"]
            : combined / 2;
        const s2val = Math.max(0, combined - s1val);

        function setField(updates) {
          onChange({ ...income, ...updates });
        }
        function toggleSplit(on) {
          setField({
            [fieldKey + "_split"]: on,
            [fieldKey + "_s1"]: combined / 2,
          });
        }
        function setCombined(v) {
          // When combined changes, keep s1 fraction proportional if split active
          const frac = combined > 0 ? s1val / combined : 0.5;
          setField({
            [fieldKey]: v,
            [fieldKey + "_s1"]: isSplit ? Math.round(v * frac) : v / 2,
          });
        }
        function setS1(v) {
          const clamped = Math.min(v, combined);
          setField({ [fieldKey + "_s1"]: clamped });
        }

        return (
          <div
            className="field-group"
            style={{ marginBottom: isSplit ? 16 : 12 }}
          >
            <div
              style={{
                display: "flex",
                alignItems: "center",
                justifyContent: "space-between",
                marginBottom: 6,
              }}
            >
              <div className="label" style={{ margin: 0 }}>
                {label}
              </div>
              <button
                onClick={() => toggleSplit(!isSplit)}
                style={{
                  fontSize: 10,
                  padding: "2px 7px",
                  borderRadius: 4,
                  border: "1px solid var(--border)",
                  background: isSplit ? "var(--blue3)" : "transparent",
                  color: isSplit ? "var(--blue)" : "var(--text3)",
                  cursor: "pointer",
                  fontFamily: "inherit",
                  fontWeight: 500,
                  whiteSpace: "nowrap",
                }}
              >
                {isSplit ? "⇄ by spouse" : "split"}
              </button>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <span
                style={{ fontSize: 14, color: "var(--text3)", minWidth: 14 }}
              >
                {pfx}
              </span>
              <input
                type="text"
                inputMode="decimal"
                value={combined === 0 ? "" : String(combined)}
                placeholder="0"
                onChange={(e) => {
                  const d = e.target.value;
                  setCombined(parseAmount(d) || 0);
                }}
                onBlur={(e) => {
                  const n = parseAmount(e.target.value);
                  setCombined(n);
                }}
                onPaste={(e) => {
                  e.preventDefault();
                  const n = parseAmount(e.clipboardData.getData("text"));
                  setCombined(n);
                }}
                style={{
                  textAlign: "right",
                  fontFamily: "'IBM Plex Mono',monospace",
                  flex: 1,
                }}
              />
            </div>
            {note && (
              <div
                style={{ fontSize: 11, color: "var(--text3)", marginTop: 3 }}
              >
                {note}
              </div>
            )}
            {isSplit && combined > 0 && (
              <div
                style={{
                  marginTop: 8,
                  background: "var(--bg3)",
                  border: "1px solid var(--border)",
                  borderRadius: 6,
                  padding: "10px 12px",
                }}
              >
                <div
                  style={{
                    fontSize: 11,
                    color: "var(--text3)",
                    marginBottom: 8,
                  }}
                >
                  Split between spouses (total: {pfx}
                  {combined.toLocaleString()})
                </div>
                <div
                  style={{
                    display: "grid",
                    gridTemplateColumns: "1fr 1fr",
                    gap: 8,
                  }}
                >
                  <div>
                    <div
                      style={{
                        fontSize: 11,
                        color: "var(--text2)",
                        marginBottom: 4,
                      }}
                    >
                      Spouse 1
                    </div>
                    <div
                      style={{ display: "flex", alignItems: "center", gap: 4 }}
                    >
                      <span style={{ fontSize: 12, color: "var(--text3)" }}>
                        {pfx}
                      </span>
                      <input
                        type="text"
                        inputMode="decimal"
                        value={s1val === 0 ? "" : String(Math.round(s1val))}
                        placeholder="0"
                        onChange={(e) =>
                          setS1(parseAmount(e.target.value) || 0)
                        }
                        onBlur={(e) => setS1(parseAmount(e.target.value))}
                        onPaste={(e) => {
                          e.preventDefault();
                          setS1(parseAmount(e.clipboardData.getData("text")));
                        }}
                        style={{
                          textAlign: "right",
                          fontFamily: "'IBM Plex Mono',monospace",
                          width: "100%",
                          fontSize: 13,
                        }}
                      />
                    </div>
                  </div>
                  <div>
                    <div
                      style={{
                        fontSize: 11,
                        color: "var(--text2)",
                        marginBottom: 4,
                      }}
                    >
                      Spouse 2 (auto)
                    </div>
                    <div
                      style={{
                        background: "var(--bg4)",
                        border: "1px solid var(--border)",
                        borderRadius: "var(--radius)",
                        padding: "8px 10px",
                        fontSize: 13,
                        fontFamily: "'IBM Plex Mono',monospace",
                        color: "var(--text3)",
                        textAlign: "right",
                      }}
                    >
                      {pfx}
                      {Math.round(s2val).toLocaleString()}
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      function BRow({ label, value, sub, className, color }) {
        return (
          <div

              style={{ color: color || (sub ? "var(--text2)" : "var(--text)") }}

      function normalizeExportText(text) {
        return String(text || "")
          .replace(/\u00a0/g, " ")
          .split("\n")
          .map((line) => line.trim())
          .filter(Boolean)
          .join("\n");
      }

      function buildExportReport({
        currentTab,
        settings,
        income,
        effectiveIncome,
        passiveIncomeMode,
        passiveDerived,
        usIncome,
        usResult,
        indiaResult,
        totalUSTax,
        totalIndiaTax,
        totalIndiaTaxUSD,
        combinedTaxUSD,
        combinedIncomeUSD,
        totalIndiaRentalNetINR,
        expatToUsd,
        projectionRows,
        uiSnapshot,
      }) {
        const localCur = settings.expatCountry === "Malaysia" ? "MYR" : "INR";
        const taxesGlobalInvestment = settings.expatCountry === "India";
        const taxesWorldwideProperty = settings.expatCountry === "India";
        const tabLabel =
          {
            home: "Overview",
            setup: "Setup",
            income: "Income",
            results: "Taxes",
            planning: "Planning",
          }[currentTab] || currentTab;
        const lines = [];

        function addSection(title) {
          if (lines.length) lines.push("");
          lines.push(title);
          lines.push("=".repeat(title.length));
        }

        function addLine(label, value) {
          lines.push(`${label}: ${value}`);
        }

        function fmtInput(value, currency) {
          const n = value || 0;
          return `${fmt(n, currency)} (raw ${n})`;
        }

        addSection("EXPAT TAX CALCULATOR EXPORT");
        addLine("Generated at", new Date().toISOString());
        addLine("Current tab", tabLabel);

        addSection("SETTINGS");
        addLine("Expat country", settings.expatCountry);
        addLine("Tax year", settings.taxYear);
        addLine(
          "US filing status",
          settings.filingStatus === "mfj" ? "Married Filing Jointly" : "Single",
        );
        addLine(
          "India regime / Malaysia residency",
          settings.expatCountry === "Malaysia"
            ? settings.expatTaxRegime
            : settings.useNewIndia
              ? "New regime"
              : "Old regime",
        );
        if (settings.expatCountry === "Malaysia") {
          addLine(
            "Malaysia foreign-source treatment",
            settings.territorialForeignIncomeExempt
              ? "Exclude foreign-source income from Malaysia tax"
              : "Tax shared combined income in Malaysia view",
          );
        }
        addLine("Use FEIE", settings.useFEIE ? "Yes" : "No");
        addLine(
          "Income entry mode",
          settings.splitIncomeMode === "combined" ? "Combined" : "Separate",
        );
        addLine("Show US taxes", settings.includeUS ? "Yes" : "No");
        addLine("Show expat-country taxes", settings.includeExpat ? "Yes" : "No");
        addLine("Input currency", settings.currency);
        addLine("Local FX per USD", `${localCur} ${expatToUsd}`);
        addLine(
          "US rental property price",
          fmtInput(settings.usPropertyPrice || 0, settings.currency),
        );

        addSection("INCOME ENTRIES");
        addLine("Passive income source", passiveIncomeMode === "portfolio" ? "Portfolio-derived" : "Manual");
        addLine("Wages / Salary", fmtInput(effectiveIncome.wages, settings.currency));
        addLine(
          "Business / Self-Employment Income",
          fmtInput(effectiveIncome.businessIncome, settings.currency),
        );
        addLine(
          "Short-Term Cap Gains",
          fmtInput(effectiveIncome.shortTermGains, settings.currency),
        );
        addLine(
          "Long-Term Cap Gains",
          fmtInput(effectiveIncome.longTermGains, settings.currency),
        );
        addLine("Interest Income", fmtInput(effectiveIncome.interest, settings.currency));
        addLine(
          "Ordinary Dividends",
          fmtInput(effectiveIncome.ordinaryDividends, settings.currency),

        addLine(
          "Qualified Dividends",

        );
        addLine(
          "Exempt-Interest Dividends",
          fmtInput(effectiveIncome.exemptIntDividends, settings.currency),
        );
        addLine(

        addLine("US Rental Gross", fmtInput(effectiveIncome.usRentalGross, settings.currency));

          "FTC Credit Used",
          usResult ? fmt(usResult.ftcClaimed, "USD") : "N/A",

        addLine("Section 199A Dividends", fmtInput(usIncome.sec199aDividends, "USD"));
        addLine("Long-Term Gains", fmtInput(usIncome.longTermGains, "USD"));
        addLine("Short-Term Gains", fmtInput(usIncome.shortTermGains, "USD"));
        addLine("India Tax Paid Credit Input", fmtInput(usIncome.indiaTaxPaid, "USD"));

        if (usResult) {
          addSection("US RESULT DETAIL");
          addLine("FEIE Exclusion", fmt(usResult.feieExclusion, "USD"));
          addLine("FEIE Excluded Wages", fmt(usResult.feieExcludedWages || 0, "USD"));
          addLine(
            "FEIE Excluded Business Income",
            fmt(usResult.feieExcludedBusiness || 0, "USD"),
          );

            "FEIE Stacking Income",
            fmt(usResult.feieStackingIncome || 0, "USD"),
          );
          addLine("AGI", fmt(usResult.agi, "USD"));
          addLine("Gross Income", fmt(usResult.totalGrossIncome, "USD"));
          addLine("Deductions", fmt(usResult.deductions, "USD"));
          addLine("Standard Deduction", fmt(usResult.stdDed, "USD"));
          addLine("Personal Exemption", fmt(usResult.personalEx, "USD"));
          addLine("Taxable Ordinary Income", fmt(usResult.taxableOrdinary, "USD"));
